a2:{n:'A2',blocks:[['Passats',1,6],['Pronoms i futur',7,12],['Comparar, condicional i subjuntiu',13,18],['Opinions, connectors i vida real',19,24]]}};
V.tests=()=>{let h='<h1>Test de nivell</h1><p>40 preguntes en 4 blocs. Per aprovar cal un <b>90 %</b> total i un mínim del <b>75 %</b> a cada bloc. Sense ajudes ni explicacions fins al final. Si no aproves, pots tornar-ho a provar passades 24 hores.</p>';
  ['a1','a2'].forEach(lv=>{const r=S.tests[lv];h+='<div class="card"><h3>Test '+TB[lv].n+'</h3>'+(r?'<div>'+(r.pass?'<span class="ok">✓ Aprovat</span>':'<span class="err">No aprovat</span>')+' · '+r.pct+' % · '+esc(r.date)+'</div>'+(!r.pass&&r.next>Date.now()?'<div class="muted">Podràs tornar-ho a provar a partir de '+new Date(r.next).toLocaleString('ca-ES')+'.</div>':''):'<div class="muted">Encara no l\'has fet.</div>')+'<button class="btn block" style="margin-top:10px" data-a="tstart" data-v="'+lv+'">Comença el test '+TB[lv].n+'</button></div>'});return h};
ACT.tstart=lv=>{const r=S.tests[lv];if(r&&!r.pass&&r.next>Date.now()){toast('Encara no pots repetir el test (24 h)');return}
  const qs=[];TB[lv].blocks.forEach((b,bi)=>{const cand=[];LESSONS.filter(l=>l.lv===lv&&l.n>=b[1]&&l.n<=b[2]).forEach(l=>l.qs.forEach((q,i)=>{if(q.k==='choice'||q.k==='type'||q.k==='build')cand.push([l.id,i])}));
    pick(cand,10).forEach(c=>{const q=lq(c[0],c[1]);q.blk=bi;q.kind='Bloc '+(bi+1)+' · '+b[0];qs.push(q)})});
  startSession(qs,{test:1,per:2,noRetry:1,onDone:r2=>{const tot=r2.acc;const bl=TB[lv].blocks.map((b,i)=>{const x=r2.blk[i]||{ok:0,tot:0};return{n:b[0],p:pct(x.ok,x.tot)}});
    const pass=tot>=.9&&bl.every(b=>b.p>=75);const first=!(S.tests[lv]&&S.tests[lv].pass);
    S.tests[lv]={pass:pass||(S.tests[lv]&&S.tests[lv].pass)||false,pct:Math.round(tot*100),date:today(),next:pass?0:Date.now()+864e5,blocks:bl};
    if(!pass&&S.tests[lv].pass)S.tests[lv].next=0;
    r2.html='<h3>'+(pass?'🎓 Test '+TB[lv].n+' aprovat!':'Encara no')+'</h3>'+bl.map(b=>'<div class="res"><span>'+esc(b.n)+'</span><b class="'+(b.p>=75?'ok':'err')+'">'+b.p+' %</b></div>').join('')+(pass?'':'<p class="muted">Cal 90 % total i 75 % a cada bloc. Repassa les lliçons dels blocs en vermell i torna-ho a provar d\'aquí 24 hores.</p>');
    if(pass&&first)addXP(100);save();checkBadges()}})};

  h+='<h2>Ajustos</h2><div class="card"><b>Objectiu diari</b><div class="pills">'+[10,30,50,100].map(g=>'<button class="pill '+(S.goal===g?'on':'')+'" data-a="goal" data-v="'+g+'">'+g+' XP</button>').join('')+'</div><b>Aspecte</b><div class="pills">'+[['auto','Automàtic'],['dark','Pissarra'],['light','Paper']].map(x=>'<button class="pill '+(S.set.theme===x[0]?'on':'')+'" data-a="theme_set" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><b>Veu</b><div class="pills"><button class="pill '+(S.set.voice?'on':'')+'" data-a="voice">'+(S.set.voice?'🔊 Activada':'🔇 Silenciada')+'</button><button class="pill" data-a="vtest">▶ Prova la veu</button></div><b>Velocitat</b><div class="pills">'+[[.7,'Lent'],[.9,'Normal'],[1.05,'Ràpid']].map(x=>'<button class="pill '+(S.set.rate===x[0]?'on':'')+'" data-a="rate" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+voiceBox()+'<b>Nivell A2</b><div class="pills"><button class="pill '+(S.set.blur!==false?'on':'')+'" data-a="blur">'+(S.set.blur!==false?'Traducció difuminada':'Traducció visible')+'</button></div><b>Les meves dades</b><div class="pills"><button class="pill" data-a="meedit">👤 Edita «Sobre mi»</button></div><b>Codi d\'accés</b><p class="muted">Per a professorat o per provar l\'app: obre tots els jocs sense acabar les lliçons.</p>'+(S.set.tkey?'<p class="ok">Accés especial actiu.</p><button class="btn sec small" data-a="tcodeoff">Desactiva</button>':'<div class="row"><input id="tc" class="grow" type="text" placeholder="Codi" autocomplete="off" autocapitalize="off" spellcheck="false" style="min-width:0;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)"><button class="btn sec small" data-a="tcode">Entra</button></div>')+'</div>';
  h+='<h2>Més</h2><div class="tiles"><button class="tile" data-a="tests"><span class="ic">🧪</span><span class="t">Test de nivell</span><span class="s">A1 i A2</span></button><button class="tile" data-a="self"><span class="ic">✅</span><span class="t">Autoavaluació</span><span class="s">Què sé fer?</span></button><button class="tile" data-a="backup"><span class="ic">💾</span><span class="t">Còpia de seguretat</span><span class="s">Exporta / importa</span></button><button class="tile" data-a="legal"><span class="ic">⚖️</span><span class="t">Crèdits i legal</span><span class="s">Llicències</span></button></div>';
  h+='<h2>Reinicia</h2><button class="btn sec" id="rst" data-a="reset">Esborra el progrés</button>';return h};
const h32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};

anties. Pot contenir errors; si en trobes algun, ens ajudaràs a millorar-lo.</p></div></div>';

/* ===== v6: Sobre mi, generador de frases, A2 difuminado, puerta de práctica ===== */
const seenPool=()=>{const s=seenWords();if(s.length>=8)return s;const f=WORDS.filter(w=>(LSM.a11?LSM.a11.th:[]).includes(w.th));return f.length>=8?f:WORDS.filter(w=>w.lv==='a1')};
const vpool=()=>{const p=VPOOL();return p.length?p:['ser','tenir'].filter(x=>VERBS[x])};
const a2Any=()=>!!(S.set.tkey||Object.keys(S.done).some(id=>LSM[id]&&LSM[id].lv==='a2'));
/* Sobre mi */
const isVow=s=>/^[aeiouhàèéíòóúAEIOUH]/.test(s);
function meQs(){const m=S.me||{};const out=[];
  if(m.name){out.push({k:'build',kind:'Sobre mi',es:'Me llamo '+m.name+'.',tok:['em','dic',m.name],extra:['sóc','tinc'],ans:'em dic '+m.name,tip:'Dir-se: em dic…',key:'me:name'});
    out.push({k:'type',kind:'Sobre mi',p:'«Me llamo '+esc(m.name)+'»',ans:'em dic '+m.name,alts:['em dic '+m.name],e:'Em dic '+m.name+'.',h:'Empieza por «em»',key:'me:name2'})}
  if(m.town){const d=isVow(m.town)?'d\''+m.town:'de '+m.town;const tk=isVow(m.town)?['sóc','d\''+m.town]:['sóc','de',m.town];
    out.push({k:'build',kind:'Sobre mi',es:'Soy de '+m.town+'.',tok:tk,extra:['tinc','vinc'],ans:tk.join(' '),tip:'Ser + de + lloc (d\' davant vocal).',key:'me:town'});
    out.push({k:'type',kind:'Sobre mi',p:'«Soy de '+esc(m.town)+'»',ans:'sóc '+d,alts:['sóc '+d],e:'Sóc '+d+'.',h:'Empieza por «sóc»',key:'me:town2'})}
  if(m.age>0&&m.age<120){const n=catNum(+m.age);
    out.push({k:'type',kind:'Sobre mi',p:'«Tengo '+m.age+' años»',ans:'tinc '+n+' anys',alts:['tinc '+n+' anys'],e:'Tinc '+n+' anys.',h:'Tenir + número + anys',key:'me:age'});
    out.push({k:'build',kind:'Sobre mi',es:'Tengo '+m.age+' años.',tok:['tinc'].concat(n.split(' ')).concat(['anys']),extra:['sóc'],ans:'tinc '+n+' anys',tip:'La edad se dice con tenir.',key:'me:age2'})}
  return shuf(out)}
V.meform=()=>{const m=S.me||{};const f=(id,l,v,t)=>'<label class="muted">'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v||'')+'" autocomplete="off" style="width:100%;padding:12px;margin:4px 0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit">';
  return'<h1>👤 Sobre mi</h1><p class="muted">Escribe tus datos para practicar frases con ellos. Se guardan solo en este navegador.</p>'+f('mn','Nom (nombre)',m.name)+f('mt','Poble o ciutat (pueblo o ciudad)',m.town)+f('ma','Edat (edad, opcional)',m.age,'number')+'<button class="btn block" data-a="mesave">Desa</button>'+(S.me?'<button class="btn sec block" style="margin-top:10px" data-a="medel">Esborra les meves dades</button>':'')};
ACT.mesave=()=>{const n=($('#mn').value||'').trim().slice(0,30),t=($('#mt').value||'').trim().slice(0,30),a=parseInt($('#ma').value,10);
  if(!n&&!t&&!(a>0)){toast('Escriu almenys una dada');return}
  S.me={name:n,town:t,age:a>0&&a<120?a:0};save();toast('Desat ✓');up()};
ACT.medel=()=>{S.me=null;save();toast('Dades esborrades');up()};
ACT.meq=()=>{if(!S.me){go('meform',null,true);return}const q=meQs();if(!q.length){go('meform',null,true);return}startSession(q,{per:8})};

/* Generador de frases por plantillas (solo con verbos y palabras ya estudiados) */
const GFR=[
 {need:'a12',ca:'tinc',es:'Tengo',art:'un'},{need:'a19',ca:'vull',es:'Quiero',art:'un'},{need:'a17',ca:'necessito',es:'Necesito',art:'un'},
 {need:'a11',ca:'m\'agrada',es:'Me gusta',art:'def'},{need:'a11',ca:'on és',es:'¿Dónde está',art:'def',q:1}];
const GTH=new Set(['casa','mobles','fruita','aliments','begudes','botigues','cos','roba','escola','lleure','transport','animals','familia','telefon','cuina','tecnologia','ciutat','natura']);
const NP=w=>{if(!GTH.has(w.th))return null;const m=/^(el|la|l')\s?([^ ']+)$/i.exec(w.ca),e=/^(el|la) ([^(),]+)$/i.exec(w.es);return m&&e?{w,n:m[2],ca:m[1].toLowerCase(),ea:e[1].toLowerCase(),en:e[2]}:null};
function genQ(){
  const fr=GFR.filter(f=>dn(f.need));if(!fr.length)return null;
  const nouns=seenPool().map(NP).filter(Boolean);if(nouns.length<3)return null;
  const f=one(fr),x=one(nouns);
  const un=x.ea==='el'?'un':'una';
  const defTok=x.ca==="l'"?"l'"+x.n:null;
  const tail=f.art==='un'?[un,x.n]:(defTok?[defTok]:[x.ca,x.n]);
  const tok=f.ca.split(' ').concat(tail);const eArt=f.art==='un'?un:x.ea;
  const es=f.q?'¿Dónde está '+x.ea+' '+x.en+'?':f.es+' '+eArt+' '+x.en+'.';
  const pool=WORDS.map(NP).filter(Boolean);
  const ex=pick(pool.filter(y=>y.n!==x.n).map(y=>y.n),2);
  return{k:'build',kind:'Frase nova',es,tok,extra:ex,ans:tok.join(' '),tip:f.q?'On és + article + nom.':'Verb + article + nom.',key:'g:'+f.ca+'.'+x.w.ca}}
ACT.genq=()=>{const qs=[];let t=0;while(qs.length<10&&t++<80){const q=genQ();if(q&&!qs.some(x=>x.ans===q.ans))qs.push(q)}
  if(qs.length<3){toast('Acaba més lliçons per obrir aquest generador');return}startSession(qs,{per:8})};
