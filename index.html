L(1,'a2','Perifràstic','Pretérito perifràstico','⏪',25,
['Formar el passat perifràstic con vaig, vas, va, vam, vau, van + infinitivo','Usarlo con marcadores como ahir, la setmana passada, l\'any passat','Distinguirlo del perfet','Contar acciones concluidas del pasado'],
[
['Com es forma','<p>El <b>perifràstic</b> (o <b>passat perifràstic</b>) es el pasado de acciones terminadas. Se forma con el presente de <b>anar</b> + <b>infinitivo</b>.</p>',mt(['Persona','anar (aux.)','+ parlar'],[['jo','vaig','vaig parlar'],['tu','vas','vas parlar'],['ell / ella','va','va parlar'],['nosaltres','vam / vàrem','vam parlar'],['vosaltres','vau / vàreu','vau parlar'],['ells / elles','van / varen','van parlar']]),[['Ahir vaig treballar fins tard.','Ayer trabajé hasta tarde.'],['Vas anar al cinema?','¿Fuiste al cine?'],['La setmana passada vam viatjar a Roma.','La semana pasada viajamos a Roma.'],['No van venir.','No vinieron.']],'El verbo <b>anar</b> aquí no significa «ir»: es un <b>auxiliar</b>. La negación va delante: <b>No vaig dormir</b>. Todos los verbos usan la misma fórmula, también los irregulares.'],
['Quan l\'usem','<p>Se usa para acciones ya terminadas en un pasado que <b>no se siente conectado</b> con el presente, es decir, con marcadores de tiempo cerrado:</p>',mt(['Marcador','Ejemplo'],[['ahir','Ahir vaig sopar fora.'],['abans-d\'ahir','Abans-d\'ahir vam anar al teatre.'],['la setmana passada','La setmana passada van arribar.'],['el mes passat','El mes passat vaig comprar un cotxe.'],['l\'any passat','L\'any passat vam viatjar molt.'],['fa dos dies','Va marxar fa dos dies.'],['el 2020','El 2020 va néixer la meva filla.']]),[['Quan va néixer la teva filla?','¿Cuándo nació tu hija?'],['Vaig néixer a Lleida el 1990.','Nací en Lleida en 1990.'],['Va ploure tot el dia.','Llovió todo el día.']],'El perifràstic es <b>habitual en catalán</b> y debes saber usarlo bien. En Valencia y Baleares se usa menos o de otra manera; aquí seguimos el catalán central.'],
['Verbs pronominals','<p>Con verbos pronominales el pronombre va antes de <b>vaig / vas / va…</b>:</p>',mt(['Persona','llevar-se (perif.)'],[['jo','em vaig llevar'],['tu','et vas llevar'],['ell / ella','es va llevar'],['nosaltres','ens vam llevar'],['vosaltres','us vau llevar'],['ells / elles','es van llevar']]),[['Ahir em vaig llevar a les sis.','Ayer me levanté a las seis.'],['Ens vam dutxar de seguida.','Nos duchamos enseguida.'],['Es van casar fa tres anys.','Se casaron hace tres años.']],'Es lo contrario que en perfet: <b>m\'he llevat</b> (perfet) frente a <b>em vaig llevar</b> (perifràstic).'],
['Contar una història','<p>Mini narración con perifràstic:</p>','',[['Ahir em vaig llevar tard.','Ayer me levanté tarde.'],['Vaig esmorzar de pressa i vaig sortir corrents.','Desayuné rápido y salí corriendo.'],['El bus no va passar i vaig arribar tard.','El autobús no pasó y llegué tarde.'],['El cap no va dir res.','El jefe no dijo nada.'],['A la tarda vaig anar a córrer.','Por la tarde fui a correr.']],'Los verbos en perifràstic <b>no cambian el infinitivo</b>: <b>vaig fer, vas dir, va veure</b>. Es el tiempo más fácil de aprender.']
],
[['ahir','ayer'],['la setmana passada','la semana pasada'],['l\'any passat','el año pasado'],['fa dos dies','hace dos días'],['vaig + infinitiu','pasado perifràstic'],['va néixer','nació'],['van arribar','llegaron'],['abans-d\'ahir','anteayer'],['el mes passat','el mes pasado'],['de seguida','enseguida']],
[
c('«Ahir ___ treballar fins tard.»','vaig',['he','vaig a','vam'],'Ahir → perifràstic.'),
c('«Tu ___ anar al cinema?» (fuiste)','vas',['vaig','va','vau'],'Tu vas.'),
c('«Nosaltres ___ viatjar a Roma.»','vam',['vau','van','vaig'],'Nosaltres vam.'),
c('«Ells ___ arribar tard.»','van',['va','vam','vas'],'Ells van.'),
c('«L\'any passat ___ viatjar molt.» (nosotros)','vam',['hem','vaig','vau'],'Any passat → perifràstic.'),
c('Elige: «Ayer comí en casa»','Ahir vaig dinar a casa.',['Ahir he dinat a casa.','Ahir dinava a casa.','Ahir dino a casa.'],'Ahir + perifràstic.'),
c('Elige: «Se casaron hace tres años»','Es van casar fa tres anys.',['Es casen fa tres anys.','S\'han casat fa tres anys.','Es casaran.'],'Es van casar.'),
c('En «vaig menjar», el verbo auxiliar es…','anar',['haver','ser','estar'],'Vaig = auxiliar anar.'),
t('«Vosaltres ___ arribar a les nou.» (perifràstic)','vau','Vosaltres vau.'),

t('Perifràstico de «cantar» (ella): ___ cantar','va','Ella va cantar.'),

[
['Dos passats','<p>Catalán central tiene dos pasados principales:</p>',mt(['','Perfet','Perifràstic'],[['formación','he + participi','vaig + infinitiu'],['ejemplo','He menjat.','Vaig menjar.'],['conexión','con el presente','cerrado, ya acabado'],['marcadores','avui, aquesta setmana, aquest any, ja, mai','ahir, la setmana passada, l\'any passat, fa X, el 2020']]),[['Aquest matí he anat a treballar.','Esta mañana he ido a trabajar.'],['Ahir vaig anar a treballar.','Ayer fui a trabajar.'],['Aquest any he viatjat tres vegades.','Este año he viajado tres veces.'],['L\'any passat vaig viatjar sis vegades.','El año pasado viajé seis veces.']],'Si el periodo del que hablas <b>incluye el presente</b> (hoy, esta semana, este mes, este año), perfet. Si está <b>cerrado</b> (ayer, la semana pasada), perifràstic.'],
['Irregulars: perfet','<p>Participios irregulares que debes conocer:</p>',mt(['Infinitivo','Participio','Ejemplo'],[['fer','fet','He fet la compra.'],['dir','dit','Ha dit que sí.'],['veure','vist','Hem vist en Pau.'],['escriure','escrit','He escrit una carta.'],['obrir','obert','Has obert la finestra?'],['prendre','pres','Ha pres una decisió.'],['tenir','tingut','Han tingut sort.'],['venir','vingut','Han vingut tots.'],['poder','pogut','No he pogut venir.'],['voler','volgut','No ha volgut parlar.'],['ser / estar','estat','Han estat a Roma.'],['beure','begut','He begut aigua.']]),[['Avui he vist una exposició.','Hoy he visto una exposición.'],['Ahir vaig veure una pel·lícula.','Ayer vi una película.']],'En el perifràstic no hay irregulares: siempre es <b>vaig</b> + infinitivo (<b>vaig fer, vaig dir, vaig veure</b>).'],
['Una història en dos temps','<p>Observa cómo cambia el tiempo según el marcador:</p>','',[['Aquesta setmana he treballat molt i ahir vaig acabar el projecte.','Esta semana he trabajado mucho y ayer terminé el proyecto.'],['Aquest estiu hem anat a la platja; l\'any passat vam anar a la muntanya.','Este verano hemos ido a la playa; el año pasado fuimos a la montaña.'],['Avui no he dormit gaire, però ahir vaig dormir bé.','Hoy no he dormido mucho, pero ayer dormí bien.']],'Mezclar los dos tiempos en una frase es normal si los marcadores son distintos.'],
['Preguntes per practicar','<p>Preguntas típicas y cómo responderlas con el tiempo adecuado:</p>','',[['Has esmorzat? — Sí, ja he esmorzat.','¿Has desayunado? — Sí, ya he desayunado.'],['Què vas fer ahir? — Vaig anar al cinema.','¿Qué hiciste ayer? — Fui al cine.'],['Has viatjat mai a Itàlia? — Sí, hi vaig anar el 2019.','¿Has viajado alguna vez a Italia? — Sí, fui en 2019.'],['Quan va començar el curs? — Va començar fa dos mesos.','¿Cuándo empezó el curso? — Empezó hace dos meses.']],'Al preguntar con <b>mai</b> («alguna vez»), se usa el <b>perfet</b>. Si la respuesta da una fecha concreta, se pasa al <b>perifràstic</b>.']
],

L(3,'a2','Imperfet','Imperfecto','📼',28,
['Formar el imperfet de los tres grupos de verbos','Usarlo para describir y para hábitos del pasado','Conocer los imperfets irregulares (ser, fer, dir, veure…)','Contrastar con el perifràstic en una narración'],
[
['Com es forma','<p>El <b>imperfet</b> se forma con la raíz del verbo + terminaciones:</p>',mt(['Persona','-ar (parlar)','-re/-er/-ir (beure, dormir)'],[['jo','parlava','bevia / dormia'],['tu','parlaves','bevies / dormies'],['ell / ella','parlava','bevia / dormia'],['nosaltres','parlàvem','bevíem / dormíem'],['vosaltres','parlàveu','bevíeu / dormíeu'],['ells / elles','parlaven','bevien / dormien']]),[['Quan era petit, vivia a Girona.','Cuando era pequeño, vivía en Girona.'],['Cada dia anàvem a l\'escola a peu.','Cada día íbamos a la escuela a pie.'],['Mirava la tele mentre sopava.','Miraba la tele mientras cenaba.']],'En <b>-ar</b> la terminación es <b>-ava</b>; en los demás, <b>-ia</b>. Las dos formas de plural (<b>nosaltres, vosaltres</b>) llevan acento: <b>-àvem, -àveu / -íem, -íeu</b>.'],
['Imperfets irregulars','<p>Solo unos pocos verbos tienen formas especiales:</p>',mt(['','ser','fer','dir','veure'],[['jo','era','feia','deia','veia'],['tu','eres','feies','deies','veies'],['ell / ella','era','feia','deia','veia'],['nosaltres','érem','fèiem','dèiem','vèiem'],['vosaltres','éreu','fèieu','dèieu','vèieu'],['ells / elles','eren','feien','deien','veien']]),[['Era un dia de pluja.','Era un día de lluvia.'],['Feien molt de soroll.','Hacían mucho ruido.'],['Què deies?','¿Qué decías?'],['Hi havia molta gent.','Había mucha gente.']],'<b>Haver-hi</b> en imperfet: <b>hi havia</b> (había). <b>Tenir</b>: <b>tenia, tenies, tenia, teníem, teníeu, tenien</b>.'],
['Per a què serveix','<p>El imperfet sirve para <b>describir</b> el pasado y para <b>hábitos</b> o acciones repetidas:</p>',mt(['Uso','Ejemplo'],[['descripción','Era alt i duia barba.'],['hábito','Cada estiu anàvem a la platja.'],['acción en curso','Mentre jo cuinava, ell mirava la tele.'],['estado mental','Estava cansat i tenia son.'],['contexto de otra acción','Plovia quan vam sortir.']]),[['Quan érem petits, jugàvem al carrer.','Cuando éramos pequeños, jugábamos en la calle.'],['Aquell dia feia fred i nevava.','Aquel día hacía frío y nevaba.'],['Tenia deu anys quan vaig venir aquí.','Tenía diez años cuando vine aquí.']],'Si la acción es <b>repetida o duradera</b> → imperfet. Si es <b>una acción cerrada</b> → perifràstic.'],
['Imperfet o perifràstic?','<p>Se combinan en la narración: <b>imperfet</b> para el fondo, <b>perifràstic</b> para los hechos.</p>','',[['Plovia i feia vent quan vaig sortir de casa.','Llovía y hacía viento cuando salí de casa.'],['Estava cuinant quan va sonar el telèfon.','Estaba cocinando cuando sonó el teléfono.'],['Vivia a Madrid quan vaig conèixer la Laia.','Vivía en Madrid cuando conocí a Laia.'],['Quan vaig arribar, tothom dormia.','Cuando llegué, todos dormían.']],'Piensa: <b>imperfet</b> = «lo que estaba pasando»; <b>perifràstic</b> = «lo que pasó (un evento)».']
],
[['l\'imperfet','el imperfecto'],['era','era'],['tenia','tenía'],['feia','hacía'],['anàvem','íbamos'],['vivia','vivía'],['hi havia','había'],['mentre','mientras'],['quan','cuando'],['cada estiu','cada verano']],
[

L(4,'a2','Narrar en passat','Narrar en pasado','📖',28,
['Combinar perifràstic e imperfet en una narración','Conocer el plusquamperfet (havia + participi)','Reconocer el passat simple en textos escritos','Usar conectores para ordenar una historia'],
[
['Fons i primer pla','<p>En una historia, el <b>imperfet</b> crea el fondo (descripciones, hábitos) y el <b>perifràstic</b> cuenta los hechos.</p>','',[['Era una nit freda. Hi havia poca gent al carrer.','Era una noche fría. Había poca gente en la calle.'],['De sobte, va sonar el mòbil.','De repente, sonó el móvil.'],['Vaig contestar i era la meva germana.','Contesté y era mi hermana.'],['Em va dir que venia cap a casa.','Me dijo que venía hacia casa.']],'Frases útiles para empezar una historia: <b>Fa uns anys…</b>, <b>Una vegada…</b>, <b>Quan era petit…</b>, <b>Recordo que…</b>'],
['Plusquamperfet','<p>El <b>plusquamperfet</b> se forma con <b>havia, havies, havia, havíem, havíeu, havien</b> + participi. Indica una acción anterior a otra del pasado.</p>',mt(['Persona','haver (imperfet)','+ parlar'],[['jo','havia','havia parlat'],['tu','havies','havies parlat'],['ell / ella','havia','havia parlat'],['nosaltres','havíem','havíem parlat'],['vosaltres','havíeu','havíeu parlat'],['ells / elles','havien','havien parlat']]),[['Quan vaig arribar, ell ja havia marxat.','Cuando llegué, él ya se había ido.'],['No havia vist mai el mar.','Nunca había visto el mar.'],['Havíem acabat el treball abans de sopar.','Habíamos terminado el trabajo antes de cenar.']],'Se emplea poco en la lengua oral pero es fácil: <b>havia + participi</b>. Equivale a «había + participio».'],
['El passat simple (només reconèixer-lo)','<p>En textos literarios y de prensa antigua aparece una forma que no se usa en la lengua oral central: el <b>passat simple</b>. Solo necesitas <b>reconocerlo</b>.</p>',mt(['Passat simple','Perifràstic equivalente'],[['<b>digué</b>','va dir'],['<b>anaren</b>','van anar'],['<b>fou</b>','va ser'],['<b>nasqué</b>','va néixer'],['<b>féu</b>','va fer']]),[['El rei digué que no. (= va dir)','El rey dijo que no.'],['Els soldats anaren cap al nord. (= van anar)','Los soldados fueron hacia el norte.']],'No lo uses al hablar; en el Principat se dice <b>va dir</b>. En textos de Valencia y Baleares sí es más corriente.'],
['Connectors de la història','<p>Para ordenar una narración:</p>',mt(['Palabra','Significa'],[['primer','primero'],['després','después'],['aleshores / llavors','entonces'],['de sobte','de repente'],['mentrestant','mientras tanto'],['finalment','finalmente'],['al final','al final'],['al cap d\'una estona','al cabo de un rato']]),[['Primer vam dinar i després vam passejar.','Primero comimos y después paseamos.'],['De sobte va començar a ploure.','De repente empezó a llover.'],['Finalment vam arribar a casa.','Finalmente llegamos a casa.']],'Un texto breve: <b>Ahir feia sol. Vaig anar a la platja. De sobte va començar a ploure i vaig tornar a casa.</b>']
],
[['de sobte','de repente'],['mentrestant','mientras tanto'],['finalment','finalmente'],['aleshores','entonces'],['havia + participi','había + participio'],['el plusquamperfet','el pluscuamperfecto'],['la història','la historia'],['recordar','recordar'],['abans','antes'],['al final','al final']],
[
c('«Quan vaig arribar, ell ja ___ marxat.»','havia',['ha','va','hauria'],'Plusquamperfet.'),
c('Plusquamperfet de «menjar» (tu):','havies menjat',['has menjat','vas menjar','menjaves'],'Havies + participi.'),
c('«No ___ vist mai el mar.» (yo)','havia',['he','vaig','hauré'],'Havia vist.'),
c('«De sobte» significa…','de repente',['por fin','a veces','mientras'],'De sobte = de repente.'),
c('«Digué» es…','passat simple de dir',['futur de dir','imperfet de dir','participi de dir'],'Passat simple = va dir.'),
c('«___ vam dinar i després vam passejar.»','Primer',['Mai','Després','Final'],'Primer.'),
c('«___ feia sol quan vaig sortir.»','Feia',['Fa','Farà','Va fer'],'Imperfet = fondo.'),
c('Elige la historia correcta:','Plovia i vaig sortir.',['Va ploure i sortia.','Plou i vaig sortir.','Plovia i sortiré.'],'Fondo + evento.'),
t('«Havíem ___ (acabar) el treball.»','acabat','Havíem acabat.'),
t('«Quan va arribar, ja ___ marxat.» (havien)','havien','Havien marxat.'),
t('«___ sobte» (de repente)','De','De sobte.'),
b('Cuando llegué ya se había ido','quan vaig arribar ja havia marxat','','Perifràstic + plusquamperfet.'),
b('Primero comimos y después paseamos','primer vam dinar i després vam passejar','','Primer… després…')
],'verbs2');
L(5,'a2','Futur','Futuro','🔮',25,
['Formar el futur de los verbos regulares','Conocer los futuros irregulares más frecuentes','Hablar de planes y predicciones','Distinguir futur de presente con valor de futuro'],
[
['Com es forma','<p>El <b>futur</b> se forma con el <b>infinitivo completo</b> + las terminaciones: <b>-é, -às, -à, -em, -eu, -an</b>.</p>',mt(['','parlar','beure','dormir'],[['jo','parlaré','beuré','dormiré'],['tu','parlaràs','beuràs','dormiràs'],['ell / ella','parlarà','beurà','dormirà'],['nosaltres','parlarem','beurem','dormirem'],['vosaltres','parlareu','beureu','dormireu'],['ells / elles','parlaran','beuran','dormiran']]),[['Demà treballaré a casa.','Mañana trabajaré en casa.'],['Aniràs a la festa?','¿Irás a la fiesta?'],['Dormirem en un hotel.','Dormiremos en un hotel.']],'Para los verbos en <b>-re</b> se pierde la «e» final: <b>beure → beuré</b>, <b>viure → viuré</b>, <b>escriure → escriuré</b>.'],
['Futurs irregulars','<p>Algunos verbos cambian la raíz, pero las terminaciones son las mismas:</p>',mt(['Infinitivo','Raíz','Jo…','Nosaltres…'],[['tenir','tindr-','tindré','tindrem'],['venir','vindr-','vindré','vindrem'],['poder','podr-','podré','podrem'],['voler','voldr-','voldré','voldrem'],['saber','sabr-','sabré','sabrem'],['fer','far-','faré','farem'],['dir','dir-','diré','direm'],['haver','haur-','hauré','haurem'],['anar','anir-','aniré','anirem'],['ser','ser-','seré','serem'],['veure','veur-','veuré','veurem']]),[['Demà vindré a casa teva.','Mañana vendré a tu casa.'],['Tindrem temps?','¿Tendremos tiempo?'],['No podré venir.','No podré venir.'],['Faré el sopar.','Haré la cena.']],'Un truco: aprende la raíz con <b>-dr-</b> (<b>tindr-, vindr-, voldr-, podr-</b>) y las terminaciones <b>-é, -às, -à, -em, -eu, -an</b>.'],
['Per a què s\'usa','<p>El futur sirve para planes, promesas, predicciones y suposiciones:</p>',mt(['Uso','Ejemplo'],[['plan','El mes que ve viatjaré a Itàlia.'],['promesa','Et trucaré aviat.'],['predicción','Demà plourà.'],['suposición','Ara serà a casa.']]),[['Quan acabaré el curs, faré un viatge.','Cuando termine el curso, haré un viaje.'],['Demà farà bon temps.','Mañana hará buen tiempo.'],['Aquesta nit tindrem visita.','Esta noche tendremos visita.']],'En la lengua oral, el presente suele sustituir al futuro cuando hay un marcador: <b>Demà vinc</b> = <b>Demà vindré</b>.'],
['Si + presente / futur','<p>Con <b>si</b> se usa el presente en la condición y el futuro (o presente) en la consecuencia:</p>','',[['Si plou, no sortiré.','Si llueve, no saldré.'],['Si tinc temps, et trucaré.','Si tengo tiempo, te llamaré.'],['Si arribes aviat, anirem al cinema.','Si llegas pronto, iremos al cine.']],'No se usa futuro después de <b>si</b>: <b>Si vindràs…</b> es incorrecto; di <b>Si véns…</b>.']
],
[['el futur','el futuro'],['demà','mañana'],['l\'any que ve','el año que viene'],['aviat','pronto'],['en el futur','en el futuro'],['tindré','tendré'],['vindré','vendré'],['podré','podré'],['aniré','iré'],['faré','haré']],
[
c('Futur de «parlar» (jo):','parlaré',['parlo','parlaria','parlava'],'-é.'),
c('Futur de «beure» (tu):','beuràs',['beveràs','beus','bevies'],'Beure → beur- + às.'),
c('Futur de «tenir» (nosaltres):','tindrem',['tenirem','tenim','tindriem'],'Tindr- + em.'),
c('Futur de «venir» (ell):','vindrà',['venirà','vindria','vindran'],'Vindr- + à.'),
c('Futur de «poder» (jo):','podré',['podeu','puc','podria'],'Podr- + é.'),
c('Futur de «fer» (vosaltres):','fareu',['feu','fereu','fan'],'Far- + eu.'),
c('Futur de «anar» (jo):','aniré',['vaig','aniria','vaig anar'],'Anir- + é.'),
c('«Si plou, no ___.»','sortiré',['sortia','sortir','vaig sortir'],'Si + presente → futuro.'),
t('Futur de «ser» (tu):','seràs','Ser + às.'),
t('Futur de «dir» (jo):','diré','Dir + é.'),
t('Futur de «saber» (nosaltres):','sabrem','Sabr- + em.'),
b('Mañana vendré a tu casa','demà vindré a casa teva','','Vindré = venir.'),
b('Haré la cena','faré el sopar','','Faré = fer.')
],'verbs2');
L(6,'a2','Perífrasis','Perífrasis verbales','🧩',25,
['Usar estar + gerundio para acciones en curso','Expresar inicio y final: començar a, acabar de, posar-se a','Hablar de planes y obligaciones con pensar, deure, tornar a','Reconocer las perífrasis más frecuentes'],
[
['Estar + gerundi','<p>El <b>gerundi</b> se forma con <b>-ant</b> (-ar), <b>-ent</b> (-er/-re) o <b>-int</b> (-ir). Con <b>estar</b> expresa que la acción está en curso.</p>',mt(['Infinitivo','Gerundio','Ejemplo'],[['parlar','parlant','Estic parlant.'],['beure','bevent','Està bevent aigua.'],['dormir','dormint','Està dormint.'],['llegir','llegint','Estem llegint.'],['fer','fent','Estàs fent els deures?'],['dir','dient','Què estàs dient?']]),[['Ara estic estudiant català.','Ahora estoy estudiando catalán.'],['Estàs mirant la tele?','¿Estás mirando la tele?'],['Estaven cuinant quan vam arribar.','Estaban cocinando cuando llegamos.']],'En catalán, <b>estar + gerundi</b> se usa solo cuando se quiere destacar que <b>la acción está ocurriendo en este momento</b>. Para acciones habituales se usa el presente.'],
['Començar, acabar, posar-se','<p>Verbos que marcan el inicio y el final:</p>',mt(['Perífrasis','Significa','Ejemplo'],[['<b>començar a</b> + inf.','empezar a','Comença a ploure.'],['<b>posar-se a</b> + inf.','ponerse a','Es va posar a cantar.'],['<b>acabar de</b> + inf.','acabar de','Acabo de sortir.'],['<b>deixar de</b> + inf.','dejar de','He deixat de fumar.'],['<b>tornar a</b> + inf.','volver a','Torna a trucar.'],['<b>continuar</b> + gerundi','seguir','Continua treballant.']]),[['Acabo d\'arribar.','Acabo de llegar.'],['Han començat a treballar.','Han empezado a trabajar.'],['No tornis a fer-ho.','No vuelvas a hacerlo.']],'<b>Acabar de</b> + infinitivo = hecho recientemente: <b>Acaba de marxar</b> = se acaba de ir. Con el sentido «terminar» se usa <b>acabar</b> sin preposición.'],
['Pensar, deure, haver de','<p>Más perífrasis útiles:</p>',mt(['Perífrasis','Significa','Ejemplo'],[['<b>pensar</b> + inf.','pensar, tener la intención','Penso viatjar a l\'estiu.'],['<b>deure</b> + inf.','debe de (suposición)','Deu ser tard.'],['<b>haver de</b> + inf.','tener que','He d\'estudiar.'],['<b>poder</b> + inf.','poder','Pots venir?'],['<b>soler</b> + inf.','soler','Sol llevar-se aviat.'],['<b>anar a</b> + inf.','ir a (moverse)','Vaig a comprar pa.']]),[['Penso anar a la platja.','Pienso ir a la playa.'],['Sol dinar a les dues.','Suele comer a las dos.'],['Deu estar malalt.','Debe de estar enfermo.']],'<b>Soler</b> es regular en presente, pero es muy raro fuera del presente: <b>Solia anar</b> (solía ir).'],
['Practica','<p>Combina las perífrasis para hablar de rutina y de planes:</p>','',[['Acabo de sortir de casa i penso arribar aviat.','Acabo de salir de casa y pienso llegar pronto.'],['Quan he començat a estudiar, ha sonat el mòbil.','Cuando he empezado a estudiar, ha sonado el móvil.'],['Torno a intentar-ho.','Vuelvo a intentarlo.']],'Con pronombres, estos van antes del verbo conjugado o <b>pegados al infinitivo</b>: <b>Ho vull fer</b> / <b>Vull fer-ho</b>.']
],
[['el gerundi','el gerundio'],['començar a','empezar a'],['acabar de','acabar de'],['posar-se a','ponerse a'],['tornar a','volver a'],['deixar de','dejar de'],['continuar','continuar'],['pensar','pensar'],['soler','soler'],['deure','deber de']],
[
c('Gerundi de «parlar»:','parlant',['parlat','parlar','parlent'],'-ant.'),
c('Gerundi de «dormir»:','dormint',['dormit','dormant','dormir'],'-int.'),
c('Gerundi de «fer»:','fent',['fant','fet','fer'],'Fent.'),
c('«Estic ___ català.» (estudiando)','estudiant',['estudiat','estudiar','estudiem'],'Estic estudiant.'),
c('«Acabo ___ sortir.» (acabo de)','de',['a','en','per'],'Acabar de.'),
c('«Comença ___ ploure.»','a',['de','en','per'],'Començar a.'),
c('«He deixat ___ fumar.» (dejado de)','de',['a','per','en'],'Deixar de.'),
c('«Torna ___ trucar.» (vuelve a)','a',['de','per','en'],'Tornar a.'),
t('Gerundi de «beure»:','bevent','Bevent.'),
t('«Penso ___ (viatjar) a l\'estiu.»','viatjar','Pensar + inf.'),
t('«Sol ___ (dinar) a les dues.»','dinar','Soler + inf.'),
b('Acabo de llegar','acabo d\'arribar','','Acabar de + inf.'),
b('Estoy estudiando catalán','estic estudiant català','','Estar + gerundi.')
],'verbs2');
L(7,'a2','Pronoms febles I','Pronombres débiles I','🔗',30,
['Reconocer qué es un pronombre débil','Usar los de complemento directo: el, la, els, les, en, ho','Colocar el pronombre antes o después del verbo','Evitar la repetición del complemento directo'],
[
['Què són','<p>Los <b>pronoms febles</b> sustituyen a un complemento para no repetirlo. Son monosílabos átonos: se pronuncian pegados al verbo.</p>','',[['Compro el pa. → El compro.','Compro el pan. → Lo compro.'],['Veig la Marta. → La veig.','Veo a Marta. → La veo.'],['Prenc els llibres. → Els prenc.','Cojo los libros. → Los cojo.'],['Escolto les cançons. → Les escolto.','Escucho las canciones. → Las escucho.']],'Son clave en catalán. Si los usas bien, parecerás mucho más natural. Empieza por <b>el, la, els, les</b>.'],
['CD: el, la, els, les','<p>El <b>complemento directo</b> responde a «¿qué?» o «¿a quién?». Se sustituye por:</p>',mt(['','Masc.','Fem.'],[['singular','<b>el</b>','<b>la</b>'],['plural','<b>els</b>','<b>les</b>']]),[['Veus el cotxe? — Sí, el veig.','¿Ves el coche? — Sí, lo veo.'],['Busques la clau? — La busco.','¿Buscas la llave? — La busco.'],['Has comprat els bitllets? — Sí, els he comprat.','¿Has comprado los billetes? — Sí, los he comprado.'],['Mires les fotos? — Les miro.','¿Miras las fotos? — Las miro.']],'Delante de vocal o <b>h</b> se apostrofan <b>el, la</b>: <b>L\'he vist</b> (lo/la he visto). Los plurales <b>els, les</b> no se apostrofan.'],
['La resta: en i ho','<p><b>En</b> sustituye a un complemento introducido por <b>de</b> o a una cantidad (<b>de + algo</b>). <b>Ho</b> sustituye a una idea, un neutro o una frase completa.</p>',mt(['Pronombre','Sustituye a','Ejemplo'],[['<b>en</b>','cantidad / de + algo','Vols pa? — Sí, en vull. / No en vull.'],['<b>ho</b>','neutro / frase','Saps que ha vingut? — Sí, ho sé.'],['<b>ho</b>','lo (adjetivo)','Ets feliç? — Sí, ho sóc.']]),[['Tens germans? — Sí, en tinc dos.','¿Tienes hermanos? — Sí, tengo dos.'],['Vols cafè? — No en vull.','¿Quieres café? — No quiero.'],['Ho he entès.','Lo he entendido.'],['No ho sé.','No lo sé.']],'Con cantidad, <b>en</b> es obligatorio: <b>En tinc tres</b>, no «Tinc tres». En español dices «tengo tres»; en catalán «tres» sin <b>en</b> sería incompleto.'],
['On va el pronom','<p>El pronombre va <b>antes</b> del verbo conjugado, pero <b>después</b> del infinitivo, gerundio e imperativo (unido con guion).</p>',mt(['Forma','Ejemplo'],[['verbo conjugado','El veig cada dia.'],['con perfet','L\'he vist ahir.'],['con infinitivo','Vull veure\'l. / El vull veure.'],['con gerundi','Estic mirant-lo. / El estic mirant.'],['con imperativo','Mira\'l! / No el miris!']]),[['Vull comprar-la. / La vull comprar.','Quiero comprarla.'],['Escolta\'m!','¡Escúchame!'],['No ho facis!','¡No lo hagas!']],'Cuando va <b>después</b> del verbo, se une con guion: <b>mira-la</b>, <b>veure\'l</b> (se apostrofa: veure + el = veure\'l). Es lo más característico del catalán.']
],
[['el pronom feble','el pronombre débil'],['el complement directe','el complemento directo'],['el, la, els, les','lo, la, los, las'],['en','de eso / cantidad'],['ho','lo (neutro)'],['apostrofar','apostrofar'],['l\'he vist','lo he visto'],['en tinc dos','tengo dos'],['no ho sé','no lo sé'],['mira\'l','míralo']],
[
c('«Veus el cotxe?» — «Sí, ___ veig.»','el',['la','els','en'],'Cotxe = masc. sing.'),
c('«Busques la clau?» — «Sí, ___ busco.»','la',['el','les','ho'],'Clau = fem. sing.'),
c('«Has comprat els bitllets?» — «Sí, ___ he comprat.»','els',['les','el','en'],'Bitllets = masc. pl.'),
c('«Mires les fotos?» — «Sí, ___ miro.»','les',['els','la','ho'],'Fotos = fem. pl.'),
c('«Vols pa?» — «Sí, ___ vull.»','en',['ho','el','la'],'Cantidad: en.'),
c('«Saps que ha vingut?» — «Sí, ___ sé.»','ho',['el','la','en'],'Frase: ho.'),
c('«Tens germans?» — «Sí, ___ tinc dos.»','en',['els','ho','les'],'Cantidad: en.'),
c('«___ he vist ahir.» (lo/la)','L\'',['El','La','En'],'Apóstrofo ante vocal.'),
t('«No ___ miris!» (no lo mires)','el','No el miris!'),
t('«___ vull.» (quiero un poco; en)','En','En vull.'),
t('«No ___ sé.» (no lo sé)','ho','No ho sé.'),
b('Lo veo cada día','el veig cada dia','','El + veig.'),
b('No lo sé','no ho sé','','No + ho + sé.')
],'verbs2');
L(8,'a2','Pronoms febles II','Pronombres débiles II','🔗',30,
['Usar los pronombres de complemento indirecto: em, et, li, ens, us, els','Distinguir CD y CI','Aplicar los pronombres a verbos como agradar, semblar, donar, dir','Colocar los pronombres correctamente'],
[
['CI: em, et, li, ens, us, els','<p>El <b>complemento indirecto</b> responde a «¿a quién?» o «¿para quién?»:</p>',mt(['','Pronombre','Ejemplo'],[['a mi','<b>em</b>','Em dónes un cafè?'],['a tu','<b>et</b>','Et truco demà.'],['a ell / ella','<b>li</b>','Li explico el problema.'],['a nosaltres','<b>ens</b>','Ens ajuda sempre.'],['a vosaltres','<b>us</b>','Us escric aviat.'],['a ells / elles','<b>els</b>','Els dic la veritat.']]),[['Li dono el llibre.','Le doy el libro.'],['Em porta el compte, si us plau?','¿Me trae la cuenta, por favor?'],['Els truco cada dia.','Les llamo cada día.'],['Ens han enviat un correu.','Nos han enviado un correo.']],'Con <b>vostè</b> el CI es <b>li</b> (y <b>els</b> con vostès): <b>Li porto el compte</b> (le traigo la cuenta a usted).'],
['CD o CI?','<p>Los pronombres de 1.ª y 2.ª persona (<b>em, et, ens, us</b>) valen para CD e CI. En 3.ª persona, se distinguen:</p>',mt(['','CD','CI'],[['masc. sing.','el','li'],['fem. sing.','la','li'],['masc. pl.','els','els'],['fem. pl.','les','els']]),[['Veig la Laia → La veig.','Veo a Laia → La veo.'],['Dic a la Laia → Li dic.','Digo a Laia → Le digo.'],['Compro els llibres → Els compro.','Compro los libros → Los compro.'],['Dic als pares → Els dic.','Digo a los padres → Les digo.']],'Truco: si puedes poner <b>a + persona</b> o «a ella» después del verbo, es CI. En catalán el CI de 3.ª persona es siempre <b>li / els</b> (no hay diferencia de género).'],
['Verbs com agradar','<p>Algunos verbos funcionan con pronombre de CI: <b>agradar, semblar, importar, interessar, encantar, fer falta, anar bé</b>.</p>',mt(['Verbo','Ejemplo','Español'],[['agradar','M\'agrada.','me gusta'],['semblar','Em sembla bé.','me parece bien'],['importar','No m\'importa.','no me importa'],['interessar','M\'interessa.','me interesa'],['fer falta','Em fa falta temps.','me falta tiempo'],['anar bé','Em va bé.','me va bien'],['costar','Li costa parlar.','le cuesta hablar']]),[['Ens ve bé a les cinc?','¿Nos va bien a las cinco?'],['Què us sembla?','¿Qué os parece?'],['Li agraden els gelats.','Le gustan los helados.']],'<b>Em sembla que…</b> = me parece que. Verbos de afección: la cosa que gusta/interesa es el sujeto, y el pronombre es CI.'],
['Dir, dir-se, donar','<p>Los verbos de «dar» y «decir» siempre llevan CI:</p>','',[['Em dónes el telèfon?','¿Me das el teléfono?'],['Li he dit que vindré.','Le he dicho que vendré.'],['Els escric cada setmana.','Les escribo cada semana.'],['T\'explico el problema.','Te explico el problema.'],['Ens van donar una sorpresa.','Nos dieron una sorpresa.']],'Estos pronombres van <b>antes</b> del verbo conjugado, o <b>después</b> del infinitivo/imperativo: <b>Vull dir-li</b> (querer decirle), <b>Digue\'m</b> (dime).']
],

L(9,'a2','Hi i en','Hi y en','📍',30,
['Usar hi para lugar y complementos con a/en','Usar en para origen (de allí), cantidad y de + algo','Conocer las formas de en: en, \'n, ne, -ne','Evitar repeticiones con estos dos pronombres'],
[
['El pronom hi','<p><b>Hi</b> sustituye a un lugar («allí») o a un complemento introducido por <b>a</b> o <b>en</b> (no persona): <b>pensar-hi</b>, <b>confiar-hi</b>.</p>',mt(['Pregunta','Respuesta con hi'],[['Vas a l\'escola?','Sí, <b>hi</b> vaig cada dia.'],['Vius a Girona?','Sí, <b>hi</b> visc.'],['Penses en el viatge?','Sí, <b>hi</b> penso.'],['Hi ha un banc?','Sí, <b>hi</b> ha un banc.']]),[['Hi vaig en metro.','Voy allí en metro.'],['Hi he estat dos cops.','He estado allí dos veces.'],['No hi penso gaire.','No pienso mucho en eso.']],'<b>Hi ha</b> (hay) usa este mismo pronombre. Después de verbo con vocal se escribe <b>-hi</b> unido: <b>Anem-hi!</b> (¡vamos allí!), <b>Anar-hi</b> (ir allí).'],
['El pronom en','<p><b>En</b> expresa de dónde vienes (<b>en vinc</b>), una cantidad (<b>en tinc dos</b>) o un complemento con <b>de</b> (<b>parlar-ne</b>, <b>recordar-se\'n</b>).</p>',mt(['Función','Pregunta','Respuesta'],[['origen','Véns de Girona?','Sí, <b>en</b> vinc.'],['cantidad','Tens germans?','Sí, <b>en</b> tinc dos.'],['de + algo','Parles del viatge?','Sí, <b>en</b> parlo.'],['verbo','Et recordes de la festa?','Sí, me\'n recordo.']]),[['Quants cafès has pres? — N\'he pres tres.','¿Cuántos cafés has tomado? — He tomado tres.'],['No en vull.','No quiero (de eso).'],['En vinc ara mateix.','Vengo de allí ahora mismo.']],'No es el mismo que <b>ho</b> (neutro): <b>en</b> se refiere a «algo de», <b>ho</b> a una frase completa.'],
['Formes de en','<p>Según lo que haya delante o detrás, <b>en</b> adopta cuatro formas:</p>',mt(['Forma','Cuándo','Ejemplo'],[['<b>en</b>','delante de consonante','En tinc dos.'],['<b>n\'</b>','delante de vocal','N\'he vist dos.'],['<b>-ne</b>','detrás de verbo acabado en consonante','Vull parlar-<b>ne</b>. Parlem-<b>ne</b>!'],['<b>\'n</b>','detrás de verbo acabado en vocal','Compra-<b>\'n</b> dos. (compra\'n)']]),[['En tinc.','Tengo.'],['N\'hi ha tres.','Hay tres (de eso).'],['Parlem-ne!','¡Hablemos de eso!'],['Bec aigua i en vull més.','Bebo agua y quiero más.']],'Con <b>hi ha</b> y cantidad: <b>N\'hi ha tres</b> (hay tres), <b>No n\'hi ha cap</b> (no hay ninguno).'],
['Hi i en juntos','<p>Aparecen juntos en frases como <b>n\'hi ha</b>: <b>en</b> (cantidad) + <b>hi</b> (lugar).</p>','',[['Hi ha pomes? — Sí, n\'hi ha moltes.','¿Hay manzanas? — Sí, hay muchas.'],['Quants hi ha? — Només n\'hi ha dos.','¿Cuántos hay? — Solo hay dos.'],['Hi vas? — Sí, hi vaig, però en torno aviat.','¿Vas allí? — Sí, voy, pero vuelvo pronto.']],'Reconocerlos requiere práctica: aprende <b>n\'hi ha</b> y <b>no n\'hi ha cap</b> como bloques.']
],
[['hi','allí / ahí'],['en','de eso'],['n\'hi ha','hay (de eso)'],['anar-hi','ir allí'],['parlar-ne','hablar de eso'],['pensar-hi','pensar en eso'],['tornar-hi','volver allí'],['recordar-se\'n','acordarse de eso'],['per això','por eso'],['sovint','a menudo']],
[
c('«Vas a l\'escola?» — «Sí, ___ vaig.»','hi',['en','ho','el'],'Lugar: hi.'),
c('«Tens germans?» — «Sí, ___ tinc dos.»','en',['hi','ho','els'],'Cantidad: en.'),
c('«Véns de Girona?» — «Sí, ___ vinc.»','en',['hi','ho','la'],'Origen: en.'),

c('«___ he vist dos.» (de eso)','N\'',['En','Hi','Ho'],'En + vocal = n\'.'),

c('«Penses en el viatge?» — «Sí, ___ penso.»','hi',['en','ho','el'],'Pensar en → hi.'),

t('«No ___ vull.» (de eso, ante consonante)','en','En vull.'),

L(10,'a2','Combinacions','Combinaciones de pronombres','🧬',30,
['Combinar dos pronombres débiles (me\'l, te\'n, m\'ho)','Colocar las combinaciones antes del verbo','Reconocer las formas apostrofadas','Evitar los errores más frecuentes'],
[
['Dues peces juntes','<p>A veces hay un complemento indirecto (me, te, li…) y uno directo (el, la, els, les, en, ho). Se combinan en un bloque antes del verbo.</p>',mt(['','+ el','+ la','+ els','+ les','+ en','+ ho'],[['em','<b>me\'l</b>','<b>me la</b>','<b>me\'ls</b>','<b>me les</b>','<b>me\'n</b>','<b>m\'ho</b>'],['et','<b>te\'l</b>','<b>te la</b>','<b>te\'ls</b>','<b>te les</b>','<b>te\'n</b>','<b>t\'ho</b>'],['ens','<b>ens el</b>','<b>ens la</b>','<b>ens els</b>','<b>ens les</b>','<b>ens en</b>','<b>ens ho</b>'],['us','<b>us el</b>','<b>us la</b>','<b>us els</b>','<b>us les</b>','<b>us en</b>','<b>us ho</b>']]),[['Em dónes el llibre? — Sí, te\'l dono.','¿Me das el libro? — Sí, te lo doy.'],['Em portes la carta? — Te la porto.','¿Me traes la carta? — Te la traigo.'],['Necessito diners. — Te\'n deixo.','Necesito dinero. — Te dejo (de eso).'],['M\'ho has dit?','¿Me lo has dicho?']],'En las combinaciones, el CI va primero (<b>em, et, ens, us</b>) y el CD después (<b>el, la, els, les, en, ho</b>). Se apostrofa solo cuando es posible: <b>me\'l, te\'n, m\'ho</b>.'],
['Amb li: li ho, li en','<p>Con <b>li</b> (CI de 3.ª persona) se mantienen algunas formas, pero otras cambian:</p>',mt(['Combinación','Forma','Ejemplo'],[['li + ho','<b>li ho</b>','Li ho dic ara.'],['li + en','<b>li\'n</b>','Li\'n dono dos.'],['li + el / la','<b>l\'hi</b> / <b>la hi</b> (norma)','L\'hi porto demà.'],['els + ho','<b>els ho</b>','Els ho explico.']]),[['Li ho vaig dir ahir.','Se lo dije ayer.'],['Li\'n vaig comprar dos.','Le compré dos (de eso).'],['Els ho he explicat.','Se lo he explicado.']],'Para el nivel A2, basta con <b>li ho</b> y <b>li\'n</b>. La combinación <b>l\'hi</b> (le+lo) es más avanzada: la oirás pero puedes decir <b>li ho</b> si te sirve para tu objetivo.'],
['On van','<p>Las combinaciones se colocan <b>antes</b> del verbo conjugado, o <b>después</b> del infinitivo/gerundio/imperativo con guiones:</p>',mt(['Estructura','Ejemplo'],[['antes del verbo','Te\'l porto demà.'],['perfet','Te\'l he portat.'],['con infinitivo','Vull portar-te\'l. / Te\'l vull portar.'],['con imperativo','Porta-me\'l! (¡trámelo!)']]),[['Pots dir-m\'ho?','¿Puedes decírmelo?'],['Vull donar-te\'l.','Quiero dártelo.'],['Dóna-me\'l.','Dámelo.']],'Detrás del verbo: <b>verbo + pronombre CI + pronombre CD</b> con guiones: <b>porta-me\'l</b>, <b>dir-m\'ho</b>, <b>donar-li\'n</b>.'],
['Errors habituals','<p>Los errores más típicos con los pronombres débiles:</p>',mt(['No digas…','Di…'],[['em ho dónes','<b>m\'ho dónes</b>'],['te el dono','<b>te\'l dono</b>'],['dona-me el','<b>dóna-me\'l</b>'],['li el dono','<b>l\'hi dono</b> / <b>li dono</b> (sin repetir)'],['vull-lo veure','<b>vull veure\'l</b> / <b>el vull veure</b>']]),[['No m\'ho diguis!','¡No me lo digas!'],['Te\'ls porto demà.','Te los traigo mañana.']],'No te obsesiones con las reglas: en conversación, cuando dudes, usa el pronombre único y evita el doble.']
],
[['me\'l','me lo'],['te\'l','te lo'],['m\'ho','me lo (neutro)'],['te\'n','te (de eso)'],['li ho','se lo'],['li\'n','le (de eso)'],['dóna-me\'l','dámelo'],['porta-me\'l','tráemelo'],['el complement','el complemento'],['l\'hi','se lo (norma)']],

[
['Per','<p><b>Per</b> expresa causa, medio, lugar de paso, tiempo y reparto.</p>',mt(['Uso','Ejemplo'],[['causa','No surto per la pluja.'],['medio','Truco per telèfon.'],['paso','Passo pel parc.'],['tiempo','Vaig estudiar per Nadal.'],['por unidad','Cinc euros per persona.'],['en lugar de','Ho faig per tu.'],['por ejemplo','Per exemple, jo.']]),[['Gràcies per tot.','Gracias por todo.'],['Viatjo per feina.','Viajo por trabajo.'],['Ho hem fet per tu.','Lo hemos hecho por ti.']],'<b>Per</b> + el = <b>pel</b>; <b>per</b> + els = <b>pels</b>: <b>pel carrer</b>.'],
['Per a','<p><b>Per a</b> expresa finalidad y destinatario.</p>',mt(['Uso','Ejemplo'],[['finalidad','Estudio per a aprovar.'],['destinatario','Aquest regal és per a tu.'],['fecha límite','Ho necessito per a demà.'],['uso','Un got per a l\'aigua.'],['opinión','Per a mi, és fàcil.']]),[['Tinc un regal per a la Laia.','Tengo un regalo para Laia.'],['És un llibre per a nens.','Es un libro para niños.'],['Això és per a tu.','Esto es para ti.']],'Con infinitivo, <b>per a</b> puede abreviarse a <b>per</b>: <b>Estudio per aprovar</b> / <b>per a aprovar</b>. Pero con sustantivo o pronombre, mejor <b>per a</b>.'],
['Per què, perquè…','<p>Para dar razones, hay varias opciones:</p>',mt(['Palabra','Cuándo','Ejemplo'],[['<b>perquè</b>','porque','No vinc perquè estic cansat.'],['<b>com que</b>','como (causa conocida)','Com que plou, no surto.'],['<b>és que</b>','es que (excusa)','És que no tinc temps.'],['<b>per tant</b>','por tanto','Estic malalt; per tant, no vinc.'],['<b>ja que</b>','ya que','Ja que hi ets, ajuda\'m.']]),[['No he vingut perquè estava malalt.','No he venido porque estaba enfermo.'],['Com que no tenia diners, no vaig comprar res.','Como no tenía dinero, no compré nada.'],['És que no ho sabia.','Es que no lo sabía.']],'<b>Com que</b> va <b>al principio</b> de la frase (la razón, antes que la consecuencia). <b>Perquè</b> va después: <b>No surto perquè plou</b>.'],
['Practica','<p>Respuestas típicas con razones:</p>','',[['Per què no vens? — Perquè he de treballar.','¿Por qué no vienes? — Porque tengo que trabajar.'],['Com que fa fred, porto abric.','Como hace frío, llevo abrigo.'],['És un regal per a la teva mare.','Es un regalo para tu madre.'],['Ho he fet per ajudar-te.','Lo he hecho para ayudarte.']],'En español «por» y «para» tienen reglas parecidas, pero hay diferencias: «Es un libro para niños» = <b>per a nens</b> (finalidad/destinatario).']

['Més i menys','<p>Para comparar:</p>',mt(['','Estructura','Ejemplo'],[['superioridad','<b>més</b> + adj. + <b>que</b>','Ell és més alt que jo.'],['inferioridad','<b>menys</b> + adj. + <b>que</b>','Aquest és menys car que aquell.'],['igualdad (adj.)','<b>tan</b> + adj. + <b>com</b>','Ella és tan simpàtica com tu.'],['igualdad (nombre)','<b>tant / tanta / tants / tantes</b> + nombre + <b>com</b>','Té tants amics com tu.']]),[['Barcelona és més gran que Girona.','Barcelona es más grande que Girona.'],['Avui fa menys fred que ahir.','Hoy hace menos frío que ayer.'],['Treballo tant com tu.','Trabajo tanto como tú.']],'Se usa <b>que</b> con más/menos y <b>com</b> con tan/tant. Con números: <b>més de</b> / <b>menys de</b>: <b>Té més de trenta anys</b>.'],

['El més… i -íssim','<p>El superlativo relativo se forma con <b>el / la més + adj.</b> y el superlativo absoluto con <b>-íssim</b> o <b>molt</b>.</p>',mt(['Tipo','Ejemplo'],[['relativo','És el cotxe més car de la tenda.'],['relativo (fem.)','És la ciutat més bonica.'],['absoluto con molt','És molt bonic.'],['absoluto con -íssim','És bonic<b>íssim</b>. (muy bonito)']]),[['Aquest és el millor restaurant.','Este es el mejor restaurante.'],['Ella és la més alta de la classe.','Ella es la más alta de la clase.'],['La paella estava boníssima.','La paella estaba buenísima.']],'<b>-íssim</b> concuerda: <b>-íssim, -íssima, -íssims, -íssimes</b>. Ejemplos: <b>bo → boníssim</b>, <b>bonic → bonicíssim</b>, <b>car → carríssim</b>, <b>llarg → llarguíssim</b>.'],

L(13,'a2','Determinants i indefinits','Determinantes e indefinidos','🔢',28,

['Quantitat','<p>Estas palabras expresan la cantidad (poco, mucho, suficiente, demasiado):</p>',mt(['Palabra','Significa','Ejemplo'],[['molt / molta','mucho/a','Tinc molta feina.'],['poc / poca','poco/a','Tens poc temps.'],['massa','demasiado','Hi ha massa soroll.'],['prou','bastante, suficiente','Ja tinc prou.'],['gens de','nada de (negativa)','No tinc gens de gana.'],['gaire','mucho (negativa)','No hi ha gaire gent.'],['cap','ningún','No hi ha cap solució.']]),[['Menges massa sal.','Comes demasiada sal.'],['No tinc prou diners.','No tengo suficiente dinero.'],['No queda gens de pa.','No queda nada de pan.']],'<b>Massa</b> y <b>prou</b> no cambian de género: <b>massa soroll</b>, <b>massa gent</b>, <b>prou diners</b>. <b>Molt</b>, <b>poc</b>, <b>tot</b>, <b>algun</b> sí concuerdan.'],
['Algun, qualsevol, cada','<p>Más determinantes:</p>',mt(['Palabra','Significa','Ejemplo'],[['algun / alguna','algún / alguna','Tens algun problema?'],['alguns / algunes','algunos / algunas','Alguns amics vindran.'],['qualsevol','cualquier','Qualsevol dia és bo.'],['cada','cada','Cada setmana vaig a nedar.'],['tot / tota','todo / toda','Tot el dia.'],['tots / totes','todos / todas','Tots els alumnes.'],['mig / mitja','medio / media','Mig quilo, mitja hora.'],['quart','cuarto','Un quart d\'hora.']]),[['Tinc alguns dubtes.','Tengo algunas dudas.'],['Cada matí esmorzo cafè.','Cada mañana desayuno café.'],['Tot el barri ho sap.','Todo el barrio lo sabe.']],'<b>Tot</b> se combina con artículo: <b>tot el dia</b>, <b>tota la setmana</b>, <b>tots els dies</b>, <b>totes les festes</b>.'],
['Pronoms indefinits','<p>Palabras que no sustituyen a un nombre concreto:</p>',mt(['Palabra','Significa','Ejemplo'],[['<b>algú</b>','alguien','Hi ha algú?'],['<b>ningú</b>','nadie','No hi ha ningú.'],['<b>alguna cosa / quelcom</b>','algo','Vull alguna cosa.'],['<b>res</b>','nada','No vull res.'],['<b>tothom</b>','todo el mundo','Tothom ho sap.'],['<b>cadascú</b>','cada uno','Cadascú té la seva feina.']]),[['Algú ha trucat?','¿Ha llamado alguien?'],['No ho sap ningú.','No lo sabe nadie.'],['Tothom està content.','Todo el mundo está contento.']],'<b>Tothom</b> lleva el verbo en <b>singular</b>: <b>Tothom sap</b> (no «tothom saben»).'],

],

[
['Com es forma','<p>El <b>condicional</b> se forma como el futuro (raíz del infinitivo) + <b>-ia, -ies, -ia, -íem, -íeu, -ien</b>.</p>',mt(['','parlar','beure','dormir'],[['jo','parlaria','beuria','dormiria'],['tu','parlaries','beuries','dormiries'],['ell / ella','parlaria','beuria','dormiria'],['nosaltres','parlaríem','beuríem','dormiríem'],['vosaltres','parlaríeu','beuríeu','dormiríeu'],['ells / elles','parlarien','beurien','dormirien']]),[['Parlaria amb ell.','Hablaría con él.'],['Dormiríem més.','Dormiríamos más.'],['Què faries tu?','¿Qué harías tú?']],'Las raíces irregulares son las mismas que en el futuro: <b>tindria, vindria, voldria, podria, sabria, faria, diria, hauria, seria, aniria, veuria</b>.'],
['Cortesia','<p>El uso más importante: pedir cosas de manera educada.</p>',mt(['Directo','Cortés'],[['Vull un cafè.','<b>Voldria</b> un cafè.'],['Puc entrar?','<b>Podria</b> entrar?'],['M\'ajudes?','<b>Em podries</b> ajudar?'],['M\'agrada venir.','<b>M\'agradaria</b> venir.']]),[['Voldria dos bitllets, si us plau.','Querría dos billetes, por favor.'],['Em podria dir l\'hora?','¿Me podría decir la hora?'],['M\'agradaria parlar amb el director.','Me gustaría hablar con el director.']],'<b>Voldria</b> y <b>m\'agradaria</b> son las fórmulas de cortesía que más usarás en tiendas, bares y oficinas.'],
['Consells','<p>Para aconsejar con suavidad:</p>',mt(['Fórmula','Ejemplo'],[['<b>hauries de</b> + inf.','Hauries de descansar.'],['<b>seria millor</b> + inf.','Seria millor dormir més.'],['<b>jo en tu</b> + condicional','Jo en tu, li trucaria.'],['<b>què et sembla si…?</b>','Què et sembla si sortim?']]),[['Hauries d\'anar al metge.','Deberías ir al médico.'],['Seria millor que parlessis amb ell.','Sería mejor que hablaras con él.'],['Jo, en el teu lloc, no hi aniria.','Yo, en tu lugar, no iría.']],'<b>Jo en tu / Jo en el teu lloc</b> + condicional: «yo en tu lugar…».'],
['Hipòtesis','<p>Para imaginar situaciones, se usa <b>si</b> + imperfecto de subjuntivo + condicional. Solo reconocerás esta estructura en A2:</p>','',[['Si tingués diners, viatjaria.','Si tuviera dinero, viajaría.'],['Si fos tu, no ho faria.','Si fuera tú, no lo haría.'],['Si plogués, no sortiríem.','Si lloviera, no saldríamos.']],'La forma <b>tingués, fos, plogués</b> es el imperfet de subjuntiu. En A2 basta con reconocerla.']
],
[['el condicional','el condicional'],['voldria','querría'],['podria','podría'],['m\'agradaria','me gustaría'],['hauria de','debería'],['seria millor','sería mejor'],['jo en tu','yo en tu lugar'],['si + imperfet de subj.','si + imperfecto de subj.'],['la cortesia','la cortesía'],['el consell','el consejo']],

L(15,'a2','Subjuntiu','Subjuntivo','🧭',30,
['Formar el present de subjuntiu','Usarlo con vull que, cal que, espero que, és possible que','Distinguir indicatiu y subjuntiu','Reconocer el imperfet de subjuntiu'],
[
['Com es forma','<p>El <b>present de subjuntiu</b> de los verbos regulares se forma desde la 1.ª persona del presente:</p>',mt(['','parlar','beure','dormir'],[['jo','parli','begui','dormi'],['tu','parlis','beguis','dormis'],['ell / ella','parli','begui','dormi'],['nosaltres','parlem','beguem','dormim'],['vosaltres','parleu','begueu','dormiu'],['ells / elles','parlin','beguin','dormin']]),[['Vull que parlis amb ell.','Quiero que hables con él.'],['Espero que estiguis bé.','Espero que estés bien.'],['Cal que dormiu més.','Hace falta que durmáis más.']],'En <b>-ar</b>: <b>-i, -is, -i, -em, -eu, -in</b>. En el resto, la raíz de la 1.ª persona + <b>-i, -is, -i</b> (y -in); <b>nosaltres / vosaltres</b>, a menudo, la raíz «larga». <b>Anar</b>: vagi, vagis, vagi, anem, aneu, vagin.'],
['Quan s\'usa','<p>El subjuntivo aparece detrás de verbos y expresiones de deseo, influencia, duda o valoración:</p>',mt(['Expresión','Ejemplo'],[['<b>vull que</b>','Vull que vinguis.'],['<b>cal que</b>','Cal que parlem.'],['<b>espero que</b>','Espero que vagi bé.'],['<b>és possible que</b>','És possible que plogui.'],['<b>dubto que</b>','Dubto que ho sàpiga.'],['<b>no crec que</b>','No crec que sigui fàcil.'],['<b>és important que</b>','És important que escoltis.']]),[['Vull que m\'ajudis.','Quiero que me ayudes.'],['Espero que tinguis sort.','Espero que tengas suerte.'],['No crec que vingui.','No creo que venga.']],'Si el sujeto es el mismo en las dos partes, se usa el infinitivo: <b>Vull venir</b> (yo quiero venir) frente a <b>Vull que vinguis</b> (quiero que tú vengas).'],
['Indicatiu o subjuntiu?','<p>Una regla práctica:</p>',mt(['Indicativo','Subjuntivo'],[['Crec que <b>ve</b>.','No crec que <b>vingui</b>.'],['Sé que <b>és</b> fàcil.','Dubto que <b>sigui</b> fàcil.'],['És clar que <b>és</b> així.','És possible que <b>sigui</b> així.'],['Penso que <b>té</b> raó.','No penso que <b>tingui</b> raó.']]),[['Crec que ho sap.','Creo que lo sabe.'],['No crec que ho sàpiga.','No creo que lo sepa.']],'Cuando algo se <b>afirma como real</b> (creer, saber, pensar) → indicativo. Cuando se <b>niega, se duda o se desea</b> → subjuntivo.'],
['Imperfet de subjuntiu (reconeixement)','<p>Aparece cuando el verbo principal está en pasado o en condicional:</p>','',[['Volia que vinguessis.','Quería que vinieras.'],['Si tingués diners, viatjaria.','Si tuviera dinero, viajaría.'],['Em va dir que parlés amb ell.','Me dijo que hablara con él.'],['Dubtava que ho sabés.','Dudaba que lo supiera.']],'Reconócelo por las terminaciones <b>-és, -essis, -és, -éssim, -éssiu, -essin</b> (parlés, parlessis, parlés…). Para producirlo, espera a B1.']
],

c('Subjuntiu de «tenir» (jo):','tingui',['tinc','tindré','tingués'],'Tingui.'),
c('Subjuntiu de «anar» (jo):','vagi',['vaig','anaré','anés'],'Vagi.'),
c('«Vull que ___ amb mi.» (venir)','vinguis',['véns','vindràs','vinguessis'],'Vull que + subjuntiu.'),

t('Subjuntiu de «dir» (jo):','digui','Digui.'),

L(16,'a2','Imperatiu amb pronoms','Imperativo con pronombres','📣',28,
['Formar el imperatiu afirmativo y negativo','Colocar los pronombres débiles con el imperativo','Dar instrucciones, consejos y órdenes','Usar el imperativo formal (vostè)'],
[
['Imperatiu afirmatiu','<p>Las formas del imperativo: <b>tu</b>, <b>vostè</b>, <b>nosaltres</b>, <b>vosaltres</b>, <b>vostès</b>.</p>',mt(['','parlar','beure','dormir','fer'],[['tu','parla','beu','dorm','fes'],['vostè','parli','begui','dormi','faci'],['nosaltres','parlem','bevem','dormim','fem'],['vosaltres','parleu','beveu','dormiu','feu'],['vostès','parlin','beguin','dormin','facin']]),[['Parla més a poc a poc!','¡Habla más despacio!'],['Fes els deures!','¡Haz los deberes!'],['Seieu, si us plau.','Sentaos, por favor.'],['Prengui seient.','Tome asiento.']],'Algunos «tu» irregulares: <b>sigues</b> (ser), <b>vés</b> (anar), <b>fes</b>, <b>digues</b>, <b>ves</b>, <b>vine</b> (venir), <b>tingues</b>.'],
['Imperatiu negatiu','<p>El negativo usa el <b>subjuntivo</b>: <b>no + subjuntiu</b>.</p>',mt(['','Afirmativo','Negativo'],[['tu','parla','no parlis'],['vostè','parli','no parli'],['nosaltres','parlem','no parlem'],['vosaltres','parleu','no parleu'],['vostès','parlin','no parlin']]),[['No parlis tan fort!','¡No hables tan fuerte!'],['No fumeu aquí.','No fuméis aquí.'],['No tinguis por.','No tengas miedo.']],'Fíjate: <b>tu</b> afirmativo (<b>parla</b>) ≠ <b>tu</b> negativo (<b>no parlis</b>).'],
['Pronoms amb imperatiu','<p>Con el imperativo afirmativo, los pronombres van <b>después</b>, unidos con guion. Con el negativo, van <b>antes</b>.</p>',mt(['Afirmativo','Negativo'],[['<b>Dóna\'m</b> el llibre.','No <b>me\'l</b> donis.'],['<b>Digues-li</b> la veritat.','No <b>li</b> diguis res.'],['<b>Mira\'l</b>!','No <b>el</b> miris!'],['<b>Porta-me\'l</b> demà.','No <b>me\'l</b> portis.'],['<b>Ajuda\'ns</b>!','No <b>ens</b> ajudis.']]),[['Dóna\'m una mà.','Échame una mano.'],['Digues-ho clar.','Dilo claro.'],['No m\'ho diguis.','No me lo digas.']],'Apostrofes y guiones: <b>Dóna\'m</b> (dóna + em → m), <b>mira\'l</b> (mira + el → \'l), <b>ajuda\'ns</b> (ajuda + ens → \'ns), <b>digues-li</b> (después de consonante).'],
['Frases habituals','<p>Estas frases con imperativo y pronombres son muy frecuentes:</p>','',[['Perdona\'m, no t\'he sentit.','Perdóname, no te he oído.'],['Digues-me\'n un.','Dime uno (de eso).'],['Passa-ho bé!','¡Pásalo bien!'],['Deixa\'m en pau!','¡Déjame en paz!'],['Truca\'m demà!','¡Llámame mañana!'],['Fes-me un favor.','Hazme un favor.']],'Para pedir con cortesía añade <b>si us plau</b>: <b>Truca\'m, si us plau.</b>']
],

/* ===== A2 · lliçons 17–24 ===== */
L(17,'a2','Opinions','Opiniones','💬',25,
['Dar y pedir opinión con crec que, em sembla, penso que','Mostrar acuerdo y desacuerdo','Hacer una reclamación con educación','Usar expresiones y frases hechas frecuentes'],
[
['Donar la teva opinió','<p>Fórmulas para opinar:</p>',mt(['Fórmula','Ejemplo'],[['<b>crec que</b> + indicativo','Crec que té raó.'],['<b>em sembla que</b> + indicativo','Em sembla que és car.'],['<b>penso que</b> + indicativo','Penso que és una bona idea.'],['<b>per a mi</b>','Per a mi, és massa fàcil.'],['<b>en la meva opinió</b>','En la meva opinió, hauries d\'anar.'],['<b>segons mi / segons ell</b>','Segons ell, va ser un error.']]),[['Què en penses? — Em sembla bé.','¿Qué piensas? — Me parece bien.'],['Què et sembla el pla? — Crec que és genial.','¿Qué te parece el plan? — Creo que es genial.'],['Penso que cal canviar-ho.','Pienso que hay que cambiarlo.']],'En afirmativo, <b>indicativo</b>: <b>Crec que ve</b>. En negativo, <b>subjuntivo</b>: <b>No crec que vingui</b>.'],
['Acord i desacord','<p>Para mostrar si compartes una opinión:</p>',mt(['Función','Frase'],[['acuerdo total','Estic totalment d\'acord. / Tens tota la raó.'],['acuerdo parcial','Tens raó en part. / Sí, però…'],['desacuerdo','No hi estic d\'acord. / No ho crec.'],['duda','No ho sé. / Potser sí, potser no.'],['pedir opinión','Què en penses? / Tu què diries?']]),[['Estic d\'acord amb tu.','Estoy de acuerdo contigo.'],['No hi estic gens d\'acord.','No estoy nada de acuerdo.'],['Tens raó, tens tota la raó.','Tienes razón, tienes toda la razón.']],'<b>Estar d\'acord amb</b> + persona: <b>Estic d\'acord amb ell</b>. <b>Estar d\'acord en</b> + cosa: <b>Estem d\'acord en el preu</b>.'],
['Queixes i reclamacions','<p>Para reclamar con educación y claridad:</p>','',[['Perdoni, tinc un problema amb la comanda.','Perdone, tengo un problema con el pedido.'],['El producte no funciona.','El producto no funciona.'],['Voldria canviar-lo o que em tornin els diners.','Quisiera cambiarlo o que me devuelvan el dinero.'],['Em sap greu molestar-lo, però…','Siento molestarle, pero…'],['Podria parlar amb el responsable?','¿Podría hablar con el responsable?']],'Estructuras útiles: <b>Voldria fer una reclamació</b>, <b>No estic satisfet amb…</b>, <b>Esperava que…</b> (esperaba que…).'],

L(18,'a2','Verbs amb règim i copulatius','Verbos con régimen y copulativos','🔀',28,

['Preposicions fixes','<p>Muchos verbos catalanes se construyen con una preposición concreta. Apréndelos junto a su preposición.</p>',mt(['Verbo','Preposición','Ejemplo'],[['pensar','<b>en</b>','Penso en tu.'],['començar','<b>a</b>','Comença a ploure.'],['acabar','<b>de</b> / <b>amb</b>','Acabo de sortir. / Acabem amb això.'],['dependre','<b>de</b>','Depèn del temps.'],['confiar','<b>en</b>','Confio en tu.'],['somiar','<b>en</b> / <b>amb</b>','Somio en viatjar.'],['preocupar-se','<b>per</b>','Em preocupo per tu.'],['recordar-se','<b>de</b>','Em recordo de tot.'],['oblidar-se','<b>de</b>','M\'he oblidat de tu.'],['parlar','<b>de</b> / <b>amb</b>','Parlem de tu. / Parlo amb ell.']]),[['Això depèn de tu.','Eso depende de ti.'],['Penso en el futur.','Pienso en el futuro.'],['Comencem a treballar.','Empezamos a trabajar.']],'Para evitar calcos: <b>soñar con</b> = somiar en / amb; <b>pensar en</b> (no «pensar de»); <b>dependre de</b> (no «depender en»).'],
['Verbs copulatius','<p>Los verbos copulativos unen el sujeto con un adjetivo o sustantivo. Los principales:</p>',mt(['Verbo','Significado','Ejemplo'],[['<b>ser</b>','ser','És metge.'],['<b>estar</b>','estar','Està content.'],['<b>semblar</b>','parecer','Sembla jove.'],['<b>quedar-se</b>','quedarse','Es va quedar sol.'],['<b>tornar-se</b>','volverse','Es va tornar boig.'],['<b>fer-se</b>','hacerse','Es va fer gran.'],['<b>posar-se</b>','ponerse','Es va posar vermell.'],['<b>assemblar-se</b>','parecerse','Se sembla al seu pare.']]),[['Sembla cansat.','Parece cansado.'],['Es va quedar sol a casa.','Se quedó solo en casa.'],['Es va posar malalt.','Se puso enfermo.']],'<b>Semblar</b> + adjetivo (<b>sembla fàcil</b>) y <b>assemblar-se a</b> + persona (<b>s\'assembla a la seva mare</b>): no los confundas.'],

L(19,'a2','Relatius i connectors','Relativos y conectores','🔗',28,

[
['Relatius: que, on, qui','<p>Los pronombres relativos sirven para unir dos frases:</p>',mt(['Relativo','Para…','Ejemplo'],[['<b>que</b>','personas y cosas','El llibre que llegeixo és bo.'],['<b>on</b>','lugar','La ciutat on visc és petita.'],['<b>qui</b>','personas (con preposición)','L\'amic amb qui vaig anar.'],['<b>el qual / la qual</b>','personas y cosas (formal)','La casa en la qual visc.'],['<b>el que / allò que</b>','lo que','El que vull és descansar.']]),[['Aquesta és la noia que treballa amb mi.','Esta es la chica que trabaja conmigo.'],['El bar on esmorzem és barat.','El bar donde desayunamos es barato.'],['No sé qui ho ha fet.','No sé quién lo ha hecho.']],'Con <b>que</b> el nombre al que se refiere va justo antes: <b>el cotxe que he comprat</b>. Después de preposición se usa <b>què</b> o <b>qui</b>: <b>l\'amic amb qui parlo</b>, <b>la cosa de què parlem</b>.'],
['Tot i que, encara que','<p>Para contrastar o conceder:</p>',mt(['Conector','Significa','Ejemplo'],[['<b>tot i que</b>','aunque (+ indicativo)','Tot i que plou, surto.'],['<b>encara que</b>','aunque (+ subjuntivo)','Encara que plogui, sortiré.'],['<b>però</b>','pero','Vull venir, però no puc.'],['<b>en canvi</b>','en cambio','Ell és alt; ella, en canvi, és baixa.'],['<b>tanmateix</b>','sin embargo','És car; tanmateix, el compraré.']]),[['Tot i que estic cansat, vindré.','Aunque estoy cansado, vendré.'],['Encara que no et vegi, t\'estimo.','Aunque no te vea, te quiero.'],['Plou, però farem el passeig.','Llueve, pero haremos el paseo.']],'<b>Tot i que</b> + indicativo (hecho real); <b>encara que</b> + subjuntivo (hipotético).'],
['Doncs, per tant, així que','<p>Para concluir:</p>',mt(['Conector','Ejemplo'],[['<b>doncs</b>','Si no vols venir, doncs no vinguis.'],['<b>per tant</b>','Estic malalt; per tant, no vindré.'],['<b>així que</b>','Plou, així que no sortim.'],['<b>per això</b>','Tinc son; per això em llevo tard.'],['<b>en conclusió</b>','En conclusió, és una bona idea.']]),[['Penso, doncs existeixo.','Pienso, luego existo.'],['No tenia diners, així que no vaig comprar res.','No tenía dinero, así que no compré nada.']],'<b>Doncs</b> no significa «entonces» siempre: a veces introduce una respuesta («Doncs vine!»).'],
['Quan, mentre, abans que','<p>Conectores de tiempo:</p>',mt(['Conector','Significa','Ejemplo'],[['<b>quan</b>','cuando','Quan arribis, truca\'m.'],['<b>mentre</b>','mientras','Mentre cuino, escolto música.'],['<b>abans que</b>','antes de que (+ subj.)','Truca\'m abans que sigui tard.'],['<b>després que</b>','después de que','Després que va marxar, vam parlar.'],['<b>fins que</b>','hasta que','Espero fins que arribis.'],['<b>des que</b>','desde que','Des que visc aquí, sóc feliç.']]),[['Quan era petit, jugava al carrer.','Cuando era pequeño, jugaba en la calle.'],['Mentre ell dormia, jo treballava.','Mientras él dormía, yo trabajaba.']],'Después de <b>quan</b> con futuro, se usa el <b>subjuntivo</b>: <b>Quan vinguis, parlarem</b> (cuando vengas…), no «quan vindràs».']
],

(function(){const R=[["a11#1", "e", "La h se llama «hac» y es muda: «hora» se pronuncia «ora» y «hotel» «otel». Nunca suena como la «j» castellana. Aun así hay que escribirla, y por eso importa en el artículo: l'hora, l'home."], ["a11#2", "e", "La x se llama «ics» (el nombre habitual en el catalán central; en algunas zonas se oye «xeix»). No se llama «equis» como en castellano. Suena «ks» en «taxi» y «sh» en «xocolata»."], ["a11#3", "e", "El dígrafo «tx» suena como la «ch» castellana de «chico»: cotxe (coche), esquitx, txec. La letra «ch» sola no existe en catalán (solo en nombres extranjeros)."], ["a11#4", "e", "El dígrafo «ny» representa el sonido «ñ»: any (año), senyor (señor), Catalunya. La «ñ» no existe en catalán. Es una de las diferencias más visibles al escribir."], ["a11#5", "e", "En catalán hay dos acentos: el agudo (´) y el grave (`). «Cafè» lleva acento grave porque la e es abierta. «Café» (agudo) sería la forma castellana. Regla práctica: a, e, o pueden llevar los dos; i, u solo agudo; ò y è son siempre abiertas, é y ó cerradas."], ["a11#6", "e", "La h inicial es muda: hora = «ora», home = «ome», hospital = «ospital». Nunca se aspira ni suena como la «j» castellana. Pero se escribe siempre y afecta al artículo: l'hora, l'home."], ["a11#7", "e", "«Com s'escriu?» es la pregunta que usas al pedir que te deletreen una palabra. Fíjate: com = cómo, s'escriu = se escribe (pronombre se + escriure). Respuesta típica: «Es escriu ema-a-erra-i-a»."], ["a11#8", "e", "El punt volat «l·l» marca una «l» doble que se pronuncia como dos eles seguidas: col·legi, intel·ligent. No se confunde con «ll», que suena como la «ll» de «lluvia» en el catalán central (llibre). Se escribe con el punto a media altura (Alt+0183 o Ctrl+punto en muchos teclados)."], ["a11#9", "h", "Letra de nombre corto, dos letras, empieza por la propia letra. Piensa en cómo se dice en castellano «pe»."], ["a11#9", "e", "La p se llama «pe» (como en castellano). Los nombres de letras catalanes coinciden bastante con los castellanos: be, ce, de, efe… pero hay diferencias: hac (h), ics (x), ela (l), ema (m)."], ["a11#10", "h", "No es «ku» ni «ca»: es una sílaba con la u. Ayuda: la q siempre va acompañada de ella."], ["a11#10", "e", "La q se llama «cu». Siempre va seguida de «u»: què, qui, quatre. Por eso su nombre ya la lleva."], ["a11#11", "h", "Verbo «dir-se» (llamarse): yo me llamo → em ___. Es la 1.ª persona del presente: una sola sílaba, empieza por d."], ["a11#11", "e", "«Em dic» = me llamo. El verbo es dir-se (literalmente «decirse»). Conjugación: em dic, et dius, es diu, ens diem, us dieu, es diuen. Es mucho más natural que «jo sóc…» para presentarse."], ["a11#12", "t", "Com et dius? = ¿cómo te llamas? Es la pregunta informal (tu). Para usted: «Com es diu?». Respuesta: «Em dic ___»."], ["a12#1", "e", "Con «jo» el verbo ser es «sóc» (yo soy). Presente de ser: sóc, ets, és, som, sou, són. Fíjate en que «ets» (tú eres) y «sou» (vosotros sois) difieren del castellano más que «som/són»."], ["a12#2", "e", "Con «tu» el verbo ser es «ets». La pregunta «Tu ets de Barcelona?» va con el sujeto explícito para dar énfasis; normalmente se dice solo «Ets de Barcelona?»."], ["a12#3", "e", "«Nosaltres som» = nosotros somos. Se parece al castellano, pero cuidado: «som» (nosaltres) y «són» (ells) difieren solo en la -n final."], ["a12#4", "e", "«Ells són» = ellos son. La 3.ª persona del plural es «són» y la 2.ª del plural «sou». Con acento: són (con tilde), sou (sin tilde)."], ["a12#5", "e", "La edad se dice con tenir, no con ser: ella té trenta anys (no «és trenta anys»). Tenir: tinc, tens, té, tenim, teniu, tenen."], ["a12#6", "e", "Del 21 al 29 va «vint-i-» y del 31 en adelante no hay «i»: trenta-un, trenta-dos, quaranta-cinc. Además, 31 = trenta-un (no «trenta-i-un»), y 21 = vint-i-un."], ["a12#7", "e", "«Fins demà» = hasta mañana. Fíjate: fins = hasta, demà = mañana. Otras despedidas: fins ara (hasta ahora), fins aviat (hasta pronto), fins dilluns (hasta el lunes)."], ["a12#8", "e", "«Bona tarda» sirve desde el mediodía hasta que oscurece; «bona nit» se usa de noche, tanto para saludar como para despedirse. Para las 20 h en invierno ya es de noche, así que dirías «bona nit»; en verano todavía «bona tarda». Ambas se aceptan."], ["a12#9", "h", "Verbo «dir-se», 1.ª persona del presente. Palabra de tres letras."], ["a12#9", "e", "«Em dic Anna» = me llamo Anna. Es el verbo dir-se; en catalán es lo normal para decir el nombre (también se oye «sóc l'Anna»)."], ["a12#10", "h", "Verbo ser, 2.ª persona del plural (vosotros). Cuatro letras, empieza por s y termina en u."], ["a12#10", "e", "«Vosaltres sou» = vosotros sois. Para la forma de cortesía, con «vostè» se usa «és» y con «vostès» «són»."], ["a12#11", "h", "Cuarenta = quaranta. Recuerda: del 31 en adelante no lleva «i»: decena + guion + unidad."], ["a12#11", "e", "45 = quaranta-cinc. Se escriben con guion y sin «i» (a partir del 31). Los números del 21 al 29 llevan «-i-»: vint-i-cinc."], ["a12#12", "t", "Dos frases unidas con «i»: «em dic Pau» + «sóc de Girona». «Sóc de» + ciudad dice de dónde eres (origen), no dónde vives (eso es «visc a»)."], ["a12#13", "t", "Quants anys tens? = ¿cuántos años tienes? Se usa tenir (no ser). Respuesta: «Tinc vint-i-cinc anys»."], ["a13#1", "e", "Delante de una palabra que empieza por vocal o h, el artículo singular se apostrofa: l'hora, l'amic, l'escola. Esto ocurre tanto con «el» como con «la». El plural no se apostrofa: les hores."], ["a13#2", "e", "Plural femenino: «les». «Taules» ya lleva -es. Masculino plural es «els», femenino plural «les». Se pronuncian con la «s» final."], ["a13#3", "e", "Plural de nombre terminado en consonante: se añade -s (gat → gats). La excepción son los terminados en -s, -x, -sc, -st, -xt: se añade -os (autobús → autobusos)."], ["a13#4", "e", "Los nombres femeninos en -a cambian a -es: casa → cases, taula → taules. Ojo con las que acaban en -ca, -ga, -ça, -gua: la ortografía se ajusta (amiga → amigues, llengua → llengües)."], ["a13#5", "e", "Los nombres en -ç hacen el plural en -ços: braç → braços. La ç se mantiene delante de o para conservar el sonido /s/ (si escribiéramos «braços» con c sonaría /k/)."], ["a13#6", "e", "El adjetivo concuerda en género y número con el nombre: una casa blanca (fem. sing.). «Un casa» o «una casa blanc» son erróneos. Si el nombre es masculino, «blanc» (un cotxe blanc)."], ["a13#7", "e", "Plural de negre: negres. Los adjetivos acabados en -e (negre, jove, content) añaden -s en plural: negres, joves. Concuerda con «els cotxes» (masc. plural)."], ["a13#8", "e", "Delante de un nombre propio que empieza por vocal usamos l': l'Anna, l'Albert. El artículo personal «en/na» solo se usa ante consonante: en Pere, na Joana."], ["a13#9", "e", "El artículo personal «en» (hombres) y «la» (mujeres) precede al nombre de pila: en Pere, la Marta. En el habla actual se oye «el Pere» también, pero «en Pere» es la norma tradicional."], ["a13#10", "h", "Plural de un nombre que acaba en consonante: no hay que cambiar nada, solo añadir una letra al final."], ["a13#10", "e", "Amic termina en consonante → plural amics (añade -s). Es la regla más simple. No cambia la raíz."], ["a13#11", "h", "Femenino de un adjetivo masculino acabado en consonante: se añade -a. Cuidado: el acento no cambia."], ["a13#11", "e", "Alt → alta (femenino). Muchos adjetivos masculinos terminan en consonante y su femenino añade -a: gran → gran (invariable), bo → bona, content → contenta."], ["a13#12", "h", "Termina en -s: no se añade solo -s. Prueba con -os."], ["a13#12", "e", "Los nombres que acaban en -s, -x, -sc, -st, -xt (masculinos) añaden -os: autobús → autobusos, peix → peixos, text → textos. Es para facilitar la pronunciación."], ["a13#13", "t", "«Els llibres són vermells»: masculino plural. Orden: artículo + nombre + ser + adjetivo concordado. Recuerda que vermell → vermells."], ["a14#1", "e", "Germana es femenino singular, así que el posesivo es «la meva»: la meva germana. Fíjate en que el posesivo lleva artículo: la meva, el meu, els meus, les meves."], ["a14#2", "e", "Pares es masculino plural → «els meus». El posesivo concuerda con lo poseído, no con el poseedor."], ["a14#3", "e", "Amics = masculino plural → «els nostres». Posesivo de «nosaltres»: el nostre, la nostra, els nostres, les nostres."], ["a14#4", "e", "La tia es la hermana de tu padre o de tu madre. Otros parentescos: oncle (tío), cosí/cosina (primo/a), nebot/neboda (sobrino/a)."], ["a14#5", "e", "Con «tu» el verbo viure es vius. Presente de viure: visc, vius, viu, vivim, viviu, viuen. La forma «visc» es irregular (yo vivo)."], ["a14#6", "e", "Con «jo» el verbo viure es visc. Cuidado con confundirlo con «vius» (tú) y «viu» (él)."], ["a14#7", "e", "Solter es masculino singular (soltero); el femenino es soltera. Estic solter = estoy soltero. «Casat/casada» (casado), «divorciat/da», «vidu/vídua»."], ["a14#8", "e", "Els meus avis (tercera persona plural) → viuen. Terminación -en para ellos/ellas. «Avi» (abuelo) / «àvia» (abuela)."], ["a14#9", "h", "Mi madre. Palabra de cuatro letras, parecida a «madre»."], ["a14#9", "e", "La meva mare. Mare = madre; pare = padre. Fíjate en que ambas empiezan por «ma-/pa-» como en castellano."], ["a14#10", "h", "Hermanos, en plural masculino: lleva -s final y empieza por g."], ["a14#10", "e", "Els teus germans. Germà (hermano) / germana (hermana). El plural masculino germans incluye hermanos y hermanas juntos."], ["a14#11", "h", "Posesivo de tercera persona, masculino singular: tres letras, empieza por s."], ["a14#11", "e", "El seu pare. «Seu» concuerda con «pare» (masc. sing.). Vale para «su» de él, de ella, de usted o de ellos: el context lo aclara."], ["a14#12", "t", "Tinc = tengo. Orden: tinc + número + nombre en plural. Para decir cuántos hermanos tienes: «Tinc dos germans»."], ["a14#13", "t", "La meva germana: el posesivo lleva artículo y concuerda con lo poseído (germana = femenino). Viu a Madrid: viure + a + ciudad."], ["a15#1", "e", "«Hi ha» = hay (existencia). Va con cosas no determinadas: «Hi ha una taula». Es invariable: «hi ha» sirve para singular y plural. No se usa «està» para existencia."], ["a15#2", "e", "Para localizar algo que ya conoces (la nevera, el meu llibre) se usa «és/són»: «La nevera és a la cuina». «Hi ha» solo sirve para cosas no determinadas."], ["a15#3", "e", "Sota = debajo de. Preposiciones de lugar: sobre/damunt (encima), sota (debajo), dins (dentro), fora (fuera), davant (delante), darrere (detrás), entre (entre), al costat de (al lado de)."], ["a15#4", "e", "Damunt (de) = encima de. «Sobre» también se usa con el mismo significado. Su opuesto es «sota» (debajo)."], ["a15#5", "e", "Para preguntar si algo existe: «Hi ha un ascensor?» (¿hay un ascensor?). Orden de pregunta: Hi ha + un/una + nombre?"], ["a15#6", "e", "a + el = al (contracción obligatoria): vaig al mercat, estic al bar. Con la, les, l' no se contrae: a la cuina."], ["a15#7", "e", "de + el = del (contracción obligatoria): el llibre del professor. Con «de la / de l' / de les» no se contrae."], ["a15#8", "e", "Viure en un pis: la preposición es «en» ante tipos de vivienda (en un pis, en una casa). Pero para ciudad: «viure a Barcelona»."], ["a15#9", "e", "«Hi ha cinc habitacions» = hay cinco habitaciones. La estructura es hi ha + número + nombre plural. No cambia «ha» al plural: mismo verbo, siempre «hi ha»."], ["a15#10", "h", "Preposición «encima de» abreviada: empieza por d."], ["a15#10", "e", "«Damunt» (o «sobre») significa encima. Frase completa: «El mòbil és damunt la taula»."], ["a15#11", "h", "Contracción de a + el. Dos letras."], ["a15#11", "e", "a + el = al: «Visc al carrer Major». Fíjate que en catalán se dice «al carrer», no «en la calle»."], ["a15#12", "t", "Orden: al meu pis (a + el) + hi ha + número + nombre en plural. En catalán, el pronombre «hi» es parte fija de «hi ha»."], ["a15#13", "t", "Ser se usa para localizar algo determinado (el gat, la nevera). Para existencia, «hi ha». Preposición: «sota» (debajo) con o sin «de»."], ["a16#1", "e", "Aquest (masc. sing.) = este. Demostrativos: aquest/aquesta/aquests/aquestes (cerca); aquell/aquella/aquells/aquelles (lejos); això (neutro cerca), allò (neutro lejos)."], ["a16#2", "e", "Casa es femenino → aquesta casa. Concordancia: aquest (m.), aquesta (f.)."], ["a16#3", "e", "«Això» es el neutro de cercanía y no varía: això és fàcil. No acompaña a un nombre, sustituye a toda una idea («esto»)."], ["a16#4", "e", "Aquells cotxes (masc. plural, lejos) → vells (masc. plural). Adjetivo en -ell → plural -ells: vell → vells. El femenino sería velles."], ["a16#5", "e", "Ordinales masculinos: primer, segon, tercer, quart, cinquè, sisè… Tercer = tercero. No confundir con «terç» (un tercio)."], ["a16#6", "e", "Del 5.º en adelante el ordinal masculino termina en -è: cinquè, sisè, setè, vuitè, novè, desè. «Desè» = décimo. Femenino: desena."], ["a16#7", "e", "Para preguntar por datos se usa «Quina és…?» (¿cuál es?): Quina és la teva adreça? / Quin és el teu telèfon? «Quin» concuerda con el género de lo preguntado."], ["a16#8", "e", "«On és…?» = ¿dónde está…? Es la pregunta básica para localizar. Con plural: «On són els lavabos?»."], ["a16#9", "e", "a + el = al. Se escribe y se pronuncia como una sola palabra: «al banc». No se dice «a el»."], ["a16#10", "h", "Ordinal masculino del 2.º: sustituye la forma que usarías con «pis»."], ["a16#10", "e", "Segon = segundo (masc.), segona (fem.). «Visc al segon pis». En direcciones se escribe «2n»."], ["a16#11", "h", "Ordinal femenino de primero: acaba en -a."], ["a16#11", "e", "Primera = primera (fem.). La porta primera = la puerta primera. Abreviatura: 1a."], ["a16#12", "h", "Neutro de lejanía: no concuerda con género. Cuatro letras, empieza por a."], ["a16#12", "e", "Allò es el neutro de lejanía («aquello»). Aquest/aquesta = este/esta; això/allò = esto/aquello (neutros)."], ["a16#13", "t", "On és + lugar (con artículo): «On és l'ajuntament?». El verbo «és» sirve porque el lugar está determinado."], ["a17#1", "e", "Los verbos en -ar hacen la 1.ª persona en -o: parlo, treballo, estudio. Terminaciones: -o, -es, -a, -em, -eu, -en."], ["a17#2", "e", "2.ª singular = -es: treballes. «Treballes» (tú trabajas). Cuidado con confundirla con «treballa» (él)."], ["a17#3", "e", "1.ª plural = -em: escoltem. Nosaltres escoltem música. La -m final marca a «nosaltres» en casi todos los tiempos."], ["a17#4", "e", "2.ª plural = -eu: parleu. Vosaltres parleu. La terminación -eu corresponde a «vosotros»."], ["a17#5", "e", "3.ª plural = -en: cuinen. Ells cuinen. La terminación -en corresponde a «ellos/ellas»."], ["a17#6", "e", "Busquem viene de buscar. Cambio ortográfico: c → qu antes de e (busco, busques, busquem). Es para mantener el sonido /k/."], ["a17#7", "e", "Pagar → pagues: g → gu antes de e (pago, pagues, paga, paguem). Mantiene el sonido /g/ fuerte."], ["a17#8", "e", "Començar tiene ç antes de a/o/u (començo) pero c antes de e/i (comencem, comences). Es la ortografía de mantener el sonido /s/."], ["a17#9", "h", "1.ª persona de un verbo en -ar que ya acaba en vocal: es igual que en castellano, sin cambio."], ["a17#9", "e", "Estudiar: jo estudio (igual que el castellano). Presente: estudio, estudies, estudia, estudiem, estudieu, estudien."], ["a17#10", "h", "3.ª persona singular de -ar: termina en -a."], ["a17#10", "e", "Mirar: ella mira. 3.ª singular -a. Para ver la tele se dice «mirar la televisió»."], ["a17#11", "h", "2.ª persona plural: termina en -eu."], ["a17#11", "e", "Preparar: vosaltres prepareu. 2.ª plural -eu."], ["a17#12", "t", "Negación: no + verbo conjugado. «No parlo francès». No se pone sujeto salvo para enfatizar."], ["a17#13", "t", "Nosaltres treballem: -em para «nosotros». «En una escola» = preposición «en» + artículo indefinido."], ["a214#1", "e", "Condicional: infinitivo + terminaciones del imperfet de haver: -ia, -ies, -ia, -íem, -íeu, -ien. Parlar → parlaria = hablaría."], ["a214#2", "e", "Voler tiene raíz irregular voldr-: voldria, voldries, voldria, voldríem, voldríeu, voldrien. «Voldria» = quisiera. Es la forma cortés de pedir."], ["a214#3", "e", "Poder → podria, podries, podria, podríem, podríeu, podrien. Raíz podr-. «Podries ajudar-me?» = ¿podrías ayudarme?"], ["a214#4", "e", "Ser → seria, series, seria, seríem, seríeu, serien. «Seria bonic» = sería bonito."], ["a214#5", "e", "Tenir → tindria, tindries, tindria, tindríem, tindríeu, tindrien. Nosaltres → tindríem (con tilde en la í)."], ["a214#6", "e", "Para pedir con cortesía: «Voldria un cafè». Más educado que «Vull un cafè» o una orden como «Dóna'm un cafè»."], ["a214#7", "e", "«Hauries de descansar» = deberías descansar. Haver de + infinitivo en condicional. Equivalente a «deberías» o «tendrías que»."], ["a214#8", "e", "Consejo con «jo en tu»: condicional. «Jo en tu, li trucaria» = yo en tu lugar, le llamaría. «Jo en el teu lloc» es la forma completa."], ["a214#9", "h", "Condicional de fer: raíz far- + -ia."], ["a214#9", "e", "Faria = yo haría. Fer → faria, faries, faria, faríem, faríeu, farien. Raíz far- (igual que el futuro)."], ["a214#10", "h", "Condicional de dir: dir + -ies."], ["a214#10", "e", "Diries = tú dirías. Dir → diria, diries, diria, diríem, diríeu, dirien. Regular."], ["a214#11", "h", "Condicional de agradar: agradar + -ia."], ["a214#11", "e", "M'agradaria = me gustaría. «M'agradaria venir» = me gustaría venir. Forma cortés."], ["a214#12", "t", "Voldria + objeto. «Voldria dos bitllets» = quisiera dos billetes."], ["a214#13", "t", "Hauries d' + infinitivo. «Hauries d'anar al metge» = deberías ir al médico."], ["a215#1", "e", "Subjuntiu presente de -ar: -i, -is, -i, -em, -eu, -in. Parlar → parli, parlis, parli, parlem, parleu, parlin. Tu → parlis."], ["a215#2", "e", "Venir → vingui, vinguis, vingui, vinguem, vingueu, vinguin. Raíz irregular vingu-."], ["a215#3", "e", "Ser → sigui, siguis, sigui, siguem, sigueu, siguin. Ell → sigui."], ["a215#4", "e", "Tenir → tingui, tinguis, tingui, tinguem, tingueu, tinguin. Jo → tingui."], ["a215#5", "e", "Anar → vagi, vagis, vagi, anem, aneu, vagin. Jo → vagi. (Nosaltres y vosaltres usan la raíz an-: anem, aneu)."], ["a215#6", "e", "«Vull que» + subjuntivo cuando el sujeto es distinto. «Vull que vinguis amb mi» = quiero que vengas conmigo."], ["a215#7", "e", "«Espero que» + subjuntivo. «Espero que estiguis bé». Estar → estigui, estiguis, estigui, estiguem, estigueu, estiguin."], ["a215#8", "e", "«No crec que» + subjuntivo. «No crec que sigui fàcil». En afirmativo («crec que») se usa indicativo."], ["a215#9", "h", "Fer → subjuntiu: raíz faci-: fac + -is."], ["a215#9", "e", "Facis = tú hagas. Fer → faci, facis, faci, fem, feu, facin. Nosaltres/vosaltres usan fem/feu."], ["a215#10", "h", "Dir → subjuntiu: dig + -ui."], ["a215#10", "e", "Digui = yo diga. Dir → digui, diguis, digui, diguem, digueu, diguin."], ["a215#11", "h", "Venir, 2.ª plural del subjuntivo: vingu + -eu."], ["a215#11", "e", "Vingueu = vengáis. «Cal que vingueu» = es necesario que vengáis."], ["a215#12", "t", "Vull que + subjuntivo. «Vull que vinguis» = quiero que vengas."], ["a215#13", "t", "Espero que + subjuntivo. «Espero que estiguis bé»."], ["a216#1", "e", "Imperativo afirmativo tu: parla (igual que la 3.ª persona del presente). «Parla més a poc a poc» = habla más despacio."], ["a216#2", "e", "Imperativo negativo tu: no + subjuntivo. «No parlis» = no hables. No se usa «no parla»."], ["a216#3", "e", "Imperativo de vostè: prengui (subjuntivo). «Prengui això cada dia» = tome esto cada día."], ["a216#4", "e", "«Dóna'm» = dame. Imperativo dóna + em → dóna'm. El apóstrofo marca que «em» se une al imperativo."], ["a216#5", "e", "«Digues-li» = dile. Imperativo digues + li → digues-li (con guion, porque termina en consonante)."], ["a216#6", "e", "«No m'ho diguis» = no me lo digas. Imperativo negativo: pronombres antes del verbo."], ["a216#7", "e", "«Truca'm demà» = llámame mañana. Imperativo truca + em → truca'm."], ["a216#8", "e", "«Mira'l!» = ¡míralo! Imperativo mira + el → mira'l (apóstrofo)."], ["a216#9", "h", "Imper
