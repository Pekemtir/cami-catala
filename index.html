:root{--f-d:'Patrick Hand','Comic Sans MS',cursive,system-ui;--f-b:'Nunito',system-ui,sans-serif;
--bg:#1d3a2f;--bg2:#17302a;--surface:#27493b;--surface2:#2f5546;--ink:#f3f1e4;--muted:#b7c9bd;--line:#4d7260;
--yel:#f4d35e;--on-yel:#2a2406;--pink:#ff9aa8;--pink-s:#5a2f38;--blue:#8fcdea;--grn:#9fe0a8;--grn-s:#235a38;--red-s:#6a2f2f;--red:#ff8f8f;--r:16px}
:root[data-theme="light"]{--bg:#f6f1e3;--bg2:#ece5d1;--surface:#fffdf6;--surface2:#f1ebd8;--ink:#23332b;--muted:#5d6e64;--line:#cfc7ad;
--yel:#d99a00;--on-yel:#ffffff;--pink:#c0394f;--pink-s:#fbe3e6;--blue:#1c6b94;--grn:#1d7a3a;--grn-s:#dcf1df;--red-s:#fbe0e0;--red:#b3261e;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-b);
background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px;
padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
button,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 0 10px}
.brand{background:none;border:0;padding:4px 0;font:400 28px/1 var(--f-d);color:var(--yel);display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.brand small{font:700 12px var(--f-b);color:var(--muted);letter-spacing:.08em}
.chips{display:flex;gap:8px}.chip{background:var(--surface);border:2px dashed var(--line);border-radius:999px;padding:3px 11px;font:700 15px var(--f-b);white-space:nowrap}
.backbtn{display:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
body.sub .backbtn{display:inline-flex}body.sub .brand{display:none}
h1{font:400 clamp(32px,8vw,44px)/1.05 var(--f-d);margin:6px 0 4px;color:var(--yel)}
h2{font:400 26px/1.15 var(--f-d);margin:26px 0 10px;color:var(--yel)}h3{font:400 21px var(--f-d);margin:14px 0 6px}
.sub-t,.muted{color:var(--muted)}p{margin:0 0 10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.ch{border-style:dashed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 20px;font:800 17px var(--f-b);background:var(--yel);color:var(--on-yel);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sec{background:var(--surface2);color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:15px;border-radius:11px}.btn.block{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
.pill.on{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:2px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:130px;border:0;background:none;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;font:800 12px var(--f-b);color:var(--muted)}
.tab span{font-size:21px;line-height:1.2}.tab.on{background:var(--surface);color:var(--yel)}
body.in-session .tabs,body.sub .tabs{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tile:active{transform:translateY(3px);box-shadow:none}.tile .ic{font-size:28px}.tile .t{font:400 22px var(--f-d)}.tile .s{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .4s}
.ring{width:80px;height:80px;flex:none}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .bg{stroke:var(--bg2)}.ring .fg{stroke:var(--yel);transition:stroke-dashoffset .6s}.ring text{font:400 22px var(--f-d);fill:var(--ink)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.lrow .n{font:400 24px var(--f-d);color:var(--yel);min-width:34px}.lrow .ic{font-size:26px}.lrow b{font:400 22px var(--f-d);display:block}.lrow small{color:var(--muted)}
.lrow.done{border-color:var(--grn)}.lrow .ck{color:var(--grn);font-weight:900}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:var(--surface2);border:2px solid var(--yel);border-radius:12px;padding:6px 10px;font-size:14px}.badge.off{border-color:var(--line);opacity:.5;filter:grayscale(1)}
.mini{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}.mini th,.mini td{border:1px solid var(--line);padding:6px 9px;text-align:left}.mini th{background:var(--surface2);color:var(--yel);font-weight:800}
.tw{overflow-x:auto;margin:8px 0}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.ex:last-child{border:0}.ex b{font:400 21px var(--f-d)}
.spk{border:2px solid var(--line);background:var(--surface2);border-radius:50%;width:38px;height:38px;flex:none;font-size:17px;line-height:1;padding:0}
.blur{filter:blur(6px);cursor:pointer;transition:filter .2s}.blur.on{filter:none}
.tip{background:var(--bg2);border-left:5px solid var(--yel);border-radius:8px;padding:10px 12px;margin:10px 0}
.goal{display:flex;align-items:center;gap:14px}
.qtop{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 0 14px}
.x{border:2px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;font-size:17px;padding:0}
.prog{flex:1;height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grn);transition:width .3s}
.combo{font:400 20px var(--f-d);color:var(--yel);min-width:50px;text-align:right}
.qkind{font:800 12px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.prompt{font:400 clamp(26px,7vw,34px)/1.15 var(--f-d);margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 15px;font:700 18px/1.3 var(--f-b);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.opt:active{transform:translateY(2px)}.opt.good{border-color:var(--grn);background:var(--grn-s)}.opt.bad{border-color:var(--red);background:var(--red-s)}
.typebox{width:100%;font:400 26px var(--f-d);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.typebox.good{border-color:var(--grn);background:var(--grn-s)}.typebox.bad{border-color:var(--red);background:var(--red-s)}
.fld{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:600 17px var(--f-b)}
textarea.fld{font-size:13px;min-height:90px;word-break:break-all}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:3px solid;max-height:62vh;overflow:auto;animation:up .2s}
.sheet.good{background:var(--grn-s);border-color:var(--grn)}.sheet.bad{background:var(--red-s);border-color:var(--red)}
.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}.sheet h3{margin:0;font-size:26px}
.sheet.good h3{color:var(--grn)}.sheet.bad h3{color:var(--red)}.sheet p{margin:0}.sheet small{color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.spacer{height:200px}

const mt=(h,r)=>'<table class="mini"><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>';
const c=(p,a,w,e,h)=>({k:'choice',p,ans:a,opts:w,e:e||'',h:h||''});
const t=(p,a,e,h)=>({k:'type',p,ans:a,e:e||'',h:h||''});
const b=(es,tok,extra,tip)=>({k:'build',es,tok:tok.split(' '),extra:extra?extra.split(' '):[],tip:tip||''});
const ls=(p,a,w,e)=>({k:'listen',p:p,ans:a,opts:w,e:e||''});
const ESR=[[/\bparticipis\b/g,'participios'],[/\bparticipi\b/g,'participio'],[/\binfinitiu\b/g,'infinitivo'],[/\bgerundi\b/g,'gerundio'],[/\bindicatiu\b/g,'indicativo'],[/\blliçons\b/g,'lecciones'],[/\blliçó\b/g,'lección'],[/\bveurás\b/g,'verás']];
function esx(s){if(!s)return s;return String(s).split(/(<b>.*?<\/b>)/).map((p,i)=>i%2?p:ESR.reduce((a,r)=>a.replace(r[0],r[1]),p)).join('')}
function L(n,lv,ca,es,ic,min,goals,steps,kw,qs,th){
  qs.forEach(q=>{if(q.e)q.e=esx(q.e);if(q.h)q.h=esx(q.h);if(q.tip)q.tip=esx(q.tip)});
  LESSONS.push({id:lv+n,n,lv,ca,es,ic,min,goals:goals.map(esx),steps:steps.map(s=>({t:s[0],h:esx(s[1]),tb:s[2]||'',ex:s[3]||[],tip:esx(s[4]||'')})),kw,qs,th:th?[].concat(th):[]});
}

L(1,'a1','Sons i alfabet','Sonidos y alfabeto','🔤',15,
['Reconocer las letras del alfabeto catalán y su nombre','Pronunciar vocales y las combinaciones ll, ny, ig, tx, x, ç, l·l','Saber cuándo una palabra lleva acento (à, è, é, í, ò, ó, ú)','Deletrear tu nombre en catalán'],
[
['El alfabet','<p>El catalán usa las mismas 26 letras que el castellano. Las pronuncias casi siempre igual dentro de una palabra, pero sus <b>nombres</b> son distintos. Escucha cada una con 🔊 y repite en voz alta.</p><p>La <b>h</b> no se pronuncia nunca (<b>hora</b> suena «ora»), y la <b>v</b> y la <b>b</b> suenan igual en el catalán central.</p>',mt(['Letra','Nombre','Ejemplo'],SA([['A a','a','casa'],['B b','be','barca'],['C c','ce','cosa'],['D d','de','dia'],['E e','e','el'],['F f','efa','festa'],['G g','ge','gat'],['H h','hac','hora'],['I i','i','illa'],['J j','jota','jove'],['K k','ca','quilo'],['L l','ela','lluna'],['M m','ema','mare'],['N n','ena','nit'],['O o','o','ou'],['P p','pe','pare'],['Q q','cu','què'],['R r','erra','riu'],['S s','essa','sol'],['T t','te','taula'],['U u','u','una'],['V v','ve','vi'],['W w','ve doble','web'],['X x','ics','xocolata'],['Y y','i grega','iogurt'],['Z z','zeta','zero']])),[['Com s\'escriu «Maria»? Eme, a, erra, i, a.','¿Cómo se escribe «Maria»? Ema, a, erra, i, a.'],['Pot lletrejar el seu cognom?','¿Puede deletrear su apellido?']],'Para deletrear se dicen los <b>nombres</b> de las letras: «ema-a-erra-i-a». Es la frase típica por teléfono o en una oficina.'],
['Les vocals','<p>Hay cinco letras vocales (a, e, i, o, u) pero <b>siete</b> sonidos principales, porque la <b>e</b> y la <b>o</b> pueden ser abiertas o cerradas. Eso se ve en el acento de la sílaba tónica: <b>è / ò</b> (abiertas, acento grave) y <b>é / ó</b> (cerradas, acento agudo).</p><p>En el catalán central, en sílaba <b>átona</b> (sin fuerza) la <b>a</b> y la <b>e</b> suenan como una vocal neutra, y la <b>o</b> suena como <b>u</b>. Por eso «cotxe» se oye casi «cútxe». No te preocupes: se aprende escuchando.</p>',mt(['Sonido','Ejemplos'],[['a',SW('mare, cafè')],['e (cerrada)',SW('néixer, també')],['è (abierta)','cafè, mèdic'],['i',SW('vi, dia')],['o (cerrada)','cançó, joc'],['ò (abierta)',SW('pòsit, òpera')],['u','un, dur']]),[['el cafè','el café'],['la cançó','la canción'],['el telèfon','el teléfono']],'Las vocales <b>i</b> y <b>u</b> pueden formar diptongos con otra vocal: <b>cuina</b>, <b>pau</b>, <b>veu</b>. Se pronuncian en una sola sílaba.'],
['Consonants amb personalitat','<p>Estas combinaciones no existen en castellano o suenan distinto. Aprende las más importantes:</p>',mt(['Escritura','Suena como…','Ejemplos'],[['<b>ll</b>','como la «ll» de «lluvia» en zonas yeístas, o «li»',SW('llibre, lluna, ull')],['<b>l·l</b>','una «l» larga (dos «l» separadas por el punt volat)',SW('col·legi, il·lusió')],['<b>ny</b>','como la «ñ»',SW('any, senyor, montanya')],['<b>ig</b> (final)','como «tx» suave',SW('maig, mig, safareig')],['<b>tx</b>','como la «ch» de «chico»',SW('cotxe, txec, esquitx')],['<b>x</b>','como «sh» (inglés «she»)',SW('xocolata, caixa, peix')],['<b>ç</b>','como una «s» sorda (solo ante a, o, u o al final)',SW('plaça, cançó, braç')],['<b>g</b> + e/i','como la «j» francesa',SW('gener, gira, imatge')],['<b>j</b>','la misma «j» francesa',SW('jove, viatjar')],['<b>qu / gu</b> + e/i','como «k» y «g» dura; la «u» no suena',SW('què, guitarra')],['<b>h</b>','muda',SW('hora, home')]]),[['l\'any','el año'],['el cotxe','el coche'],['la plaça','la plaza'],['la caixa','la caja'],['el col·legi','el colegio']],'Cuidado: la <b>b</b> y la <b>v</b> suenan igual en el catalán central, así que hay que <b>memorizar</b> cómo se escribe cada palabra (<b>vi</b>, <b>bé</b>).'],
['Dónde va el acento','<p>La sílaba más fuerte de la palabra se llama <b>tònica</b>. Regla práctica:</p><ul class="goals"><li>Si la palabra termina en <b>vocal, -s, -en o -in</b>, la fuerza va en la <b>penúltima</b> sílaba y <b>no se escribe acento</b>: <b>casa, taules, jove, canten</b>.</li><li>Si termina en <b>otra consonante</b>, la fuerza va en la <b>última</b> sílaba: <b>animal, parlar, mirall</b>.</li><li>Si la palabra <b>rompe</b> la regla, se escribe el acento: <b>cafè, també, telèfon, música, cançó, lliçó</b>.</li></ul><p>Hay dos tipos de acento: <b>grave</b> (à è ò) y <b>agudo</b> (é í ó ú). Los que llevan el grave son solo <b>à, è, ò</b>; el agudo es para <b>é, í, ó, ú</b>.</p>',mt(['Sin acento (cumple la regla)','Con acento (la rompe)'],[['casa, taula, parlar','cafè, també, cançó'],['animal, mirall','telèfon, música, lliçó'],['oficina, jove, joves','plàstic, país, música']]),[['la cançó','la canción'],['el telèfon','el teléfono'],['també','también']],'En los diptongos con <b>ï / ü</b> se usa la <b>dièresi</b>: <b>país</b> tiene i tónica (pa-ís), <b>veïna</b>, <b>cuinar</b>; y para separar <b>gu / qu</b> se usa <b>ü</b>: <b>aigües</b>, <b>pingüí</b>.'],
['Practica el teu nom','<p>En catalán se dice <b>Com et dius?</b> y se contesta <b>Em dic…</b>. Para deletrear: «Com s\'escriu?». Practica con tu nombre y apellido: dilo con los <b>nombres</b> de las letras.</p>','',[['Com et dius? — Em dic Marc.','¿Cómo te llamas? — Me llamo Marc.'],['Com s\'escriu? — Eme, a, erra, ce.','¿Cómo se escribe? — Ema, a, erra, ce.'],['El meu cognom és Puig. Pe, u, i, ge.','Mi apellido es Puig.']],'Para decir que una letra lleva acento: «e amb accent greu» (è) o «e amb accent agut» (é).']
],
[['l\'alfabet','el alfabeto'],['la lletra','la letra'],['la vocal','la vocal'],['la consonant','la consonante'],['l\'accent','el acento'],['lletrejar','deletrear'],['la sílaba','la sílaba'],['la dièresi','la diéresis'],['el cafè','el café'],['la cançó','la canción']],

c('¿Qué dígrafo representa una «l» larga?','l·l',['ll','ly','lh'],'Col·legi lleva «l·l» (punt volat); no confundir con «ll» de «llibre».'),

L(2,'a1','Qui sóc?','¿Quién soy?','🙋',20,
['Saludar y despedirse en distintos momentos del día','Presentarte: nombre, origen, edad, profesión','Usar ser y tenir en presente','Contar del 0 al 100 y dar el teléfono'],
[
['Saludar i acomiadar-se','<p>El saludo depende de la hora y de la confianza. En el trato formal se usan <b>bon dia</b>, <b>bona tarda</b>, <b>bona nit</b>. Entre amigos, <b>hola</b> vale para todo.</p>',mt(['Quan?','Català','Español'],[['mañana','Bon dia','Buenos días'],['tarde','Bona tarda','Buenas tardes'],['noche','Bona nit','Buenas noches'],['amigos','Hola, què tal?','Hola, ¿qué tal?'],['despedida','Adéu / A reveure','Adiós'],['hasta luego','Fins ara / Fins després','Hasta luego'],['hasta pronto','Fins aviat','Hasta pronto'],['mañana','Fins demà','Hasta mañana']]),[['Bon dia! Com va?','¡Buenos días! ¿Cómo va?'],['Molt bé, gràcies. I tu?','Muy bien, gracias. ¿Y tú?'],['Fins demà!','¡Hasta mañana!']],'«Bona nit» se usa tanto para saludar de noche como para despedirse al irse a dormir.'],
['El verb ser','<p><b>Ser</b> sirve para decir quién eres, de dónde eres, cómo eres. Es muy irregular; apréndelo como bloque.</p>',mt(['','ser','Ejemplo'],[['jo','sóc','Sóc l\'Anna.'],['tu','ets','Ets de Girona?'],['ell / ella / vostè','és','Ella és metgessa.'],['nosaltres','som','Som amics.'],['vosaltres','sou','Sou de Lleida?'],['ells / elles / vostès','són','Són estudiants.']]),[['Sóc d\'Argentina.','Soy de Argentina.'],['Ets alt i simpàtic.','Eres alto y simpático.'],['Som del Brasil.','Somos de Brasil.']],'El pronombre sujeto (<b>jo, tu…</b>) se puede <b>omitir</b>: «Sóc Marc» sin «jo». Se usa solo para enfatizar: «<i>Jo</i> sóc Marc».'],
['Em dic… i tinc…','<p>Para el nombre se usa el verbo <b>dir-se</b> (con pronombre: <b>em, et, es, ens, us, es</b>). Para la edad y otras cosas se usa <b>tenir</b>.</p>',mt(['Persona','dir-se','tenir'],[['jo','em dic','tinc'],['tu','et dius','tens'],['ell / ella','es diu','té'],['nosaltres','ens diem','tenim'],['vosaltres','us dieu','teniu'],['ells / elles','es diuen','tenen']]),[['Em dic Pol i tinc vint-i-cinc anys.','Me llamo Pol y tengo veinticinco años.'],['Quants anys tens?','¿Cuántos años tienes?'],['No tinc germans.','No tengo hermanos.']],'Edad: <b>tinc 30 anys</b> (con tenir, no con ser). Origen: <b>sóc de + lugar</b>. Profesión: <b>sóc + profesión</b> sin artículo: <b>sóc infermera</b>.'],
['Nombres del 0 al 100','<p>Del 0 al 20 son palabras propias. A partir de 21 hasta 29 se unen con <b>-i-</b> y guiones: <b>vint-i-u</b>. Desde el 31 es <b>trenta-un</b> (sin «i»).</p>',mt(['0–10','11–20','Decenas'],[['zero, un, dos, tres, quatre, cinc, sis, set, vuit, nou, deu','onze, dotze, tretze, catorze, quinze, setze, disset, divuit, dinou, vint','trenta, quaranta, cinquanta, seixanta, setanta, vuitanta, noranta, cent']]),[['vint-i-un, vint-i-dos, vint-i-tres','21, 22, 23'],['trenta-un, trenta-dos','31, 32'],['quaranta-cinc','45'],['noranta-nou','99']],'Los teléfonos se dicen en grupos: <b>612 34 56 78</b> → «sis-cents dotze, trenta-quatre, cinquanta-sis, setanta-vuit». Si no entiendes, pide: «Pot repetir?»'],
['Presentar-se','<p>Con todo lo anterior ya puedes presentarte. Aquí tienes un modelo y las frases de ayuda más útiles cuando no entiendes.</p>','',[['Hola, em dic Laura, sóc de Mèxic i tinc trenta anys. Sóc dissenyadora.','Hola, me llamo Laura, soy de México y tengo treinta años. Soy diseñadora.'],['Molt de gust! — Igualment.','Mucho gusto. — Igualmente.'],['Perdoni, pot repetir, si us plau?','Perdone, ¿puede repetir, por favor?'],['Més a poc a poc, si us plau.','Más despacio, por favor.'],['No ho entenc.','No lo entiendo.'],['Què vol dir «castanyada»?','¿Qué significa «castanyada»?']],'Con personas que no conoces, usa <b>vostè</b> y <b>perdoni</b>. Entre jóvenes y amigos, <b>tu</b> y <b>perdona</b>.']
],
[['jo','yo'],['tu','tú'],['ell / ella','él / ella'],['nosaltres','nosotros'],['vosaltres','vosotros'],['em dic','me llamo'],['tinc … anys','tengo … años'],['sóc de…','soy de…'],['molt de gust','mucho gusto'],['pot repetir?','¿puede repetir?']],

L(3,'a1','Article, gènere i nombre','Artículo, género y número','📘',22,
['Usar el, la, l\', un, una correctamente','Formar el plural de nombres y adjetivos','Concordar género y número en adjetivos y colores','Usar el artículo personal en / na'],
[
['Els articles','<p>Todos los nombres catalanes son <b>masculinos</b> o <b>femeninos</b>. El artículo definido tiene cuatro formas en singular y plural:</p>',mt(['','Masc. sing.','Fem. sing.','Masc. pl.','Fem. pl.'],[['definido','el','la','els','les'],['ante vocal o h','<b>l\'</b>','<b>l\'</b>','els','les'],['indefinido','un','una','uns','unes']]),[['el pare / els pares','el padre / los padres'],['la mare / les mares','la madre / las madres'],['l\'hora / les hores','la hora / las horas'],['l\'amic / els amics','el amigo / los amigos'],['un llibre / uns llibres','un libro / unos libros'],['una taula / unes taules','una mesa / unas mesas']],'<b>El mejor truco</b>: aprende cada nombre <b>con su artículo</b>. Hay palabras que cambian de género respecto al castellano: <b>el mar</b> (la mar también), <b>la sang</b> (la sangre), <b>el problema</b>, <b>la pell</b> (la piel), <b>el nas</b>.'],
['Plural de los nombres','<p>Para formar el plural, casi siempre se añade <b>-s</b>. Hay unos cuantos patrones que debes conocer:</p>',mt(['Singular termina en…','Plural','Ejemplo'],[['vocal (-e, -i, -o, -u)','+ <b>s</b>','pare → pares, avi → avis, cotxe → cotxes'],['-a (femenino)','-<b>es</b>','casa → cases, taula → taules'],['consonante','+ <b>s</b>','professor → professors, animal → animals'],['-s, -x, -sc, -st, -xt (m.)','+ <b>os</b>','autobús → autobusos, peix → peixos, bosc → boscos, text → textos'],['-ç','-<b>ços</b>','braç → braços'],['-ig','-<b>igs</b>','maig → maigs, safareig → safareigs'],['vocal tónica (à, í, ó…)','+ <b>ns</b>','germà → germans, camí → camins, cançó → cançons']]),[['el germà → els germans','el hermano → los hermanos'],['el camí → els camins','el camino → los caminos'],['l\'avi → els avis','el abuelo → los abuelos'],['el braç → els braços','el brazo → los brazos'],['l\'autobús → els autobusos','el autobús → los autobuses']],'No te quedes con una tabla enorme: aprende primero el patrón general <b>+ s</b> (<b>-a → -es</b>) y las excepciones las irás viendo con los ejemplos.'],
['Adjectius','<p>Los adjetivos <b>concuerdan</b> en género y número con el nombre. Muchos tienen cuatro formas; otros solo dos.</p>',mt(['Tipo','Masc. sing.','Fem. sing.','Masc. pl.','Fem. pl.'],[['4 formas','alt','alta','alts','altes'],['4 formas','bo','bona','bons','bones'],['4 formas','content','contenta','contents','contentes'],['2 formas','jove','jove','joves','joves'],['2 formas','intel·ligent','intel·ligent','intel·ligents','intel·ligents'],['2 formas','verd → <b>verda</b>','verda','verds','verdes']]),[['un noi alt i una noia alta','un chico alto y una chica alta'],['uns amics contents','unos amigos contentos'],['unes cases boniques','unas casas bonitas'],['El gat és negre i la gata és blanca.','El gato es negro y la gata es blanca.']],'El adjetivo va normalmente <b>después</b> del nombre: <b>un cotxe vermell</b>. Algunos colores no cambian: <b>rosa, taronja, lila</b> (<b>unes faldilles rosa</b>).'],
['Colors','<p>Los colores son adjetivos: concuerdan con el nombre.</p>',mt(['Color','Masc.','Fem.','Plural'],[['rojo','vermell','vermella','vermells/vermelles'],['azul','blau','blava','blaus/blaves'],['amarillo','groc','groga','grocs/grogues'],['verde','verd','verda','verds/verdes'],['blanco','blanc','blanca','blancs/blanques'],['negro','negre','negra','negres'],['gris','gris','grisa','grisos/grises']]),[['la casa blanca','la casa blanca'],['els ulls blaus','los ojos azules'],['els cabells negres','el pelo negro']],'Pregunta: <b>De quin color és?</b> / <b>De quin color són?</b>'],
['En i na: el artículo personal','<p>En catalán estándar (y en lengua oral), delante de un nombre de pila se usa a menudo un artículo personal: <b>en</b> para hombres y <b>na</b> para mujeres. Delante de vocal se apostrofa: <b>l\'</b>.</p>',mt(['Nom','Article personal','Ejemplo'],[['Pere','en Pere','En Pere viu a Vic.'],['Marta','la Marta','La Marta és de Tarragona.'],['Jordi (vocal)','en Jordi / l\'Anna','L\'Anna treballa.']]),[['En Pere i la Marta són germans.','Pere y Marta son hermanos.'],['L\'Anna és metgessa.','Anna es médica.'],['Parlo amb en Joan.','Hablo con Joan.']],'Hoy lo habitual es <b>en</b> (hombres) y <b>la</b> (mujeres): <b>en Pere, la Marta, l\'Anna</b>. No se usa en el trato formal ni con apellido: <b>el senyor Garcia</b>.']
],

L(4,'a1','La família','La familia','👨‍👩‍👧',22,
['Hablar de los miembros de tu familia','Usar los posesivos (el meu, la teva, el seu…)','Responder a «Amb qui vius?» y «Tens germans?»','Describir la familia con ser, tenir y estar casat'],
[
['Els membres de la família','<p>Estas son las palabras básicas. Fíjate en que algunas tienen forma distinta para masculino y femenino, y que hay palabras en plural para decir «los padres», «los hermanos».</p>',mt(['Masc.','Fem.','Plural'],[['el pare','la mare','els pares (padres)'],['el germà','la germana','els germans (hermanos o hermanos y hermanas)'],['el fill','la filla','els fills'],['l\'avi','l\'àvia','els avis'],['l\'oncle','la tia','els oncles'],['el cosí','la cosina','els cosins'],['el nebot','la neboda','els nebots'],['el marit','la dona (esposa)','els marits'],['el net','la néta','els néts']]),[['Tinc dos germans i una germana.','Tengo dos hermanos y una hermana.'],['Els meus avis viuen a Reus.','Mis abuelos viven en Reus.']],'«Els pares» = padre y madre; «els germans» = hermanos (puede incluir hermanas); «els avis» = abuelo y abuela.'],
['Possessius','<p>El posesivo va <b>con artículo</b> en catalán: <b>el meu germà</b>, <b>la meva mare</b>. Concuerda con la <b>cosa poseída</b>, no con el poseedor.</p>',mt(['Poseedor','Masc. sing.','Fem. sing.','Masc. pl.','Fem. pl.'],[['mío','el meu','la meva','els meus','les meves'],['tuyo','el teu','la teva','els teus','les teves'],['suyo','el seu','la seva','els seus','les seves'],['nuestro','el nostre','la nostra','els nostres','les nostres'],['vuestro','el vostre','la vostra','els vostres','les vostres'],['suyo (de ellos)','el seu','la seva','els seus','les seves']]),[['El meu pare és mestre.','Mi padre es maestro.'],['La teva germana té vint anys?','¿Tu hermana tiene veinte años?'],['Els nostres amics són de Girona.','Nuestros amigos son de Girona.'],['La seva casa és gran.','Su casa es grande.']],'Con <b>vostè</b> (formal) se usa <b>el seu</b>: «La seva filla és molt simpàtica».'],
['Viure, estar casat, tenir','<p>Para hablar de la situación familiar:</p><ul class="goals"><li><b>Estic casat / casada</b> (estar casat)</li><li><b>Sóc solter / soltera</b></li><li><b>Visc amb la meva parella</b></li><li><b>No tinc fills</b></li></ul>',mt(['Persona','viure','Ejemplo'],[['jo','visc','Visc amb els meus pares.'],['tu','vius','Amb qui vius?'],['ell / ella','viu','Ella viu sola.'],['nosaltres','vivim','Vivim a Sants.'],['vosaltres','viviu','On viviu?'],['ells / elles','viuen','Viuen a Mallorca.']]),[['Amb qui vius? — Visc amb la meva germana.','¿Con quién vives? — Vivo con mi hermana.'],['Estàs casat? — No, sóc solter.','¿Estás casado? — No, soy soltero.']],'<b>Viure</b> es irregular en presente (visc, vius, viu, vivim, viviu, viuen).'],
['Descriure la família','<p>Para describir personas usa <b>ser</b> + adjetivo y <b>tenir</b> + parte del cuerpo. Fíjate en cómo concuerda el adjetivo con el sustantivo al que se refiere.</p>','',[['La meva mare és alta i té els cabells negres.','Mi madre es alta y tiene el pelo negro.'],['El meu germà petit és molt simpàtic.','Mi hermano pequeño es muy simpático.'],['Els meus avis són grans però molt àgils.','Mis abuelos son mayores pero muy ágiles.'],['La meva cosina té tres fills.','Mi prima tiene tres hijos.'],['La meva família és petita: som quatre.','Mi familia es pequeña: somos cuatro.']],'Para la edad de otra persona: <b>Quants anys té la teva mare?</b> — <b>Té cinquanta-cinc anys.</b>']
],
[['la família','la familia'],['el meu / la meva','mi'],['el teu / la teva','tu'],['el seu / la seva','su'],['el nostre / la nostra','nuestro'],['el germà petit','el hermano pequeño'],['gran','mayor'],['viure','vivir'],['solter / soltera','soltero / soltera'],['casat / casada','casado / casada']],
[
c('«___ germana té 20 anys.» (mi)','La meva',['El meu','Les meves','Els meus'],'Germana es femenino singular: la meva.'),
c('«___ pares viuen a Vic.» (mis)','Els meus',['Les meves','El meu','Els seus'],'Pares es masculino plural: els meus.'),
c('«___ amics són de Lleida.» (nuestros)','Els nostres',['El nostre','La nostra','Les nostres'],'Amics → masculino plural: els nostres.'),
c('¿Quién es «la tia»?','la hermana de mi madre',['la madre de mi padre','mi prima','mi hermana'],'La tia = la tía.'),
c('«Amb qui ___?» (tú)','vius',['visc','viu','vivim'],'Tu vius.'),
c('«Jo ___ amb la meva parella.»','visc',['vius','viu','viuen'],'Jo visc.'),
c('«Estic ___» (hombre, no tiene pareja)','solter',['soltera','casat','solteres'],'Solter es masculino singular.'),
c('«Els meus avis ___ a Reus.»','viuen',['viu','vivim','vius'],'Tercera persona del plural: viuen.'),
t('Mi madre = la meva ___','mare','La meva mare.'),
t('Tus hermanos = els teus ___','germans','Els teus germans.'),
t('Su padre (de ella) = el ___ pare','seu','El seu pare.'),
b('Tengo dos hermanos','tinc dos germans','','Tinc = tengo.'),
b('Mi hermana vive en Madrid','la meva germana viu a Madrid','','Concordancia: la meva germana.')
],'familia');
L(5,'a1','On visc?','¿Dónde vivo?','🏠',22,
['Describir tu casa y su distribución','Usar ser, estar, haver-hi y ser-hi con claridad','Colocar cosas con preposiciones de lugar','Preguntar y responder dónde vives'],
[
['La casa','<p>Palabras básicas para hablar de la casa y las habitaciones. Todas llevan su artículo para que memorices el género.</p>',mt(['Català','Español'],[['la casa / el pis','casa / piso'],['la cuina','cocina'],['el menjador','comedor'],['l\'habitació / el dormitori','habitación / dormitorio'],['el bany','baño'],['el rebedor','recibidor'],['el balcó / la terrassa','balcón / terraza'],['l\'ascensor','ascensor'],['la planta baixa','planta baja'],['el primer pis','primer piso']]),[['Visc en un pis petit a Sabadell.','Vivo en un piso pequeño en Sabadell.'],['El meu pis té tres habitacions.','Mi piso tiene tres habitaciones.']],'Dirección: <b>Visc al carrer Major, número 5, 2n 1a</b> (segon primera). Los ordinales de las plantas: 1r, 2n, 3r, 4t, 5è.'],
['Ser, estar i haver-hi','<p>Los tres verbos para localizar. Distínguelos:</p>',mt(['Verbo','Para qué','Ejemplo'],[['<b>ser</b>','identificar, describir','La cuina és gran.'],['<b>estar</b>','localizar algo conocido / estado','La cuina està al fons. / Estic bé.'],['<b>haver-hi</b>','existencia, algo no determinado','Hi ha un sofà al menjador.']]),[['Hi ha dues habitacions i un bany.','Hay dos habitaciones y un baño.'],['La nevera és a la cuina.','La nevera está en la cocina.'],['El meu pis és al segon pis.','Mi piso está en el segundo piso.']],'En catalán «és/són» también localiza: <b>La clau és a la taula</b> (la llave está en la mesa). <b>Hi ha</b> = existe (no determinado); <b>és</b> = está (determinado: la nevera, el meu pis, l\'ajuntament). <b>Estar</b> se usa sobre todo para estados: <b>estic cansat</b>.'],
['Haver-hi en presente','<p><b>Hi ha</b> sirve para singular y plural. No cambia.</p>','',[['Hi ha una taula i quatre cadires.','Hay una mesa y cuatro sillas.'],['No hi ha cap lavabo al pis.','No hay ningún lavabo en el piso.'],['Hi ha molta gent?','¿Hay mucha gente?'],['Què hi ha al menjador?','¿Qué hay en el comedor?']],'Pregunta típica: <b>Què hi ha al teu barri?</b> — <b>Hi ha un parc i una escola.</b>'],
['Preposicions de lloc','<p>Para decir dónde está algo:</p>',mt(['Català','Español'],[['a','en, a'],['en','en'],['sobre / damunt','sobre, encima'],['sota','debajo'],['davant (de)','delante (de)'],['darrere (de)','detrás (de)'],['al costat de','al lado de'],['entre','entre'],['dins (de)','dentro (de)'],['fora (de)','fuera (de)'],['a prop (de)','cerca (de)'],['lluny (de)','lejos (de)']]),[['El gat és sota la taula.','El gato está debajo de la mesa.'],['La clau és a la bossa.','La llave está en el bolso.'],['El sofà és davant de la televisió.','El sofá está delante de la televisión.']],'Con <b>a</b> + artículo se contrae: <b>a + el = al</b>, <b>a + els = als</b>; <b>de + el = del</b>, <b>de + els = dels</b>. Con la/les no se contrae: <b>a la cuina, de les cadires</b>.'],
['On visc?','<p>Para hablar de tu casa, junta todo lo anterior. Fíjate en el orden típico de una descripción.</p>','',[['On vius? — Visc a Terrassa, en un pis.','¿Dónde vives? — Vivo en Terrassa, en un piso.'],['El meu pis té una cuina, un menjador i dues habitacions.','Mi piso tiene una cocina, un comedor y dos habitaciones.'],['És petit però lluminós.','Es pequeño pero luminoso.'],['Hi ha un balcó amb vistes al parc.','Hay un balcón con vistas al parque.'],['Visc sol / sola. / Visc amb la família.','Vivo solo/a. / Vivo con la familia.']],'<b>Viure a</b> + ciudad, <b>viure en</b> + tipo de casa (<b>en un pis</b>), <b>viure al</b> + barrio (<b>al barri de Gràcia</b>).']
],
[['el pis','el piso'],['la casa','la casa'],['la cuina','la cocina'],['el menjador','el comedor'],['el bany','el baño'],['hi ha','hay'],['sobre','sobre'],['sota','debajo'],['davant','delante'],['darrere','detrás']],
[
c('«___ una taula al menjador.»','Hi ha',['Està','Són','Té'],'Hi ha = hay (existencia).'),
c('«La nevera ___ a la cuina.»','és',['hi ha','han','té'],'La nevera es determinada: és a la cuina.'),
c('«El gat és ___ la taula.» (debajo de)','sota',['sobre','dins','entre'],'Sota = debajo.'),
c('«El llibre és ___ la taula.» (encima de)','damunt de',['sota','darrere','a prop'],'Damunt / sobre = encima.'),
c('«___ ascensor?» (¿Hay un ascensor?)','Hi ha un',['És un','Té un','Està un'],'Pregunta de existencia: Hi ha un ascensor?'),
c('A + el =','al',['del','a el','a l\''],'Contracción obligatoria: al.'),
c('De + el =','del',['de el','al','dels'],'Contracción obligatoria: del.'),
c('«Visc ___ pis petit.»','en un',['a un','al','de'],'Viure en un pis.'),
c('¿Qué dice «Hi ha cinc habitacions»?','hay cinco habitaciones',['las habitaciones son cinco','es una habitación','estoy en cinco habitaciones'],'Hi ha = hay.'),
t('«El mòbil és ___ la taula.» (sobre)','damunt','Damunt / sobre.'),
t('«Visc ___ carrer Major.» (a + el)','al','a + el = al.'),
b('En mi piso hay tres habitaciones','al meu pis hi ha tres habitacions','','Al meu pis (a + el) + hi ha.'),
b('El gato está debajo de la mesa','el gat és sota la taula','','Ser para localizar algo determinado.')
],'casa');
L(6,'a1','El carrer','La calle','🛣️',22,
['Usar demostrativos (aquest, aquell, això, allò)','Preguntar por lugares y servicios del barrio','Dar y entender direcciones postales','Usar los ordinales del 1.º al 10.º'],
[
['Aquest i aquell','<p>Los demostrativos señalan algo <b>cerca</b> (aquest) o <b>lejos</b> (aquell). Concuerdan en género y número.</p>',mt(['','Masc. sing.','Fem. sing.','Masc. pl.','Fem. pl.'],[['cerca','aquest','aquesta','aquests','aquestes'],['lejos','aquell','aquella','aquells','aquelles'],['sin nombre','això (cerca)','allò (lejos)','','']]),[['Aquest carrer és molt llarg.','Esta calle es muy larga.'],['Aquella botiga és nova.','Aquella tienda es nueva.'],['Què és això? — És un mapa.','¿Qué es esto? — Es un mapa.'],['Vull aquests dos.','Quiero estos dos.']],'<b>Això</b> y <b>allò</b> son neutros: no llevan nombre y no cambian. «Això és fàcil»: esto es fácil.'],
['Aquí, ahí, allà','<p>Los adverbios de lugar tienen tres grados:</p>',mt(['Distancia','Català','Español'],[['cerca de mí','aquí','aquí'],['cerca de ti','aquí / allà','ahí'],['lejos','allà','allí']]),[['Estic aquí.','Estoy aquí.'],['L\'estació és allà.','La estación está allí.'],['Vine aquí, si us plau.','Ven aquí, por favor.']],'En catalán central no hay una palabra distinta para «ahí»: se usa <b>aquí</b> o <b>allà</b>. Con otros verbos puede decirse <b>allí</b>.'],
['Ordinals','<p>Los ordinales se abrevian con la terminación: 1r, 2n, 3r, 4t, 5è, 6è, 7è, 8è, 9è, 10è. Concuerdan (<b>primera, segona, tercera, quarta…</b>).</p>',mt(['','Masc.','Fem.'],[['1.º','primer (1r)','primera (1a)'],['2.º','segon (2n)','segona (2a)'],['3.º','tercer (3r)','tercera (3a)'],['4.º','quart (4t)','quarta (4a)'],['5.º','cinquè (5è)','cinquena (5a)'],['6.º','sisè (6è)','sisena (6a)'],['7.º','setè (7è)','setena (7a)'],['8.º','vuitè (8è)','vuitena (8a)'],['9.º','novè (9è)','novena (9a)'],['10.º','desè (10è)','desena (10a)']]),[['Visc al tercer pis.','Vivo en el tercer piso.'],['És la segona porta a l\'esquerra.','Es la segunda puerta a la izquierda.'],['El desè carrer a la dreta.','La décima calle a la derecha.']],'Dirección completa: <b>Carrer de Provença, 245, 3r 2a</b>.'],
['Llocs del barri','<p>Estas son las palabras que más usarás en el día a día.</p>','',[['L\'ajuntament és a la plaça.','El ayuntamiento está en la plaza.'],['Hi ha una farmàcia a prop.','Hay una farmacia cerca.'],['L\'escola és davant del parc.','La escuela está delante del parque.'],['Busco el CAP, si us plau.','Busco el CAP, por favor.'],['El banc és tancat.','El banco está cerrado.'],['Hi ha una parada d\'autobús a la cantonada.','Hay una parada de autobús en la esquina.']],'<b>Perdoni, on és…?</b> / <b>Hi ha una farmàcia per aquí?</b> son las frases típicas para empezar.'],
['Adreces','<p>Cómo decir una dirección y pedirla:</p>','',[['On vius? — Al carrer de Balmes, 12, 2n 1a.','¿Dónde vives? — En la calle Balmes, 12, 2.º 1.ª.'],['Quina és la teva adreça?','¿Cuál es tu dirección?'],['El meu codi postal és 08001.','Mi código postal es 08001.'],['Em pots escriure l\'adreça?','¿Puedes escribirme la dirección?'],['Quin és el teu correu electrònic?','¿Cuál es tu correo electrónico?'],['Arrova, punt, guionet.','Arroba, punto, guion.']],'Cuando deletrees un correo, di <b>arrova</b> (@), <b>punt</b> (.), <b>guionet</b> (-), <b>guionet baix</b> (_).']
],
[['aquest / aquesta','este / esta'],['aquell / aquella','aquel / aquella'],['això','esto'],['allò','aquello'],['aquí','aquí'],['allà','allí'],['primer','primero'],['l\'adreça','la dirección'],['a prop','cerca'],['lluny','lejos']],
[
c('«___ llibre és meu.» (este)','Aquest',['Aquesta','Això','Aquell'],'Llibre = masc.; cerca → aquest.'),
c('«___ casa és gran.» (esta)','Aquesta',['Aquest','Això','Aquell'],'Casa = fem.'),
c('«___ és fàcil.» (esto)','Això',['Aquest','Aquesta','Aquell'],'Neutro: això.'),
c('«Aquells cotxes són ___» (lejos)','vells',['vella','vell','velles'],'Plural masculino: vells.'),
c('3.º en catalán masculino:','tercer',['tres','tercera','terç'],'Tercer.'),
c('10.º en catalán masculino:','desè',['deu','desena','dècim'],'El ordinal masculino de 10 es desè.'),
c('¿Cómo se dice «¿Cuál es tu dirección?»','Quina és la teva adreça?',['On és la teva adreça?','Què és la teva casa?','Quant és l\'adreça?'],'Quina és… para preguntar por datos.'),
c('«___ el banc?» (¿Dónde está el banco?)','On és',['Què és','Quan és','Com és'],'On és… para localizar.'),
c('Elige la correcta: «a + el»','al',['a el','a l\'','del'],'Contracción: al.'),
t('«Visc al ___ pis.» (2.º, masculino)','segon','Segon.'),
t('«La ___ porta a l\'esquerra.» (1.ª)','primera','Primera.'),
t('Cuando señalas algo lejano y neutro: ___','allò','Allò = aquello.'),

],'ciutat');

/* ===== A1 · lliçons 7–12 ===== */
L(7,'a1','Verbs en -ar','Verbos en -ar','🗣️',22,
['Conjugar verbos regulares en -ar en presente','Aplicar los cambios ortográficos (c→qu, g→gu, ç→c, j→g)','Hacer frases negativas y preguntas sencillas','Hablar de tus actividades diarias'],
[
['La conjugació regular','<p>Los verbos que terminan en <b>-ar</b> forman el presente quitando <b>-ar</b> y añadiendo estas terminaciones:</p>',mt(['Persona','parlar','Terminación'],[['jo','parlo','-o'],['tu','parles','-es'],['ell / ella / vostè','parla','-a'],['nosaltres','parlem','-em'],['vosaltres','parleu','-eu'],['ells / elles / vostès','parlen','-en']]),[['Parlo català cada dia.','Hablo catalán cada día.'],['Treballes a Barcelona?','¿Trabajas en Barcelona?'],['Ella estudia medicina.','Ella estudia medicina.'],['Escoltem música.','Escuchamos música.']],'Fíjate en que <b>1.ª persona singular</b> lleva <b>-o</b> y la <b>2.ª plural</b> lleva <b>-eu</b>. Hay verbos con otras terminaciones en 1.ª persona, pero en los verbos en -ar son siempre <b>-o</b>.'],
['Preguntes i negacions','<p>Para negar, pon <b>no</b> delante del verbo. Para preguntar, basta con cambiar la entonación (o añadir una palabra interrogativa).</p>','',[['No parlo francès.','No hablo francés.'],['Parles anglès? — Sí, una mica.','¿Hablas inglés? — Sí, un poco.'],['On treballes? — Treballo en una escola.','¿Dónde trabajas? — Trabajo en una escuela.'],['Què mires?','¿Qué miras?'],['Qui canta?','¿Quién canta?']],'En catalán el sujeto <b>no se pone</b> en las preguntas: <b>Parles català?</b>, no «Tu parles català?» (aunque es posible para enfatizar).'],
['Cambios de ortografía','<p>Cuando la terminación empieza por <b>e</b> (es, em, eu, en), algunos verbos cambian la última consonante de la raíz para conservar el sonido.</p>',mt(['Raíz acaba en…','Cambia a…','Ejemplo'],[['<b>c</b>','<b>qu</b>','buscar → busco, bus<b>qu</b>es, busca, bus<b>qu</b>em'],['<b>g</b>','<b>gu</b>','pagar → pago, pa<b>gu</b>es, paga, pa<b>gu</b>em'],['<b>ç</b>','<b>c</b>','començar → començo, <b>c</b>omences, comença'],['<b>j</b>','<b>g</b>','menjar → menjo, men<b>g</b>es, menja']]),[['Pago amb targeta.','Pago con tarjeta.'],['Busquem una farmàcia.','Buscamos una farmacia.'],['Comencem a les nou.','Empezamos a las nueve.'],['Mengeu a casa?','¿Coméis en casa?']],'Solo cambian las formas con <b>e</b>: <b>tu, nosaltres, vosaltres, ells</b>. La 1.ª y la 3.ª singular se quedan como estaban (<b>busco, busca</b>).'],
['Verbs útils','<p>Estos son los verbos regulares en -ar más frecuentes en el día a día:</p>',mt(['Verbo','Significa'],[['parlar','hablar'],['treballar','trabajar'],['estudiar','estudiar'],['cantar','cantar'],['ballar','bailar'],['mirar','mirar'],['escoltar','escuchar'],['cuinar','cocinar'],['comprar','comprar'],['demanar','pedir, preguntar'],['trucar','llamar por teléfono'],['esperar','esperar'],['ajudar','ayudar'],['passejar','pasear'],['viatjar','viajar']]),[['Truco a la meva mare cada dia.','Llamo a mi madre cada día.'],['Compro pa al forn.','Compro pan en la panadería.'],['Mirem una sèrie.','Vemos una serie.']],'<b>Mirar</b> se usa para «ver» una película o la tele: <b>mirar la televisió</b>. <b>Veure</b> se usa más para «ver» en general: <b>veig el mar</b>.']
],
[['parlar','hablar'],['treballar','trabajar'],['estudiar','estudiar'],['cantar','cantar'],['escoltar','escuchar'],['mirar','mirar'],['cuinar','cocinar'],['comprar','comprar'],['trucar','llamar'],['passejar','pasear']],
[
c('«Jo ___ català.» (parlar)','parlo',['parles','parla','parlem'],'1.ª sing. = -o.'),
c('«Tu ___ a l\'oficina.» (treballar)','treballes',['treballo','treballa','treballen'],'2.ª sing. = -es.'),
c('«Nosaltres ___ música.» (escoltar)','escoltem',['escolten','escolteu','escolto'],'1.ª plural = -em.'),
c('«Vosaltres ___ francès?» (parlar)','parleu',['parlem','parlen','parles'],'2.ª plural = -eu.'),
c('«Ells ___ a casa.» (cuinar)','cuinen',['cuina','cuinem','cuines'],'3.ª plural = -en.'),
c('«Busquem» viene de…','buscar',['busqar','buscir','busquer'],'c → qu ante e.'),
c('«Tu ___ amb targeta?» (pagar)','pagues',['pages','pagas','pagos'],'g → gu ante e.'),
c('«Comencem» viene de…','començar',['comencar','començir','comenzar'],'ç → c ante e.'),
t('«Jo ___ a la biblioteca.» (estudiar)','estudio','Jo estudio.'),
t('«Ella ___ la televisió.» (mirar)','mira','Ella mira.'),
t('«Vosaltres ___ el dinar.» (preparar)','prepareu','Vosaltres prepareu.'),
b('No hablo francés','no parlo francès','','Negación: no + verbo.'),
b('Trabajamos en una escuela','treballem en una escola','','Nosaltres treballem.')
],'verbs1');
L(8,'a1','Verbs en -re/-er i -ir','Verbos en -re/-er y -ir','🔁',25,
['Distinguir los tres grupos de verbos (-ar, -re/-er, -ir)','Conjugar verbos de la segunda conjugación (beure, viure, perdre, rebre)','Distinguir verbos -ir normales e incoativos (servir, llegir)','Usar los verbos más frecuentes de estas conjugaciones'],
[

['Dormir, sortir, obrir','<p>Los verbos «puros» en <b>-ir</b> se conjugan así (terminaciones: <b>-o, -s, —, -im, -iu, -en</b>):</p>',mt(['','dormir','sortir','obrir'],[['jo','dormo','surto','obro'],['tu','dorms','surts','obres'],['ell / ella','dorm','surt','obre'],['nosaltres','dormim','sortim','obrim'],['vosaltres','dormiu','sortiu','obriu'],['ells / elles','dormen','surten','obren']]),[['Dormo poc els diumenges.','Duermo poco los domingos.'],['Surts amb nosaltres?','¿Sales con nosotros?'],['Obrim a les nou.','Abrimos a las nueve.']],'<b>Sortir</b> cambia la <b>o</b> en <b>u</b> (surto, surts, surt, surten) en las formas con el acento en la raíz.'],
['Els incoatius (-eixo)','<p>La mayoría de los verbos en <b>-ir</b> son «incoativos»: en singular y 3.ª plural añaden <b>-eix-</b> entre la raíz y la terminación.</p>',mt(['','servir','llegir','preferir'],[['jo','serveixo','llegeixo','prefereixo'],['tu','serveixes','llegeixes','prefereixes'],['ell / ella','serveix','llegeix','prefereix'],['nosaltres','servim','llegim','preferim'],['vosaltres','serviu','llegiu','preferiu'],['ells / elles','serveixen','llegeixen','prefereixen']]),[['Llegeixo el diari al matí.','Leo el periódico por la mañana.'],['Prefereixo el te.','Prefiero el té.'],['Serveixen cafè.','Sirven café.']],'Cómo saberlo: <b>nosaltres</b> y <b>vosaltres</b> nunca llevan «eix» (<b>llegim, llegiu</b>). Otros incoativos: <b>decidir, partir, unir, complir, repetir</b>.']

['Anar a + infinitiu','<p><b>Anar a + infinitivo</b> significa que vas a hacer algo moviéndote (ir a). Para el futuro se usa más el <b>presente</b> o el <b>futuro</b>: <b>Demà vinc</b> o <b>vindré</b>.</p>','',[['Vaig a comprar pa.','Voy a comprar pan. (voy ahora o enseguida)'],['Anem a dinar?','¿Vamos a comer?'],['Vas a la biblioteca a estudiar?','¿Vas a la biblioteca a estudiar?'],['Demà vinc a casa teva.','Mañana voy a tu casa.']],'No uses «vaig a + infinitiu» como el «voy a + infinitivo» castellano para el futuro puro. En catalán se dice <b>Demà plou</b> o <b>Demà plourà</b>, no «Demà va a ploure».'],

['Mesures','<p>Para pedir cantidades se usa <b>de</b>: <b>un quilo de pomes</b>, <b>una ampolla d\'aigua</b>, <b>una dotzena d\'ous</b>.</p>',mt(['Català','Español'],[['un quilo de','un kilo de'],['mig quilo de','medio kilo de'],['un litre de','un litro de'],['un paquet de','un paquete de'],['una dotzena d\'ous','una docena de huevos'],['una mica de','un poco de'],['una llauna de','una lata de'],['una ampolla de','una botella de']]),[['Vull mig quilo de tomàquets.','Quiero medio kilo de tomates.'],['Una ampolla d\'oli, si us plau.','Una botella de aceite, por favor.'],['Una mica de sal.','Un poco de sal.']],'<b>De</b> + vocal = <b>d\'</b>: <b>una dotzena d\'ous</b>, <b>un litre d\'aigua</b>.'],
['Quant costa?','<p>Para preguntar precios: <b>Quant costa?</b> / <b>Quant val?</b> / <b>Quant és?</b></p><p>Los números hasta 1.000: <b>cent, dos-cents, tres-cents, quatre-cents, cinc-cents, sis-cents, set-cents, vuit-cents, nou-cents, mil</b>. Entre las centenas y las unidades no hay «y»: <b>cent vint-i-tres</b>.</p>','',[['Quant costa aquest pa? — Dos euros amb vint.','¿Cuánto cuesta este pan? — Dos euros con veinte.'],['Aquest abric val cent vint-i-cinc euros.','Este abrigo vale ciento veinticinco euros.'],['Són tres euros amb cinquanta.','Son tres euros con cincuenta.'],['És molt car! / És barat!','¡Es muy caro! / ¡Es barato!']],'Los céntimos: <b>amb</b>: <b>3,50 € = tres euros amb cinquanta</b> (o «tres cinquanta»).'],
['Cap, gaire, gens, res','<p>Estas palabras sirven para negar y cuantificar. Se usan mucho en frases negativas.</p>',mt(['Palabra','Significa','Ejemplo'],[['<b>cap</b>','ningún / ninguna','No tinc cap amic aquí.'],['<b>gaire</b>','mucho/a (en negativa)','No tinc gaire temps.'],['<b>gens (de)</b>','nada (de)','No tinc gens de gana.'],['<b>res</b>','nada','No vull res.'],['<b>ningú</b>','nadie','No hi ha ningú.'],['<b>mai</b>','nunca','No fumo mai.']]),[['No hi ha cap cadira lliure.','No hay ninguna silla libre.'],['No menjo gaire carn.','No como mucha carne.'],['No tinc gens de calor.','No tengo nada de calor.'],['No vull res, gràcies.','No quiero nada, gracias.']],'En catalán la doble negación es normal: <b>no… res, no… mai, no… ningú, no… cap</b>. Si la negación va <b>antes</b> del verbo, no se repite: <b>Ningú no ve</b> (o <b>No ve ningú</b>).']

[
['Quina hora és?','<p>Se responde con <b>Són les…</b> (plural) salvo la una: <b>És la una</b>.</p>',mt(['Hora','Català'],[['1:00','És la una'],['2:00','Són les dues'],['3:15','Són les tres i quart'],['4:30','Són les quatre i mitja'],['5:45','Són tres quarts de sis (o les sis menys quart)'],['6:10','Són les sis i deu'],['7:55','Són les vuit menys cinc']]),[['A quina hora dines? — A les dues.','¿A qué hora comes? — A las dos.'],['Són les vuit del matí.','Son las ocho de la mañana.'],['Són les deu de la nit.','Son las diez de la noche.']],'<b>A la una</b> y <b>a les + hora</b>: <b>Sortim a les set</b>. Para precisar: <b>del matí, de la tarda, de la nit, del migdia</b>.'],
['Els quarts','<p>El catalán tiene un sistema propio, muy usado en la lengua oral: se cuentan los <b>cuartos</b> que han pasado de la hora, mirando hacia la hora siguiente.</p>',mt(['Hora','Cómo se dice','Equivale a'],[['2:15','un quart de tres','las dos y cuarto'],['2:30','dos quarts de tres','las dos y media'],['2:45','tres quarts de tres','las tres menos cuarto'],['3:00','les tres','las tres']]),[['Quedem a un quart de nou.','Quedamos a las ocho y cuarto.'],['Sopem a dos quarts de deu.','Cenamos a las nueve y media.'],['Surto a tres quarts de set.','Salgo a las siete menos cuarto (6:45).']],'<b>Truco</b>: «x quarts de H» = (la hora anterior a H) + x cuartos. <b>Un quart de tres</b> = 2:15; <b>dos quarts de tres</b> = 2:30; <b>tres quarts de tres</b> = 2:45. También se dice <b>les dues i quart</b>, <b>les dues i mitja</b>, <b>les tres menys quart</b>.'],
['Dies i mesos','<p>Los días de la semana y los meses se escriben en <b>minúscula</b>. Con el artículo se habla de algo habitual: <b>els dilluns</b> (todos los lunes).</p>',mt(['Dies','Mesos'],[['dilluns, dimarts, dimecres, dijous','gener, febrer, març, abril'],['divendres, dissabte, diumenge','maig, juny, juliol, agost'],['','setembre, octubre, novembre, desembre']]),[['Avui és dilluns, 7 de novembre.','Hoy es lunes, 7 de noviembre.'],['El meu aniversari és el 15 de març.','Mi cumpleaños es el 15 de marzo.'],['Els dissabtes no treballo.','Los sábados no trabajo.'],['Sóc a casa el cap de setmana.','Estoy en casa el fin de semana.']],'Para la fecha: <b>el 7 de novembre</b> (con «el»). Con el día de la semana: <b>dilluns, 7 de novembre</b>. El año: <b>el 2026</b> (dos mil vint-i-sis).'],
['Ara, avui, ahir, demà','<p>Palabras de tiempo muy frecuentes:</p>',mt(['Català','Español'],[['ara','ahora'],['avui','hoy'],['ahir','ayer'],['abans-d\'ahir','anteayer'],['demà','mañana'],['demà passat','pasado mañana'],['aquesta setmana','esta semana'],['la setmana vinent','la semana que viene'],['la setmana passada','la semana pasada'],['l\'any que ve','el año que viene']]),[['Avui plou i demà fa sol.','Hoy llueve y mañana hace sol.'],['Ahir vaig treballar.','Ayer trabajé.'],['Ara no puc, truco més tard.','Ahora no puedo, llamo más tarde.']],'El perfecto (he parlat) con <b>avui</b>, <b>aquesta setmana</b>…; el perifràstic (vaig parlar) con <b>ahir</b>, <b>la setmana passada</b>… Lo verás en las lliçons 21–22 y en A2.']
],

L(12,'a1','La rutina','La rutina','🪥',25,

[
['Verbs pronominals','<p>Muchos verbos de la rutina llevan un pronombre: <b>em, et, es, ens, us, es</b>. Va <b>antes</b> del verbo conjugado.</p>',mt(['Persona','llevar-se','dutxar-se'],[['jo','em llevo','em dutxo'],['tu','et lleves','et dutxes'],['ell / ella','es lleva','es dutxa'],['nosaltres','ens llevem','ens dutxem'],['vosaltres','us lleveu','us dutxeu'],['ells / elles','es lleven','es dutxen']]),[['Em llevo a les set.','Me levanto a las siete.'],['Ens dutxem abans de sopar.','Nos duchamos antes de cenar.'],['Ella es renta les mans.','Ella se lava las manos.']],'Delante de vocal o <b>h</b> los pronombres se apostrofan: <b>m\'adormo</b>, <b>t\'afeites</b>, <b>s\'asseu</b>. El pronombre también existe en <b>infinitivo</b>: <b>llevar-se</b> (guion y se).'],
['Un dia normal','<p>Un día típico con los verbos que ya conoces y otros nuevos.</p>','',[['Em llevo a les set i em dutxo.','Me levanto a las siete y me ducho.'],['Esmorzo cafè amb llet i pa amb tomàquet.','Desayuno café con leche y pan con tomate.'],['Surto de casa a tres quarts de vuit.','Salgo de casa a las siete y cuarenta y cinco.'],['Treballo de nou a cinc.','Trabajo de nueve a cinco.'],['Dino a les dues a la feina.','Como a las dos en el trabajo.'],['Torno a casa a les sis i sopo a les nou.','Vuelvo a casa a las seis y ceno a las nueve.'],['Em vesteixo, em rento les dents i vaig a dormir.','Me visto, me lavo los dientes y me voy a dormir.']],'En catalán «esmorzar» es desayunar, «dinar» comer al mediodía, «berenar» merendar y «sopar» cenar.'],
['Quantes vegades?','<p>Para decir con qué frecuencia haces algo:</p>',mt(['Adverbio','Significa'],[['sempre','siempre'],['normalment','normalmente'],['sovint','a menudo'],['de vegades','a veces'],['poques vegades','pocas veces'],['mai','nunca'],['cada dia','cada día'],['dos cops per setmana','dos veces por semana'],['els dilluns','los lunes']]),[['Sempre prenc cafè al matí.','Siempre tomo café por la mañana.'],['No fumo mai.','Nunca fumo.'],['De vegades vaig a córrer.','A veces voy a correr.']],'<b>Mai</b> va con <b>no</b> si va después del verbo (<b>No fumo mai</b>) y sin <b>no</b> si va antes (<b>Mai no fumo</b> o <b>Mai fumo</b> en lengua informal).'],
['Primer, després, finalment','<p>Para ordenar una secuencia:</p>','',[['Primer em llevo, després em dutxo.','Primero me levanto, luego me ducho.'],['Després esmorzo i finalment surto.','Después desayuno y finalmente salgo.'],['Abans de dormir llegeixo una estona.','Antes de dormir leo un rato.'],['Quan arribo, preparo el sopar.','Cuando llego, preparo la cena.']],'Con <b>abans de</b> + infinitivo: <b>Abans de sortir, tanco la llum</b>. Con <b>després de</b> + infinitivo: <b>Després de dinar, passejo</b>.']
],
[['llevar-se','levantarse'],['dutxar-se','ducharse'],['vestir-se','vestirse'],['esmorzar','desayunar'],['dinar','comer'],['sopar','cenar'],['sempre','siempre'],['mai','nunca'],['de vegades','a veces'],['finalment','finalmente']],
[
c('«Jo ___ a les set.» (llevar-se)','em llevo',['et lleves','es lleva','em llevi'],'Jo em llevo.'),
c('«Tu ___ aviat.» (llevar-se)','et lleves',['em llevo','es lleva','ens llevem'],'Tu et lleves.'),
c('«Nosaltres ___ de seguida.» (dutxar-se)','ens dutxem',['em dutxo','us dutxeu','es dutxen'],'Nosaltres ens dutxem.'),
c('«Ells ___ tard.» (llevar-se)','es lleven',['es lleva','us lleveu','et lleves'],'Ells es lleven.'),
c('Para decir «cenar» se usa…','sopar',['dinar','esmorzar','berenar'],'Sopar = cenar.'),
c('«No fumo ___.» (nunca)','mai',['sempre','res','cap'],'No… mai.'),
c('«___ em llevo, després em dutxo.»','Primer',['Després','Mai','Aviat'],'Primer = primero.'),
c('Elige la secuencia correcta:','Primer esmorzo, després surto.',['Surto, primer esmorzo.','Després esmorzo, primer surto.','Esmorzo i surto primer.'],'Primer… després…'),
t('«Jo ___ (dutxar-se) cada dia.» (con pronombre)','em dutxo','Em dutxo.'),
t('«Vosaltres ___ (vestir-se) de pressa.»','us vestiu','Us vestiu (nosaltres vestim, vosaltres vestiu).'),
t('Escribe «a veces» en catalán.','de vegades','De vegades.'),
b('Me levanto a las siete','em llevo a les set','','Em llevo + a les + hora.'),
b('Cenamos a las nueve','sopem a les nou','','Sopem a les nou.')
],'rutina');

/* ===== A1 · lliçons 13–19 ===== */
L(13,'a1','Preguntar','Preguntar','❓',22,
['Formular preguntas con què, qui, on, quan, com, quant, quin','Distinguir per què / perquè','Pedir información y ayuda en situaciones cotidianas','Responder a preguntas básicas sobre ti'],
[
['Paraules interrogatives','<p>Estas son las palabras para preguntar. Algunas cambian según género y número (<b>quin/quina, quant/quanta</b>).</p>',mt(['Palabra','Significa','Ejemplo'],[['<b>què</b>','qué','Què fas?'],['<b>qui</b>','quién','Qui és?'],['<b>on</b>','dónde','On vius?'],['<b>d\'on</b>','de dónde','D\'on ets?'],['<b>quan</b>','cuándo','Quan arribes?'],['<b>com</b>','cómo','Com et dius?'],['<b>quant / quanta</b>','cuánto / cuánta','Quant costa?'],['<b>quants / quantes</b>','cuántos / cuántas','Quants anys tens?'],['<b>quin / quina</b>','qué, cuál','Quina hora és?'],['<b>quins / quines</b>','qué, cuáles','Quins colors t\'agraden?']]),[['Què vols?','¿Qué quieres?'],['Quin és el teu telèfon?','¿Cuál es tu teléfono?'],['D\'on ets? — Sóc de Mèxic.','¿De dónde eres? — Soy de México.'],['Com va tot?','¿Cómo va todo?']],'<b>Quin / quina</b> se usa con un nombre: <b>Quina hora és?</b>, <b>Quin color t\'agrada?</b>. <b>Què</b> se usa solo o con verbo: <b>Què vols?</b>'],
['Per què i perquè','<p>En catalán «por qué» (pregunta) y «porque» (respuesta) se escriben de forma <b>distinta</b>.</p>',mt(['Función','Forma','Ejemplo'],[['pregunta','<b>per què</b> (dos palabras)','Per què estudies català?'],['respuesta','<b>perquè</b> (una palabra)','Perquè visc aquí.'],['sustantivo','<b>el perquè</b>','No entenc el perquè.']]),[['Per què no vens? — Perquè estic cansat.','¿Por qué no vienes? — Porque estoy cansado.']],'Truco: si se puede cambiar por «por qué» con interrogación, escribe <b>per què</b>; si es «porque», <b>perquè</b>.'],
['Preguntes de sí/no','<p>No hay inversión de sujeto: se pregunta con la misma frase y entonación ascendente. Respuesta típica: <b>Sí</b> o <b>No</b>.</p>','',[['Parles català? — Sí, una mica.','¿Hablas catalán? — Sí, un poco.'],['Ets estudiant? — No, treballo.','¿Eres estudiante? — No, trabajo.'],['Hi ha un banc per aquí?','¿Hay un banco por aquí?'],['Tens gana? — Una mica.','¿Tienes hambre? — Un poco.']],'Para pedir confirmación puedes añadir <b>oi?</b> o <b>no?</b>: <b>Vens, oi?</b> (vienes, ¿verdad?).'],
['Preguntes útils','<p>Frases que te salvan en cualquier situación:</p>','',[['Perdoni, com s\'arriba a l\'estació?','Perdone, ¿cómo se llega a la estación?'],['Què vol dir «carrer»?','¿Qué significa «carrer»?'],['Com es diu això en català?','¿Cómo se dice esto en catalán?'],['Pot parlar més a poc a poc?','¿Puede hablar más despacio?'],['Pot repetir, si us plau?','¿Puede repetir, por favor?'],['Em pot ajudar?','¿Me puede ayudar?']],'Estas frases son las que más práctica oral requieren: dilas en voz alta varias veces.']
],
[['què','qué'],['qui','quién'],['on','dónde'],['quan','cuándo'],['com','cómo'],['quant','cuánto'],['quin / quina','qué / cuál'],['per què','¿por qué?'],['perquè','porque'],['d\'on','de dónde']],
[
c('«___ vius?» (¿dónde?)','On',['Qui','Quan','Com'],'On = dónde.'),
c('«___ et dius?» (¿cómo?)','Com',['On','Què','Quan'],'Com et dius?'),
c('«___ anys tens?»','Quants',['Quant','Quina','Quins'],'Anys es plural masculino: quants.'),
c('«___ hora és?»','Quina',['Quin','Què','Qui'],'Hora es femenino: quina.'),
c('«___ no vens?» (pregunta)','Per què',['Perquè','Pel què','Per que'],'Pregunta = per què.'),
c('«No vinc ___ estic malalt.»','perquè',['per què','pel què','per que'],'Respuesta = perquè.'),
c('Respuesta a «D\'on ets?»','Sóc de Mèxic.',['Visc a Barcelona.','Tinc 30 anys.','Són les tres.'],'D\'on = origen.'),
c('«___ és el teu número?»','Quin',['Quina','Què','Quan'],'Número es masculino: quin.'),
t('«___ és això?» (qué)','Què','Què és això?'),
t('«___ arribes?» (¿cuándo?)','Quan','Quan = cuándo.'),
t('«D\'___ ets?»','on','D\'on ets?'),
b('¿Cómo te llamas?','com et dius','','Com + et dius.'),
b('¿Cuántos años tienes?','quants anys tens','','Quants + anys + tens.')
],'preguntes');
L(14,'a1','Dir que sí i que no','Decir que sí y que no','✅',22,
['Afirmar y negar frases con no, també, tampoc','Usar no… res / ningú / mai / cap','Contestar con naturalidad: sí, i tant, és clar','Unir ideas con però, perquè, així que'],
[
['Sí i no','<p>Para negar, el verbo lleva <b>no</b> delante: <b>No parlo rus</b>. Para contestar:</p>',mt(['Respuesta','Cuándo','Ejemplo'],[['<b>Sí</b>','afirmar','Estàs cansat? — Sí.'],['<b>I tant</b>','sí, rotundo','Vens? — I tant!'],['<b>És clar</b>','claro','Ho saps? — És clar.'],['<b>No</b>','negar','Fumes? — No.'],['<b>Potser</b>','quizá','Vindràs? — Potser.'],['<b>Ni parlar-ne</b>','ni hablar','Cantes? — Ni parlar-ne!']]),[['No tinc cotxe.','No tengo coche.'],['No vull anar al cinema.','No quiero ir al cine.'],['No, gràcies.','No, gracias.']],'La negación se coloca justo <b>antes del verbo conjugado</b>: <b>No me\'n vaig</b>, <b>No ho sé</b>.'],
['També i tampoc','<p><b>També</b> (también) confirma; <b>tampoc</b> (tampoco) niega. Para responder a una afirmación o negación de otro:</p>',mt(['Alguien dice…','Tú coincides','Tú no coincides'],[['Parlo anglès.','Jo també.','Jo no.'],['No parlo anglès.','Jo tampoc.','Jo sí.']]),[['M\'agrada el futbol. — A mi també.','Me gusta el fútbol. — A mí también.'],['No m\'agrada el futbol. — A mi tampoc.','No me gusta el fútbol. — A mí tampoc.'],['Jo no mengo carn. — Jo sí.','Yo no como carne. — Yo sí.']],'<b>A mi també / A mi tampoc</b> con verbos como <b>agradar</b>. Con otros verbos: <b>Jo també / Jo tampoc</b>.'],
['Ningú, res, mai, cap','<p>Las palabras negativas se combinan con <b>no</b> cuando van después del verbo:</p>',mt(['Palabra','Ejemplo','Significa'],[['<b>res</b>','No veig res.','no veo nada'],['<b>ningú</b>','No hi ha ningú.','no hay nadie'],['<b>mai</b>','No he anat mai.','no he ido nunca'],['<b>cap</b>','No tinc cap idea.','no tengo ninguna idea'],['<b>gens</b>','No tinc gens de son.','no tengo nada de sueño']]),[['No coneixo ningú aquí.','No conozco a nadie aquí.'],['No mengem mai carn.','Nunca comemos carne.'],['No té cap germà.','No tiene ningún hermano.']],'Si la palabra va <b>antes</b> del verbo, normalmente <b>no se repite no</b>: <b>Ningú ho sap</b>, <b>Res no canvia</b>.'],
['Connectors simples','<p>Para dar razones y contrastar:</p>',mt(['Palabra','Función','Ejemplo'],[['<b>i</b>','y','Parlo català i castellà.'],['<b>o</b>','o','Vols te o cafè?'],['<b>però</b>','pero','Vull venir, però no puc.'],['<b>perquè</b>','porque','Em quedo a casa perquè plou.'],['<b>així que</b>','así que','Plou, així que no surto.'],['<b>doncs</b>','pues, entonces','Doncs vine!']]),[['M\'agrada, però és car.','Me gusta, pero es caro.'],['No vinc perquè estic cansat.','No vengo porque estoy cansado.']],'Con <b>i</b> + palabra que empieza por <b>i</b>: <b>pare i fill</b>; no hay cambio a «e» como en castellano.']
],
[['sí','sí'],['no','no'],['també','también'],['tampoc','tampoco'],['res','nada'],['ningú','nadie'],['mai','nunca'],['cap','ningún'],['però','pero'],['doncs','pues']],
[
c('«Jo parlo anglès.» — «Jo ___.» (yo también)','també',['tampoc','sí','no'],'Afirmo: també.'),
c('«Jo no parlo anglès.» — «Jo ___.» (yo tampoco)','tampoc',['també','sí','no'],'Niego: tampoc.'),
c('«No veig ___.» (nada)','res',['ningú','mai','cap'],'No… res.'),
c('«No hi ha ___.» (nadie)','ningú',['res','mai','cap'],'No… ningú.'),
c('«No he anat ___.» (nunca)','mai',['res','cap','ningú'],'No… mai.'),
c('«No tinc ___ idea.» (ninguna)','cap',['res','mai','gens'],'Cap + nombre.'),
c('«Vull venir, ___ no puc.»','però',['perquè','doncs','i'],'Contraste: però.'),
c('«Plou, així que no ___.»','surto',['sortir','sortit','sortim'],'Jo surto.'),
t('«No m\'agrada. — A mi ___.» (tampoco)','tampoc','A mi tampoc.'),
t('«___ ho sé.» (no lo sé)','No','No ho sé.'),
t('«___ tant!» (claro que sí)','I','I tant!'),
b('No tengo coche','no tinc cotxe','','No + tenir.'),
b('Nunca como carne','no menjo mai carn','','No… mai.')
],'preguntes');
L(15,'a1','Has de…','Tienes que…','📌',22,
['Expresar obligación con haver de, cal y tenir que','Dar consejos sencillos','Pedir y dar permiso','Usar deure en forma de deber'],
[
['Haver de + infinitiu','<p>Es la forma más natural de decir «tener que». Se conjuga <b>haver</b> en presente + <b>de</b> + infinitivo.</p>',mt(['Persona','haver de'],[['jo','he de'],['tu','has de'],['ell / ella','ha de'],['nosaltres','hem de'],['vosaltres','heu de'],['ells / elles','han de']]),[['He de treballar dissabte.','Tengo que trabajar el sábado.'],['Has de parlar amb ell.','Tienes que hablar con él.'],['Heu de portar el DNI.','Tenéis que llevar el DNI.']],'No digas «tinc que»: es un calco. En catalán: <b>he de</b> / <b>has de</b>.'],
['Cal + infinitiu','<p><b>Cal</b> es impersonal («hay que», «es necesario»). No cambia.</p>','',[['Cal portar el passaport.','Hay que llevar el pasaporte.'],['Cal pagar abans de sortir.','Hay que pagar antes de salir.'],['No cal que vinguis.','No hace falta que vengas.'],['No cal ser expert.','No hace falta ser experto.']],'<b>Cal</b> + infinitivo. <b>Cal que</b> + subjuntivo (A2): <b>Cal que vinguis</b>.'],
['Consells i permisos','<p>Frases útiles para aconsejar y pedir permiso.</p>',mt(['Función','Frase'],[['consejo','Has de descansar. / Cal beure aigua.'],['permiso (pedir)','Puc entrar? / Puc obrir la finestra?'],['permiso (dar)','Sí, és clar. / Endavant.'],['prohibición','No es pot fumar. / Està prohibit aparcar.'],['posibilidad','Es pot pagar amb targeta?']]),[['Es pot fumar aquí? — No, està prohibit.','¿Se puede fumar aquí? — No, está prohibido.'],['Puc seure aquí? — I tant.','¿Puedo sentarme aquí? — Claro.']],'<b>Es pot…</b> = se puede; <b>No es pot…</b> = no se puede. Estructura impersonal con <b>es</b> + 3.ª persona.'],
['Deure','<p><b>Deure</b> + infinitivo expresa suposición («debe de»). No es lo mismo que obligación.</p>','',[['Deu ser tard.','Debe de ser tarde.'],['Deuen estar a casa.','Deben de estar en casa.'],['Deu tenir quaranta anys.','Debe de tener cuarenta años.']],'Para obligación usa <b>haver de</b> o <b>cal</b>; para suposición, <b>deure</b> (+ <b>de</b> opcional).']
],
[['haver de','tener que'],['cal','hay que'],['es pot','se puede'],['no es pot','no se puede'],['està prohibit','está prohibido'],['endavant','adelante'],['descansar','descansar'],['portar','llevar'],['deure','deber (suposición)'],['tard','tarde']],
[
c('«Jo ___ treballar.» (tengo que)','he de',['has de','ha de','hem de'],'Jo he de.'),
c('«Tu ___ descansar.»','has de',['he de','ha de','heu de'],'Tu has de.'),
c('«Nosaltres ___ marxar.»','hem de',['heu de','han de','he de'],'Nosaltres hem de.'),
c('«___ portar el passaport.» (hay que)','Cal',['Han de','Calen','Calem'],'Cal no cambia.'),
c('«Es ___ fumar aquí?» (¿se puede?)','pot',['pots','poden','podem'],'Es pot.'),
c('«No cal que ___.» (vengas) - elige la forma correcta de verbo','vinguis',['vens','venis','vinguem'],'Cal que + subjuntivo: vinguis.'),
c('«Deu ___ tard.» (debe de ser)','ser',['és','sóc','sigui'],'Deure + infinitivo.'),
c('Para pedir permiso:','Puc entrar?',['Pots entrar.','Entra!','Pot entrar?'],'Puc entrar? = ¿puedo entrar?'),
t('«Jo ___ (haver de) estudiar.»','he de','Jo he de.'),
t('«___ pagar abans de sortir.» (hay que)','Cal','Cal.'),
t('«Vosaltres ___ (haver de) venir.»','heu de','Vosaltres heu de.'),
b('Tengo que trabajar','he de treballar','','Haver de + infinitivo.'),
b('Hay que pagar antes de salir','cal pagar abans de sortir','','Cal + infinitivo.')
],'verbs1');
L(16,'a1','El cos i la salut','El cuerpo y la salud','🩺',25,
['Nombrar las partes del cuerpo','Decir qué te duele con fer mal y tenir mal de','Describir síntomas y pedir cita médica','Usar los pronombres em, et, li, ens, us, els en frases de salud'],
[
['Parts del cos','<p>Las palabras que más necesitarás. Fíjate en los plurales irregulares.</p>',mt(['Singular','Plural','Español'],[['el cap','els caps','cabeza'],['l\'ull','els ulls','ojo'],['l\'orella','les orelles','oreja'],['el nas','els nassos','nariz'],['la boca','les boques','boca'],['el braç','els braços','brazo'],['la mà','les mans','mano'],['el dit','els dits','dedo'],['la cama','les cames','pierna'],['el peu','els peus','pie'],['l\'esquena','les esquenes','espalda'],['la panxa','les panxes','barriga']]),[['Tinc els ulls blaus.','Tengo los ojos azules.'],['Em rento les mans.','Me lavo las manos.']],'El plural de <b>nas</b> es <b>nassos</b> (como autobús → autobusos).'],
['Fer mal','<p>Para decir que algo te duele se usa <b>fer mal</b> con un pronombre: <b>em, et, li, ens, us, els</b>. El verbo concuerda con lo que duele.</p>',mt(['Qué duele','Frase','Español'],[['singular','Em fa mal el cap.','Me duele la cabeza.'],['plural','Em fan mal els peus.','Me duelen los pies.'],['otra persona','Li fa mal l\'esquena.','Le duele la espalda.']]),[['Em fa mal l\'estómac.','Me duele el estómago.'],['Et fan mal les cames?','¿Te duelen las piernas?'],['Li fa mal la gola.','Le duele la garganta.']],'Con <b>mal de</b>: <b>Tinc mal de cap</b>, <b>Tinc mal de queixal</b>, <b>Tinc mal d\'estómac</b>. Los dos modos son correctos.'],
['Trobar-se bé o malament','<p>Para el estado de salud: <b>trobar-se</b>, <b>estar</b> o <b>sentir-se</b>.</p>',mt(['','trobar-se'],[['jo','em trobo'],['tu','et trobes'],['ell / ella','es troba'],['nosaltres','ens trobem'],['vosaltres','us trobeu'],['ells / elles','es troben']]),[['Com et trobes? — Em trobo malament.','¿Cómo te encuentras? — Me encuentro mal.'],['Estic refredat.','Estoy resfriado.'],['Tinc febre i tos.','Tengo fiebre y tos.'],['Tinc grip.','Tengo gripe.']],'<b>Tenir</b> + enfermedad: <b>tinc grip, tinc febre, tinc tos, tinc mal de cap</b>. <b>Estar</b> + estado: <b>estic malalt, estic cansat, estic refredat</b>.'],
['Anar al metge','<p>Frases para pedir cita y explicar qué te pasa.</p>','',[['Voldria demanar hora amb el metge.','Quisiera pedir hora con el médico.'],['Què li passa?','¿Qué le pasa?'],['Fa tres dies que tinc febre.','Hace tres días que tengo fiebre.'],['Prengui aquest medicament dues vegades al dia.','Tome este medicamento dos veces al día.'],['Truqui al 112 en cas d\'emergència.','Llame al 112 en caso de emergencia.'],['Necessito una recepta.','Necesito una receta.']],'Emergencias: <b>112</b>. En la lengua formal el médico usa <b>vostè</b>: <b>prengui, descansi, begui</b> (imperativo formal, lo verás en la lliçó 18).']
],
[['el cap','la cabeza'],['la mà','la mano'],['el peu','el pie'],['l\'esquena','la espalda'],['fer mal','doler'],['el metge','el médico'],['la febre','la fiebre'],['trobar-se','encontrarse'],['la recepta','la receta'],['l\'urgència','la urgencia']],
[
c('«Em ___ mal el cap.»','fa',['fan','faig','fem'],'El cap es singular: fa.'),
c('«Em ___ mal els peus.»','fan',['fa','fas','fem'],'Peus = plural: fan.'),
c('«Li ___ mal l\'esquena.»','fa',['fan','fas','faig'],'L\'esquena = singular: fa.'),
c('Plural de «nas»:','nassos',['nasos','nases','nasus'],'Nas → nassos.'),

[
['Agradar','<p>El verbo que se usa para «gustar» es <b>agradar</b>: <b>m\'agrada</b> (singular), <b>m\'agraden</b> (plural). La cosa que gusta es el sujeto.</p>',mt(['Persona','Singular','Plural'],[['a mi','<b>m\'</b>agrada el cafè','<b>m\'</b>agraden els gats'],['a tu','<b>t\'</b>agrada','<b>t\'</b>agraden'],['a ell / ella','<b>li</b> agrada','<b>li</b> agraden'],['a nosaltres','<b>ens</b> agrada','<b>ens</b> agraden'],['a vosaltres','<b>us</b> agrada','<b>us</b> agraden'],['a ells / elles','<b>els</b> agrada','<b>els</b> agraden']]),[['M\'agrada el cinema.','Me gusta el cine.'],['T\'agraden els gats?','¿Te gustan los gatos?'],['Ens agrada viatjar.','Nos gusta viajar.'],['No li agrada la carn.','No le gusta la carne.']],'Con verbo (infinitivo) se usa singular: <b>M\'agrada cantar</b>, <b>M\'agrada llegir i caminar</b> (aunque sean dos cosas, singular).'],

['Preferir, encantar, odiar','<p>Hay otros verbos para matizar gustos:</p>',mt(['Verbo','Significa','Ejemplo'],[['<b>encantar</b>','encantar','M\'encanta el mar.'],['<b>agradar</b>','gustar','M\'agrada el mar.'],['<b>preferir</b>','preferir','Prefereixo el te.'],['<b>no suportar</b>','no soportar','No suporto el soroll.'],['<b>detestar / odiar</b>','detestar','Detesto esperar.']]),[['M\'encanta la xocolata!','¡Me encanta el chocolate!'],['Prefereixo anar en tren.','Prefiero ir en tren.'],['No suporto el fred.','No soporto el frío.']],'<b>Encantar</b> funciona igual que <b>agradar</b>: <b>M\'encanta</b> / <b>M\'encanten</b>.'],
['Preguntar gustos','<p>Preguntas útiles:</p>','',[['Què t\'agrada fer?','¿Qué te gusta hacer?'],['T\'agrada la música? — Sí, molt.','¿Te gusta la música? — Sí, mucho.'],['Quin és el teu color preferit?','¿Cuál es tu color preferido?'],['Prefereixes el cafè o el te?','¿Prefieres el café o el té?'],['T\'agradaria venir amb nosaltres?','¿Te gustaría venir con nosotros?']],'<b>M\'agradaria</b> (me gustaría) y <b>m\'encantaria</b> (me encantaría) son formas de cortesía (condicional).']

['Tractament','<p>En catalán hay dos formas de tratamiento:</p>',mt(['','tu (informal)','vostè (formal)'],[['uso','amigos, familia, jóvenes','desconocidos, mayores, trabajo formal'],['verbo','2.ª persona: parles','3.ª persona: parla'],['posesivo','el teu','el seu'],['pronom','et, te','el, la, li']]),[['Com et dius? / Com es diu?','¿Cómo te llamas? / ¿Cómo se llama usted?'],['Quants anys tens? / Quants anys té?','¿Cuántos años tienes? / ¿Cuántos tiene usted?'],['Vols un cafè? / Vol un cafè?','¿Quieres un café? / ¿Quiere un café?']],'En Catalunya el <b>tu</b> es muy extendido, incluso con desconocidos jóvenes. El <b>vostè</b> se usa con personas mayores, en atención al público o contextos formales. Ante la duda, usa <b>vostè</b>.'],

['Descriure persones','<p>Se usa <b>ser</b> + adjetivo para el aspecto y el carácter, <b>tenir</b> + parte del cuerpo para rasgos físicos:</p>','',[['És alta, prima i té els cabells castanys.','Es alta, delgada y tiene el pelo castaño.'],['És un home gran amb barba.','Es un hombre mayor con barba.'],['És molt simpàtica i treballadora.','Es muy simpática y trabajadora.'],['Porta ulleres i un barret.','Lleva gafas y un sombrero.'],['Tinc els ulls marrons.','Tengo los ojos marrones.']],'<b>Portar</b> = llevar puesto: <b>Porta una camisa blava</b>. <b>Anar vestit de</b> + color: <b>Va vestit de negre</b>.'],
['La roba','<p>Vocabulario básico de ropa y cómo hablar de ella.</p>',mt(['Català','Español'],[['la camisa / la samarreta','camisa / camiseta'],['els pantalons / els texans','pantalones / vaqueros'],['la faldilla / el vestit','falda / vestido'],['el jersei / la jaqueta','jersey / chaqueta'],['les sabates / les sabatilles','zapatos / zapatillas'],['els mitjons','calcetines'],['la bufanda / el barret','bufanda / sombrero'],['la talla / el número','talla / número de calzado']]),[['Quina talla porteu?','¿Qué talla usáis?'],['Em puc emprovar aquests pantalons?','¿Me puedo probar estos pantalones?'],['Aquesta jaqueta m\'està gran.','Esta chaqueta me queda grande.']],'<b>Estar gran / petit / bé / malament</b> para decir cómo sienta una prenda: <b>Aquest vestit m\'està molt bé</b>.']
],

L(21,'a1','Què has fet?','¿Qué has hecho?','⏮️',25,
['Formar el pretérito perfecto (perfet) con haver + participio','Formar el participio de los verbos regulares','Usar marcadores como avui, aquesta setmana, ja, encara no','Contar lo que has hecho hoy o recientemente'],
[
['El perfet','<p>El <b>perfet</b> se forma con el presente de <b>haver</b> (he, has, ha, hem, heu, han) + <b>participio</b>. Equivale al «he hablado» castellano.</p>',mt(['','haver','+ parlar'],[['jo','he','he parlat'],['tu','has','has parlat'],['ell / ella','ha','ha parlat'],['nosaltres','hem','hem parlat'],['vosaltres','heu','heu parlat'],['ells / elles','han','han parlat']]),[['Avui he treballat molt.','Hoy he trabajado mucho.'],['Has menjat?','¿Has comido?'],['Hem vist una pel·lícula.','Hemos visto una película.'],['No han vingut.','No han venido.']],'La negación va antes de <b>haver</b>: <b>No he menjat</b>. El participio <b>no cambia</b> (no hay concordancia con el sujeto).'],
['El participi regular','<p>El participio de los verbos regulares:</p>',mt(['Infinitivo','Participio','Ejemplo'],[['-ar → <b>-at</b>','parlat, cantat, treballat','He cantat.'],['-er/-re → <b>-ut</b>','perdut, rebut, viscut (irr.)','He perdut les claus.'],['-ir → <b>-it</b>','dormit, sortit, llegit','He llegit tot el llibre.']]),[['He dormit vuit hores.','He dormido ocho horas.'],['Has sortit amb els teus amics?','¿Has salido con tus amigos?'],['Hem comprat pa.','Hemos comprado pan.']],'En la lección siguiente verás los <b>participios irregulares</b> (fet, dit, vist, escrit…).'],
['Quan s\'usa el perfet','<p>En la lengua de Catalunya el <b>perfet</b> se usa para acciones pasadas con relación al presente (hoy, esta semana, este año):</p>',mt(['Marcador','Ejemplo'],[['avui','Avui he anat a treballar.'],['aquesta setmana','Aquesta setmana he estudiat molt.'],['aquest any','Aquest any he viatjat a Itàlia.'],['ja','Ja he menjat.'],['encara no','Encara no he sopat.'],['mai','No he estat mai a Roma.']]),[['Ja has fet els deures? — Encara no.','¿Ya has hecho los deberes? — Todavía no.'],['Has estat mai a Londres?','¿Has estado alguna vez en Londres?']],'Para el pasado que ya no tiene relación con el presente (ayer, el año pasado) se usa el <b>perifràstic</b> (vaig parlar): lo verás en A2.'],

['Estructures clau','<p>Un mapa de las estructuras principales:</p>',mt(['Función','Estructura','Ejemplo'],[['presentarse','Sóc… / Em dic…','Sóc Anna.'],['pedir','Voldria / Em porta…?','Voldria un cafè.'],['localizar','hi ha / és a','Hi ha una farmàcia.'],['obligación','he de / cal','He de marxar.'],['gustos','m\'agrada(n)','M\'agrada el mar.'],['pasado reciente','he + participi','He menjat.'],['rutina','em llevo, esmorzo…','Em llevo a les set.'],['direcciones','gira, continua…','Gira a la dreta.']]),[],'Vuelve a leer los cuadros de cada lección cuando dudes.'],
