ativo tu de fer: tres letras."], ["a216#9", "e", "Fes = haz. Fer → fes, fa, feu. «Fes-ho» = hazlo."], ["a216#10", "h", "Imperativo tu de dir: seis letras."], ["a216#10", "e", "«Digues» = di (imperativo de tu de dir, irregular). «Digues-m'ho» = dímelo; «digues-li» = dile. Con pronombres se une con guion."], ["a216#11", "h", "Imperativo vosaltres de seure: seieu."], ["a216#11", "e", "Seieu = sentaos. Seure: seu, seguem, seieu. El imperativo de vosaltres es igual que el presente de vosaltres."], ["a216#12", "t", "Dóna'm = dame. Dóna + em → dóna'm."], ["a216#13", "t", "No + pronombres + subjuntivo: «No m'ho diguis»."], ["a217#1", "e", "«Crec que» + indicativo: «Crec que té raó». Afirmo una creencia, indicativo."], ["a217#2", "e", "«No crec que» + subjuntivo: «No crec que tingui raó». Niego o dudo, subjuntivo."], ["a217#3", "e", "«Estar d'acord amb» + persona: «Estic d'acord amb tu». Con cosa: «estar d'acord en»."], ["a217#4", "e", "«No hi estic d'acord» = no estoy de acuerdo (con eso). «Hi» sustituye a «amb això»."], ["a217#5", "e", "«Tant me fa» = me da igual. Expresión informal de indiferencia."], ["a217#6", "e", "«Em sap greu» = lo siento (me da pena). Fórmula de disculpa o de condolencia."], ["a217#7", "e", "Para reclamar: «Voldria fer una reclamació». Es cortés y claro."], ["a217#8", "e", "«Per a mi» = para mí. Después de preposición se usa el pronombre fuerte «mi»."], ["a217#9", "h", "Conjunción de tres letras."], ["a217#9", "e", "«Penso que» = pienso que. Después de pensar/creer se usa «que»."], ["a217#10", "h", "Sustantivo femenino de tres letras: razón."], ["a217#10", "e", "«Tens tota la raó» = tienes toda la razón. «Raó» (razón)."], ["a217#11", "h", "Adjetivo de cinco letras: pesado."], ["a217#11", "e", "«Em sap greu» = lo siento. «Greu» = grave."], ["a217#12", "t", "Estar d'acord amb + persona. «Estic d'acord amb tu»."], ["a217#13", "t", "Crec que + indicativo. «Crec que és una bona idea»."], ["a24#11", "h", "Preposición de dos letras que va antes de «sobte»."], ["a218#1", "e", "«Pensar en» + persona o cosa: «Penso en tu». «Pensar de» (opinar) es otro significado: «Què en penses?» = ¿qué piensas de eso?"], ["a218#2", "e", "«Dependre de»: «Depèn del temps» = depende del tiempo. de + el = del. No se dice «dependre en»."], ["a218#3", "e", "«Començar a» + infinitivo: «Comença a ploure». Con otros verbos de inicio: tornar a, posar-se a."], ["a218#4", "e", "«Preocupar-se per» + persona o cosa. «Em preocupo per tu» = me preocupo por ti. No se usa «de»."], ["a218#5", "e", "«Confiar en» + persona. «Confio en tu» = confío en ti. En castellano «confiar en» también."], ["a218#6", "e", "«Assemblar-se a» + persona = parecerse a. «Aquest nen s'assembla al seu avi». No confundir con «semblar» (parecer)."], ["a218#7", "e", "«Semblar» + adjetivo = parecer. «Sembla cansat» = parece cansado. No lleva preposición."], ["a218#8", "e", "«Quedar-se» + adjetivo expresa resultado: «Es va quedar sol» = se quedó solo. Perifràstic: va + infinitivo."], ["a218#9", "h", "Preposición de dos letras."], ["a218#9", "e", "«Oblidar-se de» = olvidarse de. «M'he oblidat de tu» = me he olvidado de ti. Con pronombre reflexivo."], ["a218#10", "h", "Preposición que significa «con»."], ["a218#10", "e", "«Parlar amb» = hablar con. «Parlo amb ell»."], ["a218#11", "h", "Verbo que significa «poner»; infinitivo de seis letras."], ["a218#11", "e", "«Posar-se vermell» = ponerse rojo. «Es va posar vermell» = se puso rojo."], ["a218#12", "t", "Pensar en + persona. «Penso en tu»."], ["a218#13", "t", "Dependre de + el = del. «Depèn del temps»."], ["a219#1", "e", "«Que» es el relativo básico: el libro que leo → el llibre que llegeixo. Después de preposición se usa «què» o «qui»."], ["a219#2", "e", "«On» = donde, relativo de lugar. «La ciutat on visc» = la ciudad donde vivo."], ["a219#3", "e", "Después de preposición se usa «qui» para personas. «L'amic amb qui vaig anar» = el amigo con quien fui."], ["a219#4", "e", "«Tot i que» + indicativo expresa un hecho real. «Tot i que plou, surto» = aunque llueve, salgo."], ["a219#5", "e", "«Encara que» + subjuntivo expresa algo hipotético. «Encara que plogui, sortiré» = aunque llueva, saldré."], ["a219#6", "e", "«Mentre» = mientras. «Mentre cuino, escolto música» = mientras cocino, escucho música. Dos acciones simultáneas."], ["a219#7", "e", "«Per tant» = por lo tanto. Conector de consecuencia. «Estic malalt; per tant, no vindré»."], ["a219#8", "e", "«Quan» + subjuntivo cuando se habla del futuro: «Quan vinguis, parlarem» = cuando vengas, hablaremos. No se usa futuro."], ["a219#9", "h", "Adverbio relativo de lugar: dos letras."], ["a219#9", "e", "«El bar on esmorzem» = el bar donde desayunamos. «On» = donde."], ["a219#10", "h", "Preposición de cinco letras: hasta."], ["a219#10", "e", "«Fins que» + subjuntivo = hasta que. «Espero fins que arribis» = espero hasta que llegues."], ["a219#11", "h", "Dos palabras: tot + i."], ["a219#11", "e", "«Tot i que plou, surto» = aunque llueve, salgo. «Tot i» + que."], ["a219#12", "t", "Que = relativo. «El llibre que llegeixo és bo»."], ["a219#13", "t", "Quan + subjuntivo. «Quan arribis, truca'm»."], ["a220#1", "e", "«Anada i tornada» = ida y vuelta. «D'anada i tornada» se usa en el sentido de billete: «Dos bitllets d'anada i tornada»."], ["a220#2", "e", "«Surt» = sale (3.ª persona de sortir). «A quina hora surt el tren?» = ¿a qué hora sale el tren?"], ["a220#3", "e", "«A nom de» = a nombre de. «Tinc una reserva a nom de Garcia»."], ["a220#4", "e", "«Inclòs» = incluido (masculino singular). «L'esmorzar està inclòs». Concuerda con «esmorzar» (masculino)."], ["a220#5", "e", "«Retard» = retraso. «El tren porta deu minuts de retard». Fíjate: no se dice «tard»."], ["a220#6", "e", "«Visites guiades» = visitas guiadas. Concuerda con «visites» (femenino plural): guiades."], ["a220#7", "e", "«L'any passat» pide perifràstic: vaig anar. Es un tiempo cerrado."], ["a220#8", "e", "Para «alguna vez» se usa el perfecto: «Has viatjat mai a l'estranger?» = ¿has viajado alguna vez al extranjero?"], ["a220#9", "h", "Adjetivo de cinco letras: doble."], ["a220#9", "e", "«Habitació doble» = habitación doble. «Individual» es la habitación para una persona."], ["a220#10", "h", "Sustantivo de cuatro letras: precio."], ["a220#10", "e", "«Preu» = precio. «Quin és el preu per nit?» = ¿cuál es el precio por noche?"], ["a220#11", "h", "Verbo obrir, 3.ª persona singular."], ["a220#11", "e", "«Obre» = abre. «A quina hora obre el museu?» = ¿a qué hora abre el museo?"], ["a220#12", "t", "Voldria + objeto. «Voldria un mapa de la ciutat»."], ["a220#13", "t", "A quina hora + surt. «A quina hora surt el tren?»"], ["a221#1", "e", "«Cada vuit hores» = cada ocho horas. «Vuit» = ocho (cardinal). «Vuitè» es el ordinal."], ["a221#2", "e", "«Per al mal de cap»: per + a + el = per al. Hace falta «per» seguido de «al»."], ["a221#3", "e", "«Recepta» = receta (médica). «Recepció» es la recepción. «Receptar» es recetar."], ["a221#4", "e", "«Té efectes secundaris?» = ¿tiene efectos secundarios? «Té» (3.ª persona) para vostè."], ["a221#5", "e", "«Fa tres dies que tinc febre» = hace tres días que tengo fiebre. Fa + tiempo + que + presente."], ["a221#6", "e", "«Des d'ahir» = desde ayer. «Des de» + inicio. Se apostrofa ante vocal: des d'ahir."], ["a221#7", "e", "El 112 es el teléfono de emergencias europeo. Otros: 061 (sanidad), 091 (policía), 080 (bomberos)."], ["a221#8", "e", "«Prengui'l» = tómelo. Imperativo de vostè (prengui) + el."], ["a221#9", "h", "Sustantivo de cuatro letras: significa «hora» (cita)."], ["a221#9", "e", "«Demanar hora» = pedir cita. «Voldria demanar hora al CAP»."], ["a221#10", "h", "Verbo infinitivo de seis letras: sacudir."], ["a221#10", "e", "«Cal agitar el xarop» = hay que agitar el jarabe. «Agitar» = agitar."], ["a221#11", "h", "1.ª persona de «receptar»."], ["a221#11", "e", "«Li recepto un medicament» = le receto un medicamento. «Receptar» es el verbo."], ["a221#12", "t", "Voldria + demanar hora. «Voldria demanar hora al CAP»."], ["a221#13", "t", "Des d'ahir = desde ayer. «Em fa mal el cap des d'ahir»."], ["a222#1", "e", "Deportes de juego con «jugar a»: jugo a futbol, a tennis, a bàsquet. Sin artículo. Con instrumentos, «tocar»."], ["a222#2", "e", "«Fer natació» = hacer natación. «Fer» + deporte individual: fer ioga, fer ciclisme. «Nedar» también es válido (nedar = nadar)."], ["a222#3", "e", "«Entrades» = entradas (billetes para un espectáculo). Femenino plural: dues entrades. «Entrada» también es la entrada de un edificio."], ["a222#4", "e", "Perifràstic: vam + infinitivo. «Ahir vam guanyar el partit» = ayer ganamos el partido. «Ahir» marca tiempo cerrado."], ["a222#5", "e", "Perifràstic: va + infinitivo. «L'equip va perdre 2-1». Perdre → perdre (infinitivo). El marcador se lee «dos a un»."], ["a222#6", "e", "«Valer la pena» = valer la pena: «Val la pena» (3.ª singular). «Pena» (femenino) también significa lástima."], ["a222#7", "e", "«Et recomano aquesta sèrie» = te recomiendo esta serie. Recomanar: recomano, recomanes, recomana, recomanem, recomaneu, recomanen."], ["a222#8", "e", "El marcador se dice «dos a un» (2-1). «A» une los dos números. También: «tres a zero», «empat a dos»."], ["a222#9", "h", "Mirar, 1.ª plural: mir + -em."], ["a222#9", "e", "Mirem la tele = miramos la tele. «Mirar la televisió» se usa para ver la tele."], ["a222#10", "h", "Medio de comunicación de cinco letras, empieza por r."], ["a222#10", "e", "«Ràdio» = radio. Con tilde grave en la a: ràdio. «Escoltar la ràdio»."], ["a222#11", "h", "Infinitivo de agradar: ocho letras."], ["a222#11", "e", "«Em va agradar molt» = me gustó mucho. Perifràstic: va + infinitivo."], ["a222#12", "t", "Ahir + vam + infinitivo. «Vam guanyar» = ganamos."], ["a222#13", "t", "Et recomano + sustantivo. «Et recomano aquest llibre»."], ["a223#1", "e", "Saludo formal en una carta: «Benvolguda senyora:» (mujer) / «Benvolgut senyor:» (hombre). Se usa dos puntos. «Estimat/da» es más cercano."], ["a223#2", "e", "Despedida formal: «Cordialment,», «Atentament,» o «Salutacions cordials,». Se usa coma."], ["a223#3", "e", "Despedida informal: «Una abraçada,» (un abrazo), «Records,», «Fins aviat,»."], ["a223#4", "e", "«Experiència» lleva acento grave. Regla: -ència, -ància. «Tinc dos anys d'experiència»."], ["a223#5", "e", "«Em poso en contacte amb vostè» = me pongo en contacto con usted. Fórmula habitual en cartas formales."], ["a223#6", "e", "«Quedo a l'espera de la seva resposta» = quedo a la espera de su respuesta. Fórmula formal de cierre."], ["a223#7", "e", "«Llengües» = lenguas. Plural de llengua: -ües (con diéresis para mantener el sonido /w/). «Parlo tres llengües»."], ["a223#8", "e", "«Nadiu» = nativo. «Parlant nadiu» = hablante nativo. También: «natal» es del lugar de nacimiento."], ["a223#9", "h", "Palabra latina, nueve letras. Con tilde."], ["a223#9", "e", "«Currículum» = currículum. Se escribe con tilde en la i. «Adjunto el meu currículum»."], ["a223#10", "h", "Masculino de «benvolguda»."], ["a223#10", "e", "«Benvolgut senyor:» = estimado señor. Masculino: benvolgut; femenino: benvolguda."], ["a223#11", "h", "Palabra de cuatro letras: curs."], ["a223#11", "e", "«Curs» = curso. «Estic fent un curs de català» = estoy haciendo un curso de catalán."], ["a223#12", "t", "Adjunto el meu currículum. «Adjuntar» = adjuntar (sin cambio)."], ["a223#13", "t", "Gràcies per la seva atenció. «Seva» concuerda con «atenció» (femenino)."], ["a224#1", "e", "«Què» lleva acento grave (es interrogativo/relativo tónico). «No sé què vol». «Que» sin acento es la conjunción."], ["a224#2", "e", "«Si no» (condición, dos palabras) vs «sinó» (conjunción adversativa). «Si no vens, ho faré jo». «Sí» con tilde es afirmación."], ["a224#3", "e", "«Té» con acento = tiene (verbo tenir). «Te» sin acento es el pronombre «te».  La infusión se escribe «te» (sin acento)."], ["a224#4", "e", "«Més» con acento = más. «Mes» sin acento = mes (temporal). Acento diacrítico."], ["a224#5", "e", "«Països» = países. Plural de país: països (con diéresis para romper el diptongo: pa-ís). «Païssos» es incorrecto."], ["a224#6", "e", "«Col·legi» se escribe con «l·l» (punt volat). No es «ll» (llibre) ni «ly»."], ["a224#7", "e", "«-ista» designa profesiones u oficios: periodista, dentista, taxista. No cambia de género."], ["a224#8", "e", "En valenciano la 1.ª persona del presente termina en -e: parle (jo parle). En catalán central: parlo."], ["a224#9", "h", "Dos abreviaturas: p. + ex."], ["a224#9", "e", "«p. ex.» = por ejemplo (per exemple). Con puntos."], ["a224#10", "h", "Diminutivo de casa: cas + -eta."], ["a224#10", "e", "«Caseta» = casita. Diminutivos: -et/-eta. «Una caseta petita»."], ["a224#11", "h", "Con diéresis en la i."], ["a224#11", "e", "«Veïna» = vecina. La diéresis (ï) marca que i y e se pronuncian por separado."], ["a224#12", "t", "Què con acento: «No sé què vol»."], ["a224#13", "t", "Més con acento = más: «vull més temps»."], ["a18#1", "e", "Beure es irregular: bec, beus, beu, bevem, beveu, beuen. La 1.ª persona es «bec» (yo bebo), no «bevo». La raíz «bev-» reaparece en nosaltres y vosaltres."], ["a18#2", "e", "Viure: visc, vius, viu, vivim, viviu, viuen. Nosaltres → vivim. La raíz «viu-» pasa a «viv-» en nosaltres/vosaltres, como en beure."], ["a18#3", "e", "Rebre es regular en -re: rebo, reps, rep, rebem, rebeu, reben. Ells → reben (-en). Cuidado con no confundirlo con «rebeu» (vosaltres)."], ["a18#4", "e", "Dormir es un verbo «puro» (sin -eix-): dormo, dorms, dorm, dormim, dormiu, dormen. No dice «dormeixes». Se distingue de los incoativos (llegir → llegeixo)."], ["a18#5", "e", "Llegir es incoativo (verbo -ir con -eix- en formas con acento en la raíz): llegeixo, llegeixes, llegeix, llegim, llegiu, llegeixen. Por eso «llegeixo», no «llegio»."], ["a18#6", "e", "En los incoativos, nosaltres y vosaltres no llevan -eix-: llegim, llegiu. Solo las formas con acento en la raíz (jo, tu, ell, ells) llevan -eix-."], ["a18#7", "e", "Sortir hace «surto» en jo, tu, ell, ells (o → u), pero en vosaltres vuelve a la raíz: sortim, sortiu. Mismo cambio con dormir (dormo) no ocurre; es un verbo propio."], ["a18#8", "e", "Preferir es incoativo: prefereixo, prefereixes, prefereix, preferim, preferiu, prefereixen. 3.ª singular = prefereix (sin -e final)."], ["a18#9", "h", "Obrir: 1.ª persona del presente. Termina en -o, sin -eix-."], ["a18#9", "e", "Obrir: obro, obres, obre, obrim, obriu, obren. Es un verbo en -ir «puro»: sin -eix-. Participio irregular: obert."], ["a18#10", "h", "Viure, 2.ª persona del singular. Empieza por v y termina en -s."], ["a18#10", "e", "Viure: vius para «tú». Es la forma regular de la raíz «viu-» + -s."], ["a18#11", "h", "Beure, 2.ª plural: la raíz cambia a «bev-» y termina en -eu."], ["a18#11", "e", "Beure: beveu para vosotros. Reaparece la raíz «bev-» (como en bevem)."], ["a18#12", "t", "Beure → bec (1.ª persona irregular). En frase: «Bec aigua» (sin artículo, como en castellano)."], ["a18#13", "t", "Llegir: nosaltres llegim (sin -eix-). El periódico se dice «el diari»."], ["a19#1", "e", "Anar: vaig, vas, va, anem, aneu, van. La 1.ª persona es «vaig» (irregular). Después se usa «a»: vaig al cinema."], ["a19#2", "e", "Fer: faig, fas, fa, fem, feu, fan. Tu → fas. «Fas esport?» = ¿haces deporte?"], ["a19#3", "e", "Anar: nosaltres anem (regular a partir de la raíz an-). Ojo: «anem» también se usa como imperativo: Anem! (¡vamos!)."], ["a19#4", "e", "Fer: ells fan. 3.ª plural = fan. Compáralo con fa (él/ella)."], ["a19#5", "e", "Voler: vull, vols, vol, volem, voleu, volen. 1.ª persona = «vull» (irregular). «Vull un cafè» = quiero un café."], ["a19#6", "e", "Poder: puc, pots, pot, podem, podeu, poden. Tu → pots. Con infinitivo: pots venir?"], ["a19#7", "e", "Poder: podeu (vosaltres). Pregunta cortés: «Podeu parlar més a poc a poc?»"], ["a19#8", "e", "Para quedar con alguien: «On quedem?» (¿dónde quedamos?). Quedar = citarse. «Quedem a les set» = quedamos a las siete."], ["a19#9", "e", "Para rechazar con educación: «Ho sento, no puc.» (lo siento, no puedo). «Sí, i tant!» es aceptar con entusiasmo; «Anem!» es proponer ir."], ["a19#10", "h", "Voler, 1.ª persona. Termina en -ll."], ["a19#10", "e", "Voler: jo vull (irregular). No es «voli»."], ["a19#11", "h", "Fer, nosotros. Termina en -m."], ["a19#11", "e", "Fer: nosaltres fem. Fer es irregular: faig, fas, fa, fem, feu, fan. «Fem la compra» = hacemos la compra."], ["a19#12", "h", "Anar, 3.ª persona del singular. Dos letras."], ["a19#12", "e", "Anar: ella va. Fíjate en que es corto: «va». «Va a l'escola» = va a la escuela."], ["a19#13", "t", "Poder + infinitivo. «Puc entrar?» = ¿puedo entrar? El pronombre «jo» no hace falta."], ["a19#14", "t", "Voler: nosaltres volem. «Volem un cafè» = queremos un café."], ["a110#1", "e", "«Quant costa?» = ¿cuánto cuesta? Quant = cuánto (cantidad o precio). No confundir con «quan» (cuándo) ni «quin» (qué/cuál)."], ["a110#2", "e", "Del 100 al 199 es «cent» + resto. No lleva «i» entre centenas y decenas: cent vint-i-cinc. El «i» solo aparece en vint-i-."], ["a110#3", "e", "Los euros y los céntimos se unen con «amb»: «tres euros amb cinquanta (cèntims)». También se dice «tres cinquanta». Los cèntims suelen omitirse."], ["a110#4", "e", "En frases negativas, «mucho» se dice «gaire»: no tinc gaire temps. En afirmativas se dice «molt»."], ["a110#5", "e", "«Res» = nada. En negativas el verbo lleva «no»: no vull res. Es una doble negación normal en catalán."], ["a110#6", "e", "«Cap» = ninguno/a. Va con nombre singular: no hi ha cap cadira. También sirve como «alguno» en preguntas: Tens cap llibre?"], ["a110#7", "e", "«Una ampolla d'aigua» = una botella de agua. De + vocal → d'. Otras medidas: un paquet de, un litre de, una dotzena d'ous."], ["a110#8", "e", "«El compte» = la cuenta. En un restaurante: «Em porta el compte, si us plau?» «La carta» es el menú; «el menú» es el menú del día."], ["a110#9", "h", "Medio kilo: la unidad de peso empieza por q."], ["a110#9", "e", "Mig quilo = medio kilo. «Mig» (masc.) + nombre. «Mitja» es el femenino (mitja ampolla)."], ["a110#10", "h", "Negación de «nada»: res."], ["a110#10", "e", "«No hi ha res» = no hay nada. Hi ha + res en negativa."], ["a110#11", "h", "Doce unidades: empieza por d."], ["a110#11", "e", "Dotzena = docena. Una dotzena d'ous = una docena de huevos. De + vocal → d'."], ["a110#12", "t", "Doble negación: no + verbo + res. «No vull res» = no quiero nada."], ["a110#13", "t", "Quant costa + aquest/aquesta. «Pa» es masculino → aquest pa. Recuerda: quant = cuánto."], ["a111#1", "e", "Son las dos: «Són les dues». Desde las dos en adelante se usa plural «són les…». Con la una: «És la una»."], ["a111#2", "e", "La una es singular («És la una»). Las demás horas, plural («Són les dues, tres…»). Compáralo: en castellano es igual."], ["a111#3", "e", "El sistema de cuartos: «un quart de tres» = 2:15, o sea, un cuarto de camino hacia las tres. Se cuenta el cuarto de la hora que viene."], ["a111#4", "e", "«Dos quarts de tres» = 2:30. Dos cuartos de camino hacia las tres (media hora). También se dice «les dues i mitja»."], ["a111#5", "e", "«Tres quarts de tres» = 2:45. Tres cuartos de camino hacia las tres. También «les tres menys quart»."], ["a111#6", "e", "Con «cap de setmana» se usa el artículo: el cap de setmana (el fin de semana). Es masculino."], ["a111#7", "e", "Ahir = ayer; avui = hoy; demà = mañana; demà passat = pasado mañana."], ["a111#8", "e", "Dijous es jueves. Juny (junio), octubre y gener (enero) son meses. Los días: dilluns, dimarts, dimecres, dijous, divendres, dissabte, diumenge."], ["a111#9", "h", "Palabra de cuatro letras, empieza por d, lleva tilde grave."], ["a111#9", "e", "Demà = mañana. Otras: ahir (ayer), avui (hoy), demà passat (pasado mañana)."], ["a111#10", "h", "Hoy: cinco letras, empieza por a."], ["a111#10", "e", "Avui = hoy. «Avui és dilluns» = hoy es lunes."], ["a111#11", "h", "La mitad de una hora: cinco letras, empieza por m."], ["a111#11", "e", "«Mitja» = media. «Són les quatre i mitja» = son las cuatro y media (4:30). Con «mig»: «mig dia» = mediodía."], ["a111#12", "t", "Surto = salgo; a les vuit = a las ocho. «A les» + hora en plural; «a la una» para la una."], ["a111#13", "t", "Quina hora és? = ¿qué hora es? Quina concuerda con hora (femenino)."], ["a112#1", "e", "Los verbos pronominales llevan pronombre delante: em llevo (me levanto). Pronombres: em, et, es, ens, us, es. Llevar-se significa levantarse de la cama. Ojo: «llevar» sin pronombre significa quitar."], ["a112#2", "e", "Tu → et lleves. El pronombre concuerda con el sujeto: jo/em, tu/et, ell/es, nosaltres/ens, vosaltres/us, ells/es."], ["a112#3", "e", "Nosaltres → ens dutxem. Se dice «dutxar-se» (ducharse). El pronombre ens va delante del verbo conjugado."], ["a112#4", "e", "Ells → es lleven. El pronombre «es» sirve para él, ella, ellos y ellas. Cuidado con confundir «es lleva» (él) con «es lleven» (ellos)."], ["a112#5", "e", "Las comidas: esmorzar (desayunar o almorzar a media mañana), dinar (comer al mediodía), berenar (merendar), sopar (cenar). «Sopar» = cenar."], ["a112#6", "e", "«Mai» = nunca. Después del verbo lleva «no»: no fumo mai. Delante del verbo no hace falta: mai no fumo. Compáralo con «sempre» (siempre)."], ["a112#7", "e", "«Primer» = primero, antes de nada. Después: «després». Orden temporal: primer, després, més tard, finalment."], ["a112#8", "e", "Para ordenar acciones: Primer esmorzo, després surto. «Primer» abre la secuencia y «després» la continúa. Si no hay «primer», empieza por la primera acción."], ["a112#9", "h", "Pronombre de 1.ª persona + verbo dutxar-se en presente. Dos palabras: «em» + forma de jo."], ["a112#9", "e", "Jo em dutxo. Dutxar-se: em dutxo, et dutxes, es dutxa, ens dutxem, us dutxeu, es dutxen."], ["a112#10", "h", "Pronombre de 2.ª plural (us) + verbo vestir-se en -eu."], ["a112#10", "e", "Vosaltres us vestiu. Vestir-se: em vesteixo, et vesteixes, es vesteix, ens vestim, us vestiu, es vesteixen. Es incoativo (-eix-) salvo en nosaltres y vosaltres."], ["a112#11", "h", "Dos palabras: «de» + plural de «vegada». Significa «en ocasiones»."], ["a112#11", "e", "«De vegades» = a veces. Compárala con «a vegades» (también válida) y «de tant en tant» (de vez en cuando)."], ["a112#12", "t", "Orden: pronombre + verbo + a les + hora. «Em llevo a les set» = me levanto a las siete."], ["a112#13", "t", "Sopar = cenar. Nosaltres sopem. «A les nou» = a las nueve."], ["a113#1", "e", "«On» = dónde. «On vius?» = ¿dónde vives? Con origen: d'on (de dónde)."], ["a113#2", "e", "«Com» = cómo. «Com et dius?» = ¿cómo te llamas? También «Com estàs?» = ¿cómo estás?"], ["a113#3", "e", "«Quants» = cuántos (masc. plural). Concuerda con el nombre: quants anys, quantes persones. «Quant» es singular (quant temps = cuánto tiempo)."], ["a113#4", "e", "Hora es femenino → quina hora és. «Quin» (masc.) / «quina» (fem.) / «quins» / «quines». Aquí significa «qué hora»."], ["a113#5", "e", "«Per què» (separado, con tilde) es la pregunta ¿por qué? Se pronuncia con acento en «què». «Perquè» (junto) es la respuesta: porque."], ["a113#6", "e", "«Perquè» (junto, sin tilde) = porque, introduce la causa. «No vinc perquè estic malalt» = no vengo porque estoy enfermo."], ["a113#7", "e", "«D'on ets?» = ¿de dónde eres? (origen). Responde con «Sóc de + lugar». «Visc a Barcelona» responde a «On vius?»."], ["a113#8", "e", "Número es masculino → quin número. Pero «Què és el teu número?» no es correcto aquí. Quin/quina pregunta por un nombre concreto."], ["a113#9", "h", "Pronombre interrogativo para cosas: tres letras, con tilde grave."], ["a113#9", "e", "«Què» = qué. «Què és això?» = ¿qué es esto?"], ["a113#10", "h", "Palabra que pregunta por el tiempo (cuándo): cuatro letras."], ["a113#10", "e", "«Quan» = cuándo. «Quan arribes?» = ¿cuándo llegas? No confundir con «quant» (cuánto)."], ["a113#11", "h", "Preposición contraída: de + dónde → d'___."], ["a113#11", "e", "D'on = de dónde. Se apostrofa: d'on. «D'on ets?» = ¿de dónde eres?"], ["a113#12", "t", "Com et dius? = ¿cómo te llamas? Orden: com + pronombre + verbo."], ["a113#13", "t", "Quants anys tens? = ¿cuántos años tienes? Se pregunta con tenir (tens), no con ser."], ["a114#1", "e", "«També» = también (afirmativo). Si alguien dice algo afirmativo y estás de acuerdo: «Jo també». Si es negativo: «Jo tampoc»."], ["a114#2", "e", "«Tampoc» = tampoco. Se usa para estar de acuerdo con algo negativo: «Jo tampoc»."], ["a114#3", "e", "«No… res» = nada. «No veig res» = no veo nada. En catalán la doble negación es normal."], ["a114#4", "e", "«No… ningú» = nadie. «No hi ha ningú» = no hay nadie. Con verbos en singular."], ["a114#5", "e", "«No… mai» = nunca. Con el pretérito perfecto (he anat) la negación va delante del verbo auxiliar: no he anat mai."], ["a114#6", "e", "«Cap» = ninguno/a. Va con nombre singular: no tinc cap idea. Compáralo con «gens» (nada de) que se usa con incontables: no tinc gens de temps."], ["a114#7", "e", "«Però» = pero. Introduce contraste. «Perquè» = porque, «doncs» = pues, «i» = y."], ["a114#8", "e", "La respuesta a «Plou, així que no…» es el verbo conjugado: «surto» (1.ª persona). No lleva infinitivo ni participio."], ["a114#9", "h", "Palabra de seis letras. Empieza por t."], ["a114#9", "e", "«A mi tampoc» = a mí tampoco. Para verbos como agradar. Con otros verbos: «Jo tampoc»."], ["a114#10", "h", "Una sola palabra de dos letras."], ["a114#10", "e", "«No ho sé» = no lo sé. La negación va justo antes del verbo (con el pronombre «ho» en medio)."], ["a114#11", "h", "Una letra. Es la conjunción «y»."], ["a114#11", "e", "«I tant!» = ¡y tanto!, ¡claro que sí! Respuesta enfática afirmativa."], ["a114#12", "t", "No + tenir + sustantivo: «No tinc cotxe». Sin artículo, como en castellano."], ["a114#13", "t", "Doble negación: no + verbo + mai. «No menjo mai carn» = nunca como carne. «Carn» = carne."], ["a115#1", "e", "Haver de + infinitivo expresa obligación. He de, has de, ha de, hem de, heu de, han de. Jo he de treballar = tengo que trabajar. Evita «tinc que»."], ["a115#2", "e", "Has de + infinitivo. «Has de descansar» = tienes que descansar."], ["a115#3", "e", "Hem de + infinitivo. «Hem de marxar» = tenemos que irnos."], ["a115#4", "e", "«Cal» expresa necesidad impersonal: «Cal portar el passaport» = hay que llevar el pasaporte. Es invariable. Plural: «Calen» solo si el sujeto es plural, pero «cal» es lo habitual."], ["a115#5", "e", "«Es pot» = se puede. Construcción impersonal con es + 3.ª persona. «Es pot fumar aquí?» = ¿se puede fumar aquí?"], ["a115#6", "e", "«Cal que» + subjuntivo (A2). «No cal que vinguis» = no hace falta que vengas. Subjuntivo de venir: vingui, vinguis, vingui, vinguem, vingueu, vinguin."], ["a115#7", "e", "Deure + infinitivo = suposición. «Deu ser tard» = debe de ser tarde. No confundir con «haver de» (obligación)."], ["a115#8", "e", "Para pedir permiso: «Puc entrar?» (¿puedo entrar?). Con «poder» en 1.ª persona. «Pot entrar?» sería «¿puede entrar usted?»; no es lo mismo."], ["a115#9", "h", "Haver de, 1.ª persona: dos palabras, la primera tiene dos letras."], ["a115#9", "e", "Jo he de estudiar. Haver de: he de, has de, ha de, hem de, heu de, han de."], ["a115#10", "h", "Verbo impersonal de necesidad: tres letras."], ["a115#10", "e", "«Cal» = hay que. «Cal pagar abans de sortir» = hay que pagar antes de salir."], ["a115#11", "h", "Haver de, 2.ª plural: heu + de."], ["a115#11", "e", "Vosaltres heu de venir. Haver de: heu de para «vosaltres»."], ["a115#12", "t", "He de + infinitivo = tengo que + infinitivo. «He de treballar»."], ["a115#13", "t", "Cal + infinitivo = hay que + infinitivo. «Abans de» + infinitivo = antes de."], ["a116#1", "e", "Para el dolor se usa «fer mal» con pronombre: em fa mal el cap (me duele la cabeza). El verbo concuerda con lo que duele, no con quien lo siente: cap (singular) → fa."], ["a116#2", "e", "«Em fan mal els peus»: peus es plural → fan. El pronombre (em, et, li, ens, us, els) dice a quién le duele; el verbo concuerda con la parte del cuerpo."], ["a116#3", "e", "«Li fa mal l'esquena»: li = a él/ella/usted. L'esquena es singular → fa. Fíjate: «mal» no cambia."], ["a116#4", "e", "Nas termina en -s, así que el plural lleva -os: nassos (con ss para mantener el sonido /s/). Como autobús → autobusos."], ["a116#5", "e", "«Tinc febre» = tengo fiebre. Para enfermedades se usa tenir: tinc grip, tinc tos, tinc febre. «Dolor» existe, pero se dice «mal» o «dolor» solo en contextos médicos."], ["a116#6", "e", "Estar + estado: estic malalt (estoy enfermo). Tenir + enfermedad: tinc grip. Ser + característica: sóc alt. No mezclar: «tinc malalt» es incorrecto."], ["a116#7", "e", "«Com et trobes?» = ¿cómo te encuentras? (de salud). Trobar-se: em trobo, et trobes, es troba, ens trobem, us trobeu, es troben."], ["a116#8", "e", "El 112 es el número único de emergencias en la UE (en Catalunya y en toda España). Otros: 061 sanitario, 091 policía nacional, 092 policía local."], ["a116#9", "h", "Fer, 3.ª plural (las piernas son plurales). Tres letras."], ["a116#9", "e", "Em fan mal les cames (me duelen las piernas). Cames es plural → fan. «Cama» = pierna; «peu» = pie."], ["a116#10", "h", "Con artículo l': la palabra empieza por vocal."], ["a116#10", "e", "L'esquena = la espalda. Se apostrofa: l'esquena (la + e → l'e)."], ["a116#11", "h", "Palabra de tres letras, significa «dolor» o «malo»."], ["a116#11", "e", "«Tinc mal de cap» = tengo dolor de cabeza. Otra forma: «Em fa mal el cap». Las dos son correctas."], ["a116#12", "t", "Em fa mal + parte del cuerpo en singular. «El cap» = la cabeza."], ["a116#13", "t", "Tenir + enfermedad: «Tinc febre». Sin artículo."], ["a117#1", "e", "Agradar concuerda con lo que gusta: el cafè (singular) → m'agrada. El pronombre es el CI: m' (a mí). «A mi» se pone solo para enfatizar."], ["a117#2", "e", "«Ens agraden els gats»: els gats es plural → agraden. El verbo concuerda con lo que gusta, no con quien siente."], ["a117#3", "e", "«A ell li agrada la carn»: la carn es singular y el CI de 3.ª es «li». «A ell» es énfasis y puede omitirse."], ["a117#4", "e", "Con infinitivo el verbo es singular: «Els agrada viatjar». «Els» = a ellos/ellas. Aunque haya varias cosas (viatjar i llegir), el verbo sigue en singular."], ["a117#5", "e", "Para coincidir con una frase afirmativa: «A mi també» (a mí también). Si el verbo no es agradar, se dice «Jo també»."], ["a117#6", "e", "Para coincidir con una frase negativa: «A mi tampoc». Si fuera afirmativa: «a mi també»."], ["a117#7", "e", "«T'agraden els gelats»: els gelats (plural) → agraden. «T'» es el CI de «tu»."], ["a117#8", "e", "«M'encanta» = me encanta. Funciona como agradar: m'encanta (singular), m'encanten (plural). Es más fuerte que «m'agrada»."], ["a117#9", "h", "Pronombre CI de 2.ª persona, apostrofado: una letra + apóstrofo."], ["a117#9", "e", "«T'agrada llegir?» = ¿te gusta leer? El pronombre «te» se apostrofa ante vocal: t'."], ["a117#10", "h", "Pronombre CI de 1.ª plural: tres letras."], ["a117#10", "e", "«Ens agraden els cotxes» = nos gustan los coches. «Ens» no se apostrofa ante vocal."], ["a117#11", "h", "Pronombre CI de 1.ª singular, apostrofado."], ["a117#11", "e", "«M'encanta la música» = me encanta la música. «M'» es la forma apostrofada de «em»."], ["a117#12", "t", "Agradar + sujeto. «M'agrada el cinema» = me gusta el cine. El verbo va en singular."], ["a117#13", "t", "No + li agrada. La negación va antes de «li». «No li agrada la carn» = no le gusta la carne."], ["a118#1", "e", "Imperativo de «tu» en verbos en -ar: sin -s, como la 3.ª persona del presente: gira (gira). Para el negativo se usa subjuntivo: no giris."], ["a118#2", "e", "Imperativo de «vostè»: usa el subjuntivo, terminación -i: giri. «Giri a la dreta» = gire a la derecha (usted)."], ["a118#3", "e", "Imperativo de «vosaltres»: igual que el presente de vosaltres: continueu. «Continueu recte» = seguid recto."], ["a118#4", "e", "«Tot recte» = todo recto. «Recte» es un adjetivo/adverbio. «Dret» y «dreta» significan derecho/derecha (lado), no «recto»."], ["a118#5", "e", "«A l'esquerra» = a la izquierda. L'esquerra es el artículo apostrofado + esquerra. «A la dreta» es la derecha."], ["a118#6", "e", "Después de «a» hace falta un número en cifra o palabra: «a cinc minuts a peu». Cinc (cinco). «Cinquè» es ordinal."], ["a118#7", "e", "«Perdoni, on és l'estació?» = disculpe, ¿dónde está la estación? «Perdoni» es la forma de cortesía."], ["a118#8", "e", "Agafar el tren, el metro, l'autobús = coger/tomar el transporte. «Agafar» significa coger. «Donar» (dar), «tenir» (tener), «conèixer» (conocer) no sirven."], ["a118#9", "h", "Imperativo de tu de un verbo en -ar: quita la -r."], ["a118#9", "e", "Baixar → baixa (tu). «Baixa per aquesta escala» = baja por esta escalera."], ["a118#10", "h", "Imperativo de vostè: -ar → -i."], ["a118#10", "e", "Pujar → pugi (vostè). Cambio ortográfico: j → g ante i (pujar, pugi). «Pugi per l'escala» = suba por la escalera."], ["a118#11", "h", "Adjetivo que significa «recto». Cinco letras."], ["a118#11", "e", "«Tot recte» = todo recto. Se usa al dar direcciones: «Continuï tot recte»."], ["a118#12", "t", "Gira = imperativo de tu. «A la dreta» = a la derecha. Orden: verbo + a + la + dreta."], ["a118#13", "t", "On és + lugar con artículo: «On és el banc?» Verbo «és» porque es un lugar determinado."], ["a119#1", "e", "«Vostè» es la forma de cortesía (usted). Se usa con desconocidos mayores, en atención al público o en contextos formales. En Catalunya el «tu» es muy extendido; ante la duda, vostè."], ["a119#2", "e", "Con «tu»: «Com et dius?» El pronombre es «et». Con vostè: «Com es diu?»."], ["a119#3", "e", "Con «vostè» se usa la 3.ª persona: «Com es diu?» (¿cómo se llama usted?). El pronombre es «es»."], ["a119#4", "e", "«Vol un cafè?» es formal: «vol» es 3.ª persona, así que es «¿quiere usted un café?». En informal sería «Vols un cafè?»."], ["a119#5", "e", "«Us presento en Pol» = os presento a Pol. El pronombre «us» es el CI de «vosaltres». «Presento» es la 1.ª persona."], ["a119#6", "e", "La respuesta natural a «Molt de gust» es «Igualment» (igualmente) o «Encantat/da». «Fins demà» no encaja."], ["a119#7", "e", "Portar = llevar puesto: «Porta ulleres» = lleva gafas. Para descripciones físicas se usa «portar» + prenda."], ["a119#8", "e", "«M'està gran» = me queda grande. Para sentar bien: «m'està bé», «m'està petit». Estar + gran/petit/bé/malament."], ["a119#9", "h", "Pronombre de 2.ª persona del singular. Dos letras."], ["a119#9", "e", "«Com et dius?» (informal). Fíjate: «et» = te. Con vostè: «Com es diu?»."], ["a119#10", "h", "Persona que trabaja contigo: seis letras."], ["a119#10", "e", "«Company de feina» = compañero de trabajo. «Company» (m.) / «companya» (f.). «Feina» = trabajo."], ["a119#11", "h", "Tamaño de la ropa: cinco letras."], ["a119#11", "e", "«Talla» = talla. «Quina talla porteu?» = ¿qué talla usáis/usan? Es una pregunta habitual en tiendas."], ["a119#12", "t", "Et presento + persona (CD, sin «a»). «Et presento la meva amiga» = te presento a mi amiga. Fíjate: en catalán no hay «a» personal."], ["a119#13", "t", "«Molt de gust» = mucho gusto. Es una fórmula fija al conocer a alguien."], ["a120#1", "e", "Con profesiones, el catalán no lleva artículo después de «ser»: sóc infermera (soy enfermera). Solo se pone artículo si hay adjetivo: sóc una bona infermera."], ["a120#2", "e", "Los nombres en -er hacen el femenino en -era: cambrer → cambrera, infermer → infermera, perruquer → perruquera. Otros: mestre → mestra, metge → metgessa."], ["a120#3", "e", "«De… a…» indica el rango de horas o días: treballo de nou a cinc (trabajo de nueve a cinco). También: de dilluns a divendres."], ["a120#4", "e", "Para días: «de dilluns a divendres» (de lunes a viernes). Se usa «de… a…» en rangos de tiempo."], ["a120#5", "e", "«Al dia» = al día (a + el dia). «Faig vuit hores al dia» = hago ocho horas al día. Frecuencia: al dia, a la setmana, al mes, a l'any."], ["a120#6", "e", "«Busco feina» = busco trabajo. «Feina» = trabajo (tarea); «treball» es trabajo en sentido abstracto o laboral. «Feines» es plural."], ["a120#7", "e", "Experiència se escribe con acento grave en la e. En castellano, «experiencia» no lleva tilde: en catalán sí (-ència). Es una diferencia ortográfica general: -ència, -ància."], ["a120#8", "e", "Atendre (atender): atenc, atens, atén, atenem, ateneu, atenen. Es irregular en la 1.ª persona (atenc). Participio: atès."], ["a120#9", "h", "Femenino de «mestre»: cambia la -e final por -a."], ["a120#9", "e", "Mestre → mestra. Nombres en -e que designan personas: mestre/mestra, company/companya (pero «jove» es igual)."], ["a120#10", "h", "Con artículo apostrofado: l' + nombre femenino que empieza por vocal."], ["a120#10", "e", "L'oferta de feina = la oferta de trabajo. La + o → l'o."], ["a120#11", "h", "Ocho letras, empieza por h. Significa «horario»."], ["a120#11", "e", "«L'horari» = el horario. Cuidado: se escribe con h inicial (muda) y con una sola r."], ["a120#12", "t", "Treballar en + lugar. «Treballo en una escola» = trabajo en una escuela. También se dice «a una escola»."], ["a120#13", "t", "Sin artículo después de ser. «Sóc infermera»."], ["a121#1", "e", "El pretérito perfecto: haver (he, has, ha, hem, heu, han) + participio. «He parlat» = he hablado."], ["a121#2", "e", "Nosaltres + hem + participio. «Hem menjat» = hemos comido. Compáralo con «heu» (vosaltres)."], ["a121#3", "e", "Vosaltres + heu + participio. «Heu arribat?» = ¿habéis llegado?"], ["a121#4", "e", "Participio de verbos en -ar: -at. Parlar → parlat, treballar → treballat. Es el más regular."], ["a121#5", "e", "Participio de verbos en -ir: -it. Dormir → dormit, sortir → sortit. Algunos son irregulares: obrir → obert."], ["a121#6", "e", "Participio de verbos en -re: -ut. Perdre → perdut, rebre → rebut. Algunos son irregulares: fer → fet, dir → dit."], ["a121#7", "e", "Con «avui» (hoy) se usa el perfecto: avui he treballat. El periodo incluye el presente. El tiempo cerrado (ayer) pide el perifràstic."], ["a121#8", "e", "«Ja» + perfecto = ya. «Ja he menjat» = ya he comido. Si no ha ocurrido: «encara no»."], ["a121#9", "e", "«Encara no» = todavía no. «Encara no he sopat» = todavía no he cenado. «Ja» = ya, «mai» = nunca."], ["a121#10", "h", "Participio de cantar: cant + -at."], ["a121#10", "e", "Cantar → cantat. «Has cantat bé!»"], ["a121#11", "h", "Participio de sortir: sort + -it."], ["a121#11", "e", "Sortir → sortit. «Ha sortit amb els amics» = ha salido con los amigos."], ["a121#12", "t", "Avui + he + participio. «Avui he treballat molt» = hoy he trabajado mucho."], ["a121#13", "t", "No + he + participio. La negación va antes de «he». «No he menjat»."], ["a122#1", "e", "Fer → fet (irregular). «He fet els deures» = he hecho los deberes. Fet = hecho. Se parece al castellano «hecho»."], ["a122#2", "e", "Dir → dit (irregular). «He dit la veritat» = he dicho la verdad."], ["a122#3", "e", "Veure → vist (irregular). «He vist la pel·lícula» = he visto la película."], ["a122#4", "e", "Escriure → escrit (irregular). «He escrit una carta»."], ["a122#5", "e", "Obrir → obert (irregular). «He obert la porta» = he abierto la puerta."], ["a122#6", "e", "Ser y estar comparten el participio «estat». También existe «sigut» (solo de ser), pero «estat» es la forma estándar. «He estat a Londres» = he estado en Londres."], ["a122#7", "e", "«Ja has menjat?» = ¿ya has comido? «Ja» pregunta si algo ya pasó."], ["a122#8", "e", "«Encara no» = todavía no. «Encara no he vist la pel·lícula» = todavía no he visto la película."], ["a122#9", "e", "Fa + tiempo + que + presente: «Fa dos anys que visc aquí» = hace dos años que vivo aquí. «Fa» sin «que»: «Va arribar fa dos dies»."], ["a122#10", "h", "Participio de fer: tres letras, empieza por f."], ["a122#10", "e", "He fet els deures. «Deures» = deberes (tarea)."], ["a122#11", "h", "Participio de veure: cuatro letras."], ["a122#11", "e", "Has vist la pel·lícula? «Vist» es el participio irregular de veure."], ["a122#12", "t", "He + fet. «He fet els deures»."], ["a122#13", "t", "Fa + dos anys + que + presente. «Fa dos anys que visc aquí»."], ["a123#1", "e", "El 23 de abril es Sant Jordi (Sant Jordi): se regala una rosa y un libro. Las castanyes son de la castanyada (1 de noviembre), el tió de Navidad y la mona de Pascua."], ["a123#2", "e", "En la castanyada (1 de noviembre) se comen panellets (dulces de almendra) y castañas. Neules son de Navidad, la mona de Pascua y la coca de Sant Joan."], ["a123#3", "e", "«Per molts anys!» = ¡feliz cumpleaños! (literalmente «por muchos años»). Se canta o se dice en cumpleaños y celebraciones."], ["a123#4", "e", "a + el = al (contracción): vaig al mercat. Con la, les, l' no se contrae."], ["a123#5", "e", "de + el = del: el llibre del Pere. La contracción es obligatoria."], ["a123#6", "e", "per + el = pel: passem pel parc. Se contrae. Plural: per + els = pels."], ["a123#7", "e", "a + els = als: parlo als meus amics. «Als» = a los."], ["a123#8", "e", "«Salut!» se dice al brindar. «Bon profit!» (que aproveche) al comer. «Bon viatge!» al viajar. «Per molts anys!» en cumpleaños."], ["a123#9", "h", "Forma corta de «bo» ante nombre masculino: tres letras."], ["a123#9", "e", "«Bon viatge!» = ¡buen viaje! «Bon» es la forma apocopada de bo ante nombre masculino."], ["a123#10", "h", "De + el se contrae en una palabra de tres letras."], ["a123#10", "e", "de + el = del. Con otros artículos no hay contracción: de la, de l', de les."], ["a123#11", "h", "Antes de «profit»: adjetivo apocopado, tres letras."], ["a123#11", "e", "«Bon profit!» = ¡que aproveche! Se dice antes de comer."], ["a123#12", "t", "Per molts anys = feliz cumpleaños. Fórmula fija: se dice también al cantar."], ["a123#13", "t", "Vaig + al (a + el) + cinema. «Vaig al cinema» = voy al cine."], ["a124#1", "e", "Para deportes de juego se usa «jugar a»: jugo a futbol, jugo a bàsquet. No se usa «de» ni «en». Para instrumentos, «tocar» (toco la guitarra)."], ["a124#2", "e", "Con instrumentos se usa el verbo «tocar» + artículo: toco la guitarra, toco el piano. En catalán, no se usa «jugar» con instrumentos."], ["a124#3", "e", "«Fer natació» = hacer natación. Con deportes individuales se usa «fer»: fer natació, fer ioga, fer ciclisme. «Nedar» (nadar) es el verbo."], ["a124#4", "e", "Para preguntar por el clima: «Quin temps fa?» (¿qué tiempo hace?). El verbo es «fer», no «ser» ni «haver». Respuesta: «Fa sol», «Fa calor», «Fa fred»."], ["a124#5", "e", "«Plou» = llueve (verbo plourer). También «neva» (nieva). No se dice «fa pluja». Solo «plou»."], ["a124#6", "e", "«Està ennuvolat» = está nublado. Con adjetivos de estado se usa «estar»: està ennuvolat, està plovent. Con sustantivos de clima se usa «fer»: fa sol, fa vent."], ["a124#7", "e", "Ante vocal el artículo singular se apostrofa: l'estiu. «A l'estiu» = en verano. «A la primavera, a la tardor, a l'hivern»."], ["a124#8", "e", "Condición real: si + presente + presente (o futuro). «Si fa sol, anem a la platja.» No se usa futuro después de «si»."], ["a124#9", "h", "Verbo fer + sustantivo de clima en minúscula. Dos palabras."], ["a124#9", "e", "«Fa vent» = hace viento. Fer + sustantivo: fa sol, fa calor, fa fred, fa vent, fa bon temps."], ["a124#10", "h", "Estación del año de seis letras que empieza por t."], ["a124#10", "e", "«Tardor» = otoño. Las estaciones: primavera, estiu, tardor, hivern."], ["a124#11", "h", "Plural masculino de «amic»."], ["a124#11", "e", "«Amics» = amigos. «Surto amb els amics» = salgo con los amigos."], ["a124#12", "t", "Jugar a + deporte. «Jugo a bàsquet» = juego al baloncesto. Se usa «a» sin artículo ante deportes."], ["a124#13", "t", "Avui + fa sol. «Avui» = hoy."], ["a125#1", "e", "Para pedir cita: «Voldria demanar hora». Voldria es el condicional de voler (cortesía). Se dice «demanar hora», no «demanar cita»."], ["a125#2", "e", "«Cognoms» = apellidos (siempre plural). «Nom» = nombre de pila. «Cognom» en singular se usa si solo hay uno."], ["a125#3", "e", "«Data de naixement» = fecha de nacimiento. «Naixement» es el sustantivo. «Naixer» es el verbo."], ["a125#4", "e", "«Número de telèfon» = número de teléfono. En catalán «número» lleva tilde en la u: número. «Em pot donar el seu número?» es la forma formal."], ["a125#5", "e", "«Obrir un compte» = abrir una cuenta (bancaria). Después de «vull» va infinitivo: vull obrir."], ["a125#6", "e", "«Ompli aquest formulari» = rellene este formulario. «Ompli» es el imperativo de vostè (omplir). «Omple» sería la 3.ª persona del presente."], ["a125#7", "e", "El padró (padró municipal) es el registro de habitantes del ayuntamiento. Se necesita para trámites como la tarjeta sanitària. «Empadronar-se» = empadronarse."], ["a125#8", "e", "«Correu electrònic» = correo electrónico. «Correu» = correo. También se dice «mail» informalmente, pero «correu electrònic» es la forma correcta."], ["a125#9", "h", "El nombre de pila es la primera palabra de «Marc Puig»."], ["a125#9", "e", "Nom = nombre de pila: Marc. Cognom = apellido: Puig."], ["a125#10", "h", "Siglas del documento. Tres letras."], ["a125#10", "e", "DNI = Documento Nacional de Identidad. En catalán se escribe igual: DNI. También «NIE» para extranjeros."], ["a125#11", "h", "Verbo que significa «pedir» (cita). Termina en -ar."], ["a125#11", "e", "«Voldria demanar hora» = quisiera pedir cita. «Demanar» = pedir."], ["a125#12", "t", "Voldria + infinitivo. Es la forma de cortesía más habitual."], ["a125#13", "t", "Necessitar + objeto. «Necessito el certificat» = necesito el certificado."], ["a126#1", "e", "Obligación: he d'anar (tengo que ir). «Tinc que» es un calco del castellano; «haig d'anar» es una forma arcaica; la forma estándar es «he d'anar»."], ["a126#2", "e", "El verbo concuerda con lo que gusta: els gats (plural) → m'agraden. «M'agrada els gats» no concuerda."], ["a126#3", "e", "Fa + tiempo + que + presente: «Fa tres anys que visc aquí». «Porto… vivint» es calco castellano; «des tres anys» es incorrecto."], ["a126#4", "e", "«Quina hora és?» Hora es femenino, y quina es el interrogativo. «Què hora és» es un calco."], ["a126#5", "e", "El posesivo concuerda con lo poseído: «la meva mare» (mare = femenino). «El meva» y «la meu» están mal."], ["a126#6", "e", "Perfecto: he + participio. «He menjat» = he comido. «Vaig menjar» es perifràstic."], ["a126#7", "e", "Avui + perfecto: ha plogut. «Va ploure» sería perifràstic, para ayer."], ["a126#8", "e", "«Voldria un cafè» = quisiera un café. Es más cortés que «vull» o una orden."], ["a126#9", "h", "Verbo ser, 1.ª persona. Cuatro letras con tilde."], ["a126#9", "e", "Jo sóc de Girona. «Sóc» es la 1.ª persona de ser."], ["a126#10", "h", "Tercera persona singular de anar: dos letras."], ["a126#10", "e", "Anar: ell/ella va. Va, vas, va, anem, aneu, van."], ["a126#11", "h", "Participio irregular de veure: cuatro letras."], ["a126#11", "e", "Veure → vist. «He vist» = he visto."], ["a126#12", "t", "He de + infinitivo. «Dissabte» sin artículo = el sábado (día concreto)."], ["a126#13", "t", "Avui + perfet. «Dinar» = comer al mediodía. «A casa» = en casa."], ["a21#1", "e", "Con «ahir» (ayer) se usa el perifràstic: vaig + infinitivo. «Ahir vaig treballar fins tard.» No se usa «he»."], ["a21#2", "e", "Perifràstic de anar: vaig, vas, va, vam, vau, van. Tu → vas. «Vas anar al cinema?» = ¿fuiste al cine?"], ["a21#3", "e", "Nosaltres → vam. «Vam viatjar a Roma» = viajamos a Roma. Ojo: «vam» (nosotros) vs «van» (ellos)."], ["a21#4", "e", "Ells → van. «Van arribar tard» = llegaron tarde. Compáralo con «va» (él)."], ["a21#5", "e", "Con «l'any passat» (el año pasado) se usa el perifràstic: vam + infinitivo. Es un tiempo cerrado."], ["a21#6", "e", "Perifràstic: vaig + infinitivo. «Vaig dinar a casa» = comí en casa. «Ahir he dinat» no es correcto porque ayer ya acabó."], ["a21#7", "e", "Perifràstic de un verbo pronominal: es van casar. «Fa tres anys» es una marca de tiempo cerrada."], ["a21#8", "e", "En «vaig menjar», el auxiliar es anar. Aquí «vaig» no significa «voy», sino que forma el pasado."], ["a21#9", "h", "Perifràstic de «vosaltres»: tres letras."], ["a21#9", "e", "Vosaltres vau + infinitivo. «Vau arribar a les nou» = llegasteis a las nueve."], ["a21#10", "h", "Perifràstic de «jo»: cinco letras."], ["a21#10", "e", "Em vaig llevar a les set = me levanté a las siete. El pronombre va delante del auxiliar."], ["a21#11", "h", "Perifràstic de «ella»: dos letras."], ["a21#11", "e", "Ella va cantar = ella cantó. Va + infinitivo."], ["a21#12", "t", "Ahir + vaig + infinitivo. «Ahir vaig dinar a casa»."], ["a21#13", "t", "Vam + infinitivo. «Néixer» = nacer."], ["a22#1", "e", "«Aquest matí» incluye el presente (la mañana de hoy), así que va con perfecto: he anat. El criterio es si el periodo en el que ocurrió sigue abierto."], ["a22#2", "e", "«Ahir» (ayer) es un tiempo cerrado → perifràstic: vaig + infinitivo. «Ahir vaig anar a treballar»."], ["a22#3", "e", "«Aquest any» incluye el presente → perfecto: he viatjat. Si el año hubiera acabado se usaría el perifràstic."], ["a22#4", "e", "«L'any passat» es un periodo cerrado → perifràstic: vaig viatjar. El adverbio marca el tiempo."], ["a22#5", "e", "«Avui» incluye el presente → perfecto: avui no he dormit gaire. «Gaire» se usa en frases negativas (no… gaire)."], ["a22#6", "e", "«Mai» (alguna vez, nunca) con perfecto: Has viatjat mai a Itàlia? Si la respuesta da una fecha concreta se pasa al perifràstic: «Sí, hi vaig anar el 2020»."], ["a22#7", "e", "Perifràstic: vaig + infinitivo. «Vaig veure una pel·lícula» = vi una película. No se usa participio con «vaig»."], ["a22#8", "e", "Perfecto: hem + participio. «Hem vist en Pau» = hemos visto a Pau. Participio de veure: vist (irregular)."], ["a22#9", "h", "Participio irregular de fer. Tres letras."], ["a22#9", "e", "He fet. Fer → fet. «Fet els deures» = hecho los deberes."], ["a22#10", "h", "Con «vaig» se usa el infinitivo de dir. Tres letras."], ["a22#10", "e", "Vaig dir. Dir en infinitivo. «Vaig dir la veritat» = dije la verdad."], ["a22#11", "h", "Participio de anar: an + -at."], ["a22#11", "e", "Hem anat. Anar → anat. «Aquest estiu hem anat a la platja» (el verano sigue siendo «actual»)."], ["a22#12", "t", "Avui + he + participio. «En Pau» lleva el artículo personal: en. «He vist en Pau»."], ["a22#13", "t", "Ahir + vaig + infinitivo. «Vaig veure» = vi."], ["a23#1", "e", "Imperfet de -ar: -ava, -aves, -ava, -àvem, -àveu, -aven. Jo parlava = yo hablaba. Los demás verbos: -ia, -ies, -ia, -íem, -íeu, -ien."], ["a23#2", "e", "Imperfet de beure: bevia, bevies, bevia, bevíem, bevíeu, bevien. Con nosaltres: -íem (con tilde)."], ["a23#3", "e", "Imperfet de dormir: dormia, dormies, dormia, dormíem, dormíeu, dormien. Ells: -ien."], ["a23#4", "e", "Imperfet de ser: era, eres, era, érem, éreu, eren. Jo → era. «Quan era petit…» = cuando era pequeño."], ["a23#5", "e", "Imperfet de fer: feia, feies, feia, fèiem, fèieu, feien. Ell → feia. Es irregular porque la raíz es «fe-»."], ["a23#6", "e", "Imperfet de veure: veia, veies, veia, vèiem, vèieu, veien. Nosaltres → vèiem (con accento grave)."], ["a23#7", "e", "«Hi havia» = había. Imperfet de haver-hi. Hi havia + singular o plural. «Hi havia molta gent»."], ["a23#8", "e", "Hábito repetido en el pasado → imperfet. «Jugàvem al carrer» = jugábamos en la calle. Si fuera un evento único, perifràstic."], ["a23#9", "e", "Descripción de fondo (clima) → imperfet. «Plovia i feia vent quan vaig sortir.» El evento (vaig sortir) va en perifràstic."], ["a23#10", "e", "Un evento puntual que interrumpe → perifràstic. «Estava cuinant quan va sonar el telèfon.» Imperfet para la acción en curso, perifràstic para la interrupción."], ["a23#11", "h", "Imperfet de tenir (jo): terminación -ia."], ["a23#11", "e", "Tenia = yo tenía. Tenir: tenia, tenies, tenia, teníem, teníeu, tenien."], ["a23#12", "h", "Imperfet de anar (nosaltres): anàvem."], ["a23#12", "e", "Anàvem = íbamos. Anar: anava, anaves, anava, anàvem, anàveu, anaven. Con tilde en nosaltres."], ["a23#13", "t", "Era + vivia. «Quan era petit vivia a Girona» = cuando era pequeño vivía en Girona."], ["a23#14", "t", "Fondo = imperfet. «Feia fred i plovia» = hacía frío y llovía."], ["a24#1", "e", "Plusquamperfet: havia + participio. «Quan vaig arribar, ell ja havia marxat» = cuando llegué, él ya se había ido. Indica algo anterior a otra acción pasada."], ["a24#2", "e", "Havies + participio. «Havies menjat» = habías comido. Havia, havies, havia, havíem, havíeu, havien."], ["a24#3", "e", "«Havia vist» = había visto. «No havia vist mai el mar»."], ["a24#4", "e", "«De sobte» = de repente. Marca un evento inesperado. Otras: «de cop» (de golpe)."], ["a24#5", "e", "«Digué» es el passat simple de dir (= va dir). Es un tiempo literario en el Principat; en lo oral se usa el perifràstic."], ["a24#6", "e", "«Primer» = primero. «Primer vam dinar i després vam passejar». «Després» = luego."], ["a24#7", "e", "Imperfet para la descripción de fondo: feia sol. «Va fer» sería un evento puntual."], ["a24#8", "e", "Fondo en imperfet, evento en perifràstic: «Plovia i vaig sortir». El imperfet describe la situación y el perifràstic el hecho."], ["a24#9", "h", "Participio de acabar: acab + -at."], ["a24#9", "e", "Havíem acabat = habíamos acabado. «Havíem acabat el treball»."], ["a24#10", "h", "Plusquamperfet, 3.ª plural: havien. Cinco letras."], ["a24#10", "e", "Havien marxat = habían marchado. «Quan va arribar, ja havien marxat»."], ["a24#11", "h", "Preposición de dos letras que va antes de «sobte»."], ["a24#11", "e", "«De sobte» = de repente. Preposición «de» + sobte."], ["a24#12", "t", "Perifràstic + plusquamperfet. «Quan vaig arribar, ja havia marxat»."], ["a24#13", "t", "Primer vam dinar i després vam passejar. «Passejar» = pasear."], ["a25#1", "e", "El futuro se forma con el infinitivo + terminaciones: -é, -às, -à, -em, -eu, -an. Parlar → parlaré. Hablaré."], ["a25#2", "e", "Beure → beuré, beuràs, beurà, beurem, beureu, beuran. Se pierde la -e final del infinitivo."], ["a25#3", "e", "Tenir → tindré, tindràs, tindrà, tindrem, tindreu, tindran. Raíz irregular tindr-."], ["a25#4", "e", "Venir → vindré, vindràs, vindrà, vindrem, vindreu, vindran. Raíz irregular vindr-."], ["a25#5", "e", "Poder → podré, podràs, podrà, podrem, podreu, podran. Raíz irregular podr-."], ["a25#6", "e", "Fer → faré, faràs, farà, farem, fareu, faran. Raíz irregular far-. Vosaltres → fareu."], ["a25#7", "e", "Anar → aniré, aniràs, anirà, anirem, anireu, aniran. Es regular: infinitivo + -é. No confundir con el perifràstic «vaig anar»."], ["a25#8", "e", "Condición real: si + presente + futuro. «Si plou, no sortiré». Nunca futuro después de «si»."], ["a25#9", "h", "Ser + -às. Seràs."], ["a25#9", "e", "Ser → seré, seràs, serà, serem, sereu, seran. Regular."], ["a25#10", "h", "Dir + -é. Una sola palabra."], ["a25#10", "e", "Dir → diré, diràs, dirà, direm, direu, diran. Regular: infinitivo + terminaciones."], ["a25#11", "h", "Raíz irregular sabr- + -em."], ["a25#11", "e", "Saber → sabré, sabràs, sabrà, sabrem, sabreu, sabran. Raíz irregular sabr-."], ["a25#12", "t", "Vindré = vendré. Raíz irregular vindr-. «Casa teva» = tu casa."], ["a25#13", "t", "Faré = haré. Fer tiene raíz irregular far-. «El sopar» = la cena."], ["a216#10", "e", "«Digues» = di (imperativo de tu de dir, irregular). «Digues-m'ho» = dímelo; «digues-li» = dile. Con pronombres se une con guion."], ["a26#1", "e", "Gerundi: infinitivo sin -r + -nt para -ar: parlar → parlant. En -er/-re/-ir: -ent/-int. Estic parlant = estoy hablando."], ["a26#2", "e", "Gerundi de verbos en -ir: -int. Dormir → dormint. Sortir → sortint."], ["a26#3", "e", "Fer → fent (irregular). «Estic fent els deures» = estoy haciendo los deberes. Dir → dient, veure → veient."], ["a26#4", "e", "Estar + gerundi para una acción que ocurre ahora: «Estic estudiant català». Estudiar → estudiant. Con ellos no se usa participio ni infinitivo."], ["a26#5", "e", "«Acabar de» + infinitivo = hacer algo recién: «Acabo de sortir». Se usa «de» con acabar en este sentido."], ["a26#6", "e", "«Començar a» + infinitivo: «Comença a ploure». También se puede usar «començar de» en algunas zonas, pero «a» es lo estándar."], ["a26#7", "e", "«Deixar de» + infinitivo = dejar de hacer algo. «He deixat de fumar». Con la preposición «de»."], ["a26#8", "e", "«Tornar a» + infinitivo = volver a hacer algo. «Torna a trucar» = vuelve a llamar."], ["a26#9", "h", "Gerundi de beure: la raíz es bev- + -ent."], ["a26#9", "e", "Beure → bevent. Estic bevent aigua = estoy bebiendo agua."], ["a26#10", "h", "Infinitivo de viatjar."], ["a26#10", "e", "Pensar + infinitivo = pensar hacer algo. «Penso viatjar a l'estiu»."], ["a26#11", "h", "Infinitivo. Soler + infinitivo."], ["a26#11", "e", "«Soler» + infinitivo = soler hacer. «Sol dinar a les dues» = suele comer a las dos. Soler es defectivo: solo se usa en presente e imperfet."], ["a26#12", "t", "Acabar de + infinitivo. «Acabo d'arribar» (de + a → d'a)."], ["a26#13", "t", "Estar + gerundi. «Estic estudiant català»."], ["a27#1", "e", "El pronombre de CD «el» sustituye a un nombre masculino singular. «Veus el cotxe? Sí, el veig». Va antes del verbo."], ["a27#2", "e", "«La» sustituye a un nombre femenino singular. «Busques la clau? Sí, la busco»."], ["a27#3", "e", "«Els» sustituye a un nombre masculino plural. «Els he comprat» = los he comprado."], ["a27#4", "e", "«Les» sustituye a un nombre femenino plural. «Les miro» = las miro."], ["a27#5", "e", "«En» sustituye a una cantidad o a «de + algo». «Vols pa? Sí, en vull». Siempre se usa en singular, aunque se refiera a cantidades."], ["a27#6", "e", "«Ho» sustituye a una frase completa o a una idea. «Saps que ha vingut? Sí, ho sé»."], ["a27#7", "e", "«En» con cantidad: «Tens germans? Sí, en tinc dos». La cantidad (dos) se pone al final."], ["a27#8", "e", "Ante vocal «el» y «la» se apostrofan: l'he vist (lo/la he visto). Es obligatorio."], ["a27#9", "h", "Pronombre de CD masculino singular: dos letras."], ["a27#9", "e", "«No el miris!» = ¡no lo mires! En el imperativo negativo el pronombre va delante."], ["a27#10", "h", "Pronombre de cantidad: dos letras."], ["a27#10", "e", "«En vull» = quiero un poco. «En» sustituye a «de + sustantivo»."], ["a27#11", "h", "Pronombre neutro: dos letras."], ["a27#11", "e", "«No ho sé» = no lo sé. «Ho» es el pronombre neutro."], ["a27#12", "t", "El + veig. «El veig cada dia» = lo veo cada día. Pronombre antes del verbo."], ["a27#13", "t", "No + ho + sé. «No ho sé» = no lo sé. La negación va antes del pronombre."], ["a28#1", "e", "CI de 3.ª persona singular = «li» (a él, a ella, a usted). «Li dic la veritat» = le digo la verdad. No cambia con el género."], ["a28#2", "e", "CI de 2.ª persona singular = «et». «Et truco cada dia» = te llamo cada día."], ["a28#3", "e", "CI de 3.ª persona plural = «els» (a ellos, a ellas). «Els escrivim sovint» = les escribimos a menudo."], ["a28#4", "e", "«Em sembla bé» = me parece bien. «Semblar» concuerda con lo que parece: sembla (singular), semblen (plural)."], ["a28#5", "e", "CD de 3.ª femenino singular = «la». «Veig la Laia» → «La veig». Se sustituye el complemento directo."], ["a28#6", "e", "«Dic a la Laia» → «Li dic». «Li» sustituye a un CI (a alguien). Sin diferencia de género."], ["a28#7", "e", "CD plural masculino = «els». «Compro els llibres» → «Els compro». Hay que distinguir de CI «els»."], ["a28#8", "e", "CI plural = «els». «Dic als pares» → «Els dic». Mismo pronombre que el CD plural masculino, pero cumple otra función."], ["a28#9", "h", "Verbo agradar en 3.ª persona singular."], ["a28#9", "p", "«M'___ el cinema.» (agradar)"], ["a28#9", "e", "«M'agrada el cinema» = me gusta el cine. El pronombre «em» se apostrofa ante vocal: m'."], ["a28#10", "h", "Infinitivo de decir, tres letras."], ["a28#10", "e", "«Vull dir-li la veritat» = quiero decirle la verdad. El pronombre se une al infinitivo con guion."], ["a28#11", "h", "Pronombre apostrofado unido al imperativo: 'm."], ["a28#11", "e", "«Digue'm» = dime. El imperativo digues + em → digue'm (se pierde la -s)."], ["a28#12", "t", "Li + dono. «Li dono el llibre» = le doy el libro."], ["a28#13", "t", "Em + sembla + bé. «Em sembla bé» = me parece bien."], ["a29#1", "e", "«Hi» sustituye a un complemento de lugar. «Vas a l'escola? Sí, hi vaig» = ¿Vas a la escuela? Sí, voy (allí)."], ["a29#2", "e", "«En» con cantidad. «Tens germans? Sí, en tinc dos». Recuerda que el número se pone al final."], ["a29#3", "e", "«En» también sustituye al origen (de + lugar). «Véns de Girona? Sí, en vinc» = vengo de allí."], ["a29#4", "e", "«N'hi ha» = hay (de eso). «Hi ha pomes? Sí, n'hi ha moltes». Se contraen «en» y «hi»: n'hi."], ["a29#5", "e", "«En» se apostrofa ante vocal: n'he vist dos. «N'» = de eso. «En he vist dos» sería incorrecto."], ["a29#6", "e", "Detrás del infinitivo: -ne. «Vull parlar-ne» = quiero hablar de eso. Con guion."], ["a29#7", "e", "«Pensar en» + lugar o cosa → «hi». «Penses en el viatge? Sí, hi penso». Compáralo con «pensar de» (opinión)."], ["a29#8", "e", "«Anem-hi!» = ¡vamos allí! «Hi» va pegado al imperativo con guion."], ["a29#9", "h", "Pronombre de cantidad ante consonante."], ["a29#9", "e", "«No en vull» = no quiero (de eso). Ante consonante no se apostrofa: en."], ["a29#10", "h", "Pronombre de lugar: dos letras."], ["a29#10", "e", "«No n'hi ha cap» = no hay ninguno. «N'hi ha» es un bloque."], ["a29#11", "h", "Bloque fijo de cuatro letras: n'hi ha + número."], ["a29#11", "e", "«N'hi ha dos» = hay dos. «En» + «hi» + «ha»."], ["a29#12", "t", "Hi + vaig. «Hi vaig en metro» = voy allí en metro."], ["a29#13", "t", "En + tinc + cantidad. «En tinc dos» = tengo dos."], ["a210#1", "e", "Combinación CI + CD: «em» (CI) + «el» (CD) se transforma en «me'l», pero si es la respuesta a «Em dónes…?» el CI es «te». «Te'l dono» = te lo doy. Se apostrofa el CD ante vocal: te'l, te l'he."], ["a210#2", "e", "«Te la porto» = te la llevo. CI «te» + CD «la». No se apostrofa ante consonante."], ["a210#3", "e", "«Te'n deixo» = te dejo (de eso). CI «te» + «en» → te'n. «En» se apostrofa ante vocal."], ["a210#4", "e", "«Te l'he dit» = te lo he dicho. CI «te» + CD «l'» (lo). Ante vocal («he») se apostrofa."], ["a210#5", "e", "«Li ho» = se lo (CI + CD). «Li ho vaig dir ahir» = se lo dije ayer. En catalán no existe la forma «se lo»."], ["a210#6", "e", "Después del infinitivo, los pronombres se unen con guion: «Pots dir-m'ho?» = ¿puedes decírmelo? El orden es CI + CD."], ["a210#7", "e", "«Els ho has explicat?» = ¿se lo has explicado (a ellos)? «Els» es el CI plural; «ho» es el CD."], ["a210#8", "e", "«Dóna-me'l» = dámelo. Imperativo + CI + CD. Se apostrofa el CD ante vocal; aquí el CD es «el»."], ["a210#9", "h", "Dos pronombres juntos: CI (1.ª sing.) y CD neutro. Se escribe con apóstrofo."], ["a210#9", "e", "«No m'ho diguis!» = ¡no me lo digas! Imperativo negativo: pronombres antes del verbo."], ["a210#10", "h", "CI de 2.ª persona del singular: dos letras."], ["a210#10", "e", "«Te'l porto demà» = te lo llevo mañana. «Te» + «el» → te'l."], ["a210#11", "h", "Dos palabras: CI + CD femenino plural."], ["a210#11", "e", "«Te les dono» = te las doy. CI «te» + CD «les» (femenino plural)."], ["a210#12", "t", "Te + el → te'l. «Te'l dono» = te lo doy."], ["a210#13", "t", "Em + ho → m'ho. «M'ho has dit?» = ¿me lo has dicho?"], ["a211#1", "e", "«Per a» indica destinatario o finalidad: «Aquest regal és per a tu». «Per» solo no se usa para destinatario."], ["a211#2", "e", "«Gràcies per» + sustantivo. «Gràcies per tot» = gracias por todo. Compáralo con «per a» que indica destinatario."], ["a211#3", "e", "per + el = pel (contracción obligatoria): «Passo pel parc» = paso por el parque. Plural: pels."], ["a211#4", "e", "«Per a» también indica un plazo límite: «Ho necessito per a demà» = lo necesito para mañana."], ["a211#5", "e", "«Com que» introduce la causa al principio de la frase: «Com que plou, no surto». «Perquè» va después de la consecuencia."], ["a211#6", "e", "«Perquè» (junto) introduce la causa después: «No vinc perquè estic cansat». «Per què» (separado) es la pregunta."], ["a211#7", "e", "Con infinitivo de finalidad se puede usar «per» o «per a» (per aprovar / per a aprovar). Pero con sustantivos o pronombres es mejor «per a»."], ["a211#8", "e", "«És que» introduce una explicación o excusa: «És que no tinc temps». No significa «es que» en sentido literal, sino «es que, lo que pasa es que»."], ["a211#9", "h", "Preposición de tres letras: per."], ["a211#9", "e", "«Gràcies per la teva ajuda» = gracias por tu ayuda. La preposición es «per»."], ["a211#10", "h", "Con destinatario se usa «per a», pero escribe solo la primera palabra."], ["a211#10", "e", "«És un regal per a la Laia» = es un regalo para Laia. «Per a» + persona."], ["a211#11", "h", "Contracción de per + el."], ["a211#11", "e", "«Passem pel carrer» = pasamos por la calle. per + el = pel."], ["a211#12", "t", "Per a + persona. «És un regal per a tu»."], ["a211#13", "t", "Com que + causa, y después consecuencia. «Com que plou, no surto»."], ["a212#1", "e", "Comparativo de superioridad: més + adjetivo + que. «Ell és més alt que jo» = él es más alto que yo."], ["a212#2", "e", "Comparativo de igualdad con adjetivo: tan… com. «Ella és tan simpàtica com tu». Con sustantivo: tant/tants/tanta/tantes."], ["a212#3", "e", "Con sustantivo plural masculino: «tants amics com…». Concuerda con el nombre: tant, tanta, tants, tantes."], ["a212#4", "e", "«Millor» es el comparativo de «bo». Nunca «més bo». «Aquest cafè és millor que aquell»."], ["a212#5", "e", "«Pitjor» es el comparativo de «dolent». Nunca «més dolent». «Aquesta idea és pitjor»."], ["a212#6", "e", "Con números: «més de» / «menys de». «Té més de trenta anys» = tiene más de treinta años. «Que» solo se usa para comparar dos cosas."], ["a212#7", "e", "Superlativo relativo: el més + adjetivo. «És el cotxe més car» = es el coche más caro. Se usa el artículo."], ["a212#8", "e", "Superlativo absoluto: adjetivo + -íssim. Bo → boníssim (la o desaparece). «Molt bo» = boníssim."], ["a212#9", "h", "Comparativo irregular de «bo»: ocho letras."], ["a212#9", "e", "«Millor» = mejor. «Pitjor» = peor. Son los comparativos de bo y dolent."], ["a212#10", "h", "Antónimo de «més»."], ["a212#10", "e", "«Menys» = menos. «Avui fa menys fred que ahir» = hoy hace menos frío que ayer."], ["a212#11", "h", "Contracción de a + el."], ["a212#11", "e", "«Preferir A a B»: «Prefereixo el te al cafè». a + el = al."], ["a212#12", "t", "Més + adjetivo + que. «Barcelona és més gran que Girona». Los nombres propios llevan mayúscula."], ["a212#13", "t", "El millor + sustantivo. «És el millor restaurant» = es el mejor restaurante."], ["a213#1", "e", "«Massa» = demasiado. «Menges massa sal». Es invariable (no concuerda con el nombre)."], ["a213#2", "e", "«Prou» = suficiente, bastante. «No tinc prou diners». Invariable."], ["a213#3", "e", "«Tot el dia» = todo el día. «Tot» concuerda con el nombre y va con artículo: tot el dia, tota la setmana."], ["a213#4", "e", "«Tots els alumnes» = todos los alumnos. Masculino plural: tots; femenino plural: totes."], ["a213#5", "e", "«Tothom» lleva el verbo en singular: «Tothom està content». «Tothom» = todo el mundo."], ["a213#6", "e", "«Ningú» = nadie. «No hi ha ningú». «Algú» = alguien."], ["a213#7", "e", "«Alguna cosa» = algo. «Cosa» es femenino → alguna. «Algun» (masculino) + nombre masculino."], ["a213#8", "e", "«Mig quilo» = medio kilo. «Mig» (masc.) + quilo. Femenino: mitja."], ["a213#9", "h", "Palabra de cuatro letras."], ["a213#9", "e", "«Cada matí» = cada mañana. «Cada» es invariable. «Tots els matins» también."], ["a213#10", "h", "Femenino de «mig»."], ["a213#10", "e", "«Mitja hora» = media hora. Femenino: mitja."], ["a213#11", "h", "Palabra de tres letras: ninguna."], ["a213#11", "e", "«No hi ha cap solució» = no hay ninguna solución. «Cap» + singular."], ["a213#12", "t", "Tot el barri ho sap. «Tot» + artículo + nombre. El pronombre neutro «ho» sustituye a la información."], ["a213#13", "t", "Tinc molts dubtes. «Dubte» es masculino, así que «molts»."], ["a211#7", "o", "pel;;pels;;de"], ["a11 S1", "s", "Para deletrear se dicen los <b>nombres</b> de las letras: «eme-a-erra-i-a». Es la frase típica por teléfono o en una oficina: <b>Com s'escriu?</b> — <b>Es escriu…</b>. Practica con tu nombre y apellidos."], ["a13 S1", "s", "<b>El mejor truco</b>: aprende cada nombre <b>con su artículo</b>. Hay palabras cuyo género no coincide con el castellano: <b>el nas</b> (la nariz), <b>la fi</b> (el fin), <b>el compte</b> (la cuenta), <b>el senyal</b> (la señal). Algunas palabras admiten los dos géneros, como <b>el mar</b> / <b>la mar</b>."], ["a13 S3", "s", "El adjetivo va normalmente <b>después</b> del nombre: <b>un cotxe vermell</b>. Los colores que proceden de un nombre (<b>rosa, taronja, lila, turquesa</b>) tradicionalmente se mantienen invariables (<b>unes faldilles rosa</b>), aunque hoy también se ven con plural (<b>roses, taronges</b>). En este curso usamos la forma invariable."], ["a16 S2", "s", "En catalán central casi siempre se usa <b>aquí</b> y <b>allà</b>; «ahí» se dice <b>aquí</b> o <b>allà</b> según la distancia. <b>Allí</b> también existe. Para decir «por aquí», <b>per aquí</b>."], ["a112 S3", "s", "<b>Mai</b> va con <b>no</b> si va después del verbo (<b>No fumo mai</b>); si va delante, se puede quitar el <b>no</b>: <b>Mai no fumo</b> (forma habitual)."], ["a21 S3", "s", "Fíjate en la posición del pronombre: en el perfet va delante de <b>haver</b> (<b>m'he llevat</b>) y en el perifràstic va delante de <b>vaig</b> (<b>em vaig llevar</b>). Cambia el auxiliar, no el lugar del pronombre."], ["a26 S3", "s", "<b>Soler</b> es regular en presente (sol, sols, sol, solem, soleu, solen) y también se usa en imperfet (<b>solia anar</b> = solía ir). Es un verbo defectivo: casi no existe en otros tiempos."], ["a211 S3", "s", "<b>Com que</b> suele ir <b>al principio</b> de la frase (la razón antes que la consecuencia): <b>Com que plou, no surto</b>. <b>Perquè</b> va después: <b>No surto perquè plou</b>."], ["a216 S1", "s", "Algunos «tu» irregulares: <b>sigues</b> (ser), <b>vés</b> (anar), <b>fes</b> (fer), <b>digues</b> (dir), <b>vine</b> (venir), <b>tingues</b> (tenir). Con <b>vostè</b>: <b>sigui, vagi, faci, digui, vingui, tingui</b>."], ["a218 S1", "s", "Para evitar calcos: <b>pensar en</b> (no «pensar de» para pensar en alguien), <b>somiar en / amb</b>, <b>dependre de</b>, <b>confiar en</b>, <b>preocupar-se per</b>."], ["a218 S3", "s", "<b>Assemblar-se a</b> es parecerse a alguien; <b>semblar</b> es parecer. «Sembla fàcil» = parece fácil; «s'assembla al seu pare» = se parece a su padre."], ["a219 S2", "s", "<b>Tot i que</b> y <b>encara que</b> introducen una concesión. Con <b>encara que</b> es habitual el subjuntivo cuando es hipotético (<b>Encara que plogui, sortirem</b>) y el indicativo cuando es un hecho (<b>Tot i que plou, surto</b>)."], ["a222 S2", "s", "<b>Val la pena</b> + infinitivo = vale la pena: <b>Val la pena anar-hi</b>. <b>Recomanar</b>: <b>Et recomano aquesta sèrie</b>."], ["a223 S2", "s", "<b>Estudiar</b> + materia: <b>estudiar medicina</b>. <b>Cursar</b> también se usa en catalán: <b>He cursat un grau de dret</b>. <b>Estic fent un curs</b> = estoy haciendo un curso."], ["a224 S1", "s", "Los diacríticos de los monosílabos solo se usan en parejas concretas: <b>sí</b> (afirmación) / <b>si</b> (condición), <b>més</b> (más) / <b>mes</b> (mes), <b>té</b> (tiene) / <b>te</b> (infusión). <b>Si no</b> (dos palabras, condición) y <b>sinó</b> (conjunción adversativa) son distintos."]];

const U=['zero','un','dos','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze','tretze','catorze','quinze','setze','disset','divuit','dinou'];
const DEC=['','','vint','trenta','quaranta','cinquanta','seixanta','setanta','vuitanta','noranta'];
function catNum(n){
  if(n<20)return U[n];
  if(n<30)return n===20?'vint':'vint-i-'+U[n-20];
  if(n<100){const d=Math.floor(n/10),u=n%10;return u?DEC[d]+'-'+U[u]:DEC[d]}
  if(n<1000){const c=Math.floor(n/100),r=n%100;const h=c===1?'cent':U[c]+'-cents';return r?h+' '+catNum(r):h}
  if(n<1000000){const m=Math.floor(n/1000),r=n%1000;const h=m===1?'mil':catNum(m)+' mil';return r?h+' '+catNum(r):h}
  return String(n);
}

  return{k:'type',kind:'Lletrejar',p:'Escucha cómo se deletrea un nombre y escríbelo',say:sp,hide:1,ans:n,alts:[n],e:'Es deletrea: '+sp+'.',h:n.length+' letras'}}
function keyToQ(key){try{const t=key[0],r=key.slice(2);
  if(t==='w'){const w=WM[r];return w?vq(w):null}
  if(t==='q'){const[l,i]=r.split('#');return LSM[l]&&LSM[l].qs[+i]?lq(l,+i):null}
  if(t==='v'){const[inf,te,p]=r.split('.');return VERBS[inf]?verbQ(inf,te,+p):null}
  if(t==='s'){const s=SENT[+r];return s?sentQ2(s):null}}catch(e){}return null}
function sentQ2(s){const ex=s.x.length?s.x:pick(SENT.filter(z=>z!==s).flatMap(z=>z.t).filter(w=>!s.t.includes(w)),2);return{k:'build',kind:'Construeix la frase',es:s.es,tok:s.t,extra:[...new Set(ex)].slice(0,2),ans:s.t.join(' '),tip:s.tip,key:'s:'+SENT.indexOf(s)}}
function mixQ(n){const out=[];const usedW=[];const doneL=Object.keys(S.done);const lids=doneL.length?doneL:LESSONS.filter(l=>l.lv==='a1').slice(0,6).map(l=>l.id);
  while(out.length<n){const r=rnd(10);let q=null;
    if(r<4){const l=LSM[lids[rnd(lids.length)]];q=lq(l.id,rnd(l.qs.length))}
    else if(r<7){const sp=seenPool();const w=pickWords(sp.filter(x=>!usedW.includes(x.ca)),1)[0]||sp[rnd(sp.length)];usedW.push(w.ca);q=vq(w)}
    else if(r<9){const vp=vpool();q=verbQ(vp[rnd(vp.length)])}
    else q=sentQ(rnd(2)?'a1':null);
    if(q)out.push(q)}return out}

function record(ok,q){SE.tot++;S.stat.tot++;if(q.key&&q.key.slice(0,2)==='w:')bump(q.key.slice(2),ok);

function gmPlay(mode){JG.stop();const cfg=GS.mem;cfg.mode=mode;const timed=mode==='t',key='mem-'+cfg.id+'-'+mode;let t=90,pairs=0,boards=0,sc=0,moves=0,open=[],lock=false,cards=[],found=0;const t0=Date.now();
  const upd=()=>{const c=$('#jchip');if(c)c.textContent=timed?'⭐ '+sc:moves+' mov.'};
  const six=()=>{const out=[];for(const w of shuf(cfg.words)){if(norm(w.ca)===norm(w.es))continue;if(out.some(x=>norm(x.es)===norm(w.es)||norm(x.ca)===norm(w.ca)||norm(x.ca)===norm(w.es)||norm(x.es)===norm(w.ca)))continue;out.push(w);if(out.length===6)break}return out};
  function board(){const sx=six();cards=[];sx.forEach((w,i)=>cards.push({id:i,ca:1,a:w.em,b:w.ca},{id:i,ca:0,a:'',b:stripA(w.es)}));cards=shuf(cards);open=[];found=0;lock=false;
    $('#jg').innerHTML=cards.map((c,i)=>'<button class="jg-mc" data-i="'+i+'" aria-label="carta"><div><span class="f">❔</span><span class="b">'+(c.ca?'<span>'+c.a+'</span>'+esc(c.b):esc(c.b))+'</span></div></button>').join('');
    $('#jg').querySelectorAll('.jg-mc').forEach(el=>el.onclick=()=>flip(el))}
  function flip(el){const i=+el.dataset.i;if(lock||el.classList.contains('up'))return;el.classList.add('up');open.push(i);if(cards[i].ca)say(cards[i].b);
    if(open.length===2){moves++;const a=cards[open[0]],b=cards[open[1]],els=open.map(k=>$('#jg').children[k]);
      if(a.id===b.id&&a.ca!==b.ca){els.forEach(x=>x.classList.add('done'));open=[];found++;pairs++;sc+=10;upd();
        if(found===6){if(timed){boards++;sc+=20;t=Math.min(120,t+5);upd();lock=true;setTimeout(()=>{if(JG.live)board()},650)}
          else{const s=Math.max(0,Math.round(1000-moves*40-(Date.now()-t0)/1000*6));setTimeout(()=>{if(JG.live)jgResult(cfg.ca+' · Parelles',s,moves+' moviments · '+Math.round((Date.now()-t0)/1000)+' s',key,15,'gmagain')},700)}}}
      else{lock=true;setTimeout(()=>{els.forEach(x=>x.classList.remove('up'));open=[];lock=false},timed?550:800)}if(!timed)upd()}}
  $('#app').innerHTML=jgHead(esc(cfg.ca),timed?'⭐ 0':'0 mov.')+(timed?'<div class="timer"><i id="jtb" style="width:100%"></i></div><p class="muted" style="text-align:center">⏱ <b id="jtt">90</b> s · tauler complet: +20 i +5 s</p>':'<p class="muted" style="text-align:center">Uneix cada paraula catalana amb el seu significat.</p>')+'<div class="jg-g3" id="jg"></div>';
  JG.live=true;board();
  if(timed)JG.t=setInterval(()=>{t--;const e=$('#jtt');if(!e){JG.stop();return}e.textContent=Math.max(t,0);$('#jtb').style.width=Math.max(0,t/90*100)+'%';
    if(t<=0)jgResult(cfg.ca+' · Parelles',sc,pairs+' parelles · '+boards+' taulers complets',key,Math.min(40,Math.round(sc/8)+3),'gmagain')},1000)}

ACT.gat=v=>{GS.at=GS.at.includes(v)?GS.at.filter(x=>x!==v):GS.at.concat(v);showCur()};
function aeItem(cat,cats,mode){const verbs=mode==='tense'?aeVerbs():null;
  for(let n=0;n<80;n++){let inf,t,p=rnd(6);
    if(mode==='tense'){inf=one(verbs);t=cat}else{inf=cat;t='pres'}
    const v=VERBS[inf],f=v.T[t]&&v.T[t][p];if(!f)continue;
    if(mode==='tense'){if(cats.some(o=>o!==t&&v.T[o]&&v.T[o].includes(f)))continue}
    else{if(cats.some(o=>o!==inf&&VERBS[o].T.pres.includes(f)))continue}
    return{txt:PRON_S[p]+' '+f,ty:cat}}
  return null}
ACT.gaego=()=>{const mode=aeTenseMode()?'tense':'verb';JG.stop();
  let sel;if(mode==='tense'){if(GS.at.length<2)return;sel=GS.at.slice()}else{sel=pick(aeVerbs(),3);if(sel.length<2){toast('Encara no hi ha prou verbs');return}}
  const lab=c=>mode==='tense'?VT_NAMES[c][0]:c,dsc=c=>mode==='tense'?VT_NAMES[c][0]+' — '+VT_NAMES[c][2]:c+' ('+VERBS[c].es+')';
  let lives=3,sc=0,tgt=one(sel),items=[],last=0,spawn=0,sp=44,ok=0,pauseT=0;
  $('#app').innerHTML=jgHead('Pluja de verbs','')+'<div class="jg-target">Toca només les formes de <b id="jtg"></b></div><div class="jg-arena" id="jar"></div><p class="muted" style="text-align:center;margin-top:10px">'+(mode==='tense'?'Temps':'Verbs')+' en joc: '+sel.map(lab).join(' · ')+'</p>';
  const setT=()=>{$('#jtg').textContent=dsc(tgt)};setT();
  const hud=()=>{const c=$('#jchip');if(c)c.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)+' · '+sc};
  const note=(html,cls,top)=>{const ar=$('#jar');if(!ar)return null;const n=document.createElement('div');n.className='jg-notice '+(cls||'');if(top)n.style.top=top;n.innerHTML=html;ar.appendChild(n);return n};
  const lose=()=>{lives--;hud();if(lives<=0){JG.live=false;jgResult('Pluja de verbs',sc,ok+' encerts','ae',Math.min(40,ok*2+2),'gaego','<p class="muted">'+sel.map(lab).join(' · ')+'</p>')}};
  const announce=()=>{pauseT=1.6;items.forEach(o=>{o.dead=1;o.el.remove()});items=[];spawn=1.2;const lvl=Math.floor(ok/6)+1;
    const n=note('<span>Canvi! · Nivell '+lvl+'</span><b>Ara: '+esc(lab(tgt))+'</b>');const tg=document.querySelector('.jg-target');if(tg)tg.classList.add('chg');try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
    setTimeout(()=>{if(n)n.remove();if(tg)tg.classList.remove('chg')},1600)};
  const add=()=>{const good=Math.random()<.45,cat=good?tgt:one(sel.filter(x=>x!==tgt)),it=aeItem(cat,sel,mode),ar=$('#jar');if(!ar||!it)return;
    const el=document.createElement('div');el.className='jg-fall';el.textContent=it.txt;ar.appendChild(el);
    const w=ar.clientWidth-el.offsetWidth-6,o={el,y:-50,ty:it.ty};el.style.left=Math.max(2,rnd(Math.max(w,2)))+'px';items.push(o);
    el.onclick=()=>{if(o.dead)return;o.dead=1;
      if(o.ty===tgt){sc+=10;ok++;S.stat.verb++;el.classList.add('good');sp=Math.min(100,44+Math.floor(ok/6)*2.5);
        if(ok%20===0&&lives<3){lives++;const n=note('<span>20 encerts</span><b>+1 ❤️</b>','heal','25%');setTimeout(()=>n&&n.remove(),1100)}
        hud();if(ok%6===0){tgt=one(sel.filter(x=>x!==tgt));setT();announce()}}
      else{el.classList.add('bad');lose()}
      setTimeout(()=>el.remove(),250);items=items.filter(x=>x!==o)}};
  const loop=ts=>{if(!JG.live||!$('#jar'))return;if(!last)last=ts;const dt=Math.min(.1,(ts-last)/1000);last=ts;
    if(pauseT>0){pauseT-=dt;JG.r=requestAnimationFrame(loop);return}
    spawn-=dt;if(spawn<=0){add();spawn=Math.max(.9,1.6-Math.floor(ok/6)*.03)}
    const H=$('#jar').clientHeight;items.slice().forEach(o=>{o.y+=sp*dt;o.el.style.transform='translateY('+o.y+'px)';if(o.y>H-34){o.dead=1;o.el.remove();items=items.filter(x=>x!==o);if(o.ty===tgt)lose()}});
    JG.r=requestAnimationFrame(loop)};
  JG.live=true;hud();JG.r=requestAnimationFrame(loop)};
